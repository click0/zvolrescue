name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - run: cargo build --release
      - run: ./target/release/zvolrescue --version
      - name: Smoke-test scan on fixture members
        run: |
          cargo run -p zfs-read --example mkfixture -- /tmp/fx mirror 12
          ./target/release/zvolrescue scan /tmp/fx/member0.img /tmp/fx/member1.img
          ./target/release/zvolrescue -f json -vv scan /tmp/fx/member0.img | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["pools"][0]["readable"]; assert d["devices"][0]["config"]["ashift"] == 12'

  freebsd:
    name: FreeBSD 14 (ports rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          prepare: pkg install -y rust
          run: |
            cargo test --all-targets
            cargo build --release
            ./target/release/zvolrescue --version
