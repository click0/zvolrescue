name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - run: cargo build --release
      - run: ./target/release/zvolrescue --version
      - name: The version and the CHANGELOG say the same thing
        run: |
          # The release workflow takes the tag's CHANGELOG section as
          # the notes and refuses a tag that has none — but it only
          # finds out at release time, with the tag already pushed and
          # nowhere to put the fix. Here it is still a branch.
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "workspace version: $v"
          test -n "$v"
          for f in CHANGELOG.md CHANGELOG.uk.md; do
            grep -q "^## v$v — " "$f" || { echo "::error::$f has no '## v$v — date' section"; exit 1; }
          done
          # The section's lead line becomes the release title, so it has
          # to be there.
          awk -v want="v$v" '$0 ~ "^## " want { p=1; next } /^## / && p { exit } p { print }' CHANGELOG.md |
            grep -q '^\*\*' || { echo "::error::the v$v section has no **lead line** for the release title"; exit 1; }
          test "$(./target/release/zvolrescue --version)" = "zvolrescue $v"
          # What a release announces is decided by this, so it is
          # checked here and not only when a tag is already pushed.
          python3 .github/changelog-notes.py --self-test
          printf 'v0.0.0\n' > /tmp/released.txt
          python3 .github/changelog-notes.py "$v" CHANGELOG.md /tmp/released.txt > /dev/null
      - name: End-to-end on fixture members (scan, list, dump)
        run: |
          cargo run -p zfs-read --example mkfixture -- /tmp/fx mirror 12
          ./target/release/zvolrescue scan /tmp/fx/member0.img /tmp/fx/member1.img
          ./target/release/zvolrescue -f json -vv scan /tmp/fx/member0.img | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["pools"][0]["readable"]; assert d["devices"][0]["config"]["ashift"] == 12'
          # Newest TXG: the volume has been destroyed; the previous TXG still has it.
          ./target/release/zvolrescue list -r /tmp/fx/member0.img /tmp/fx/member1.img --diff 4816229
          ./target/release/zvolrescue -f json list -r /tmp/fx/member0.img | python3 -c 'import json,sys; d=json.load(sys.stdin); names=[x["name"] for x in d["datasets"]]; assert names == ["tank","tank/vm"], names'
          ./target/release/zvolrescue -f json list -r /tmp/fx/member0.img --txg 4816229 | python3 -c 'import json,sys; d=json.load(sys.stdin); names=[x["name"] for x in d["datasets"]]; assert names == ["tank","tank/vm","tank/vm/disk0","tank/vm/disk0@before"], names; assert d["datasets"][2]["volsize"] == 33554432'
          ./target/release/zvolrescue -f json list -r /tmp/fx/member0.img --diff 4816229 | python3 -c 'import json,sys; d=json.load(sys.stdin); gone=[x["name"] for x in d["diff"]["destroyed_since"]]; assert gone == ["tank/vm/disk0","tank/vm/disk0@before"], gone'
          # dump without --txg must find the last TXG that still had the volume (SPEC F-40).
          ./target/release/zvolrescue -f json dump tank/vm/disk0 /tmp/fx/member0.img /tmp/fx/member1.img -o /tmp/disk0.img --evidence-log /tmp/ev.jsonl | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["volumes"][0]["txg"] == 4816229, d["volumes"]; assert d["txgs_searched"] == [4816230, 4816229], d["txgs_searched"]'
          echo "febfe0108392728dbde89ee63f9f25419a0192ac04420db3ad88b0032a088585  /tmp/disk0.img" | sha256sum -c -
          test "$(stat -c %s /tmp/disk0.img)" = 33554432
          # Damage block 0 on one member: the mirror copy must heal it, a lone damaged member must not.
          cp /tmp/fx/member0.img /tmp/bad.img
          printf '\xff' | dd of=/tmp/bad.img bs=1 seek=$((4*1024*1024 + 0x200000 + 4096 + 5)) conv=notrunc status=none
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/bad.img /tmp/fx/member1.img -o /tmp/healed.img
          cmp /tmp/disk0.img /tmp/healed.img
          if ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/bad.img -o /tmp/partial.img --strict; then echo "strict must fail"; exit 1; else test $? = 4; fi
          if ./target/release/zvolrescue dump tank/vm/disk0 /tmp/fx/member0.img -o /tmp/fx/member0.img; then echo "must refuse"; exit 1; else test $? = 5; fi
      - name: Zero point of a member whose labels are gone (SPEC F-61)
        run: |
          # Erase all four vdev_phys areas, leaving only the uberblock rings.
          python3 - <<'EOF'
          import os, shutil
          LABEL, PHYS_OFF, PHYS = 256*1024, 16*1024, 112*1024
          shutil.copy("/tmp/fx/member0.img", "/tmp/nolabel.img")
          size = os.path.getsize("/tmp/nolabel.img")
          aligned = size & ~(LABEL-1)
          with open("/tmp/nolabel.img", "r+b") as f:
              for off in (0, LABEL, aligned-2*LABEL, aligned-LABEL):
                  f.seek(off + PHYS_OFF); f.write(b"\0" * PHYS)
          # The same member 1 MiB further along: a partition that moved.
          data = open("/tmp/nolabel.img", "rb").read()
          open("/tmp/moved.img", "wb").write(b"\x5a" * (1 << 20) + data)
          EOF
          ./target/release/zvolrescue scan /tmp/nolabel.img /tmp/moved.img
          ./target/release/zvolrescue -f json scan /tmp/nolabel.img | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"][0]; assert d.get("config") is None; z=d["zero_point"][0]; assert z["base"] == 0, z; assert z["anchors"] >= 4, z; assert z["labels"] == ["L0","L1","L2","L3"], z'
          ./target/release/zvolrescue -f json scan /tmp/moved.img | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"][0]; z=d["zero_point"][0]; assert z["base"] == 1048576, z; assert z["psize"] == 67108864, z'
          # An intact member is not searched unless asked, and then agrees.
          ./target/release/zvolrescue -f json scan /tmp/fx/member0.img | python3 -c 'import json,sys; assert "zero_point" not in json.load(sys.stdin)["devices"][0]'
          ./target/release/zvolrescue -f json scan --zero-point /tmp/fx/member0.img | python3 -c 'import json,sys; z=json.load(sys.stdin)["devices"][0]["zero_point"]; assert z[0]["base"] == 0, z'
          # Nothing to anchor to: no candidate is invented.
          head -c 33554432 /dev/zero > /tmp/blank.img
          ./target/release/zvolrescue -f json scan --zero-point /tmp/blank.img | python3 -c 'import json,sys; assert "zero_point" not in json.load(sys.stdin)["devices"][0]'
          # A member whose labels are intact but which starts 3 MiB in:
          # list and dump must read it through the recovered base. The
          # move is a whole number of labels, so the rear pair even parses
          # at base 0 — with a checksum that does not verify there.
          python3 -c 'data=open("/tmp/fx/member0.img","rb").read(); open("/tmp/moved-intact.img","wb").write(b"\x5a"*(3<<20)+data)'
          ./target/release/zvolrescue -f json list -r /tmp/moved-intact.img --txg 4816229 | python3 -c 'import json,sys; d=json.load(sys.stdin); names=[x["name"] for x in d["datasets"]]; assert names == ["tank","tank/vm","tank/vm/disk0","tank/vm/disk0@before"], names'
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/moved-intact.img -o /tmp/moved.img --txg 4816229
          cmp /tmp/disk0.img /tmp/moved.img
      - name: A member inside a whole-disk image (SPEC F-06, F-60)
        run: |
          python3 - <<'EOF'
          import struct
          member = open("/tmp/fx/member0.img", "rb").read()
          sector, start_lba = 512, 4096
          disk = bytearray(sector * (start_lba + len(member)//sector + 4096))
          disk[510], disk[511] = 0x55, 0xAA          # protective MBR
          disk[446+4] = 0xee
          struct.pack_into("<I", disk, 446+8, 1)
          struct.pack_into("<I", disk, 446+12, 0xffffffff)
          disk[sector:sector+8] = b"EFI PART"        # GPT header at LBA 1
          struct.pack_into("<I", disk, sector+80, 2)
          struct.pack_into("<I", disk, sector+84, 128)
          def guid_le(g):
              hx = bytes.fromhex(g.replace("-", ""))
              return struct.pack("<IHH", int.from_bytes(hx[0:4], "big"),
                                 int.from_bytes(hx[4:6], "big"),
                                 int.from_bytes(hx[6:8], "big")) + hx[8:16]
          def entry(kind, first, last, name):
              e = bytearray(128)
              e[0:16] = guid_le(kind)
              e[16:32] = b"\x22" * 16
              struct.pack_into("<Q", e, 32, first)
              struct.pack_into("<Q", e, 40, last)
              n = name.encode("utf-16-le")
              e[56:56+len(n)] = n
              return e
          entries = entry("0fc63daf-8483-4772-8e79-3d69d8477de4", 2048, 4095, "boot")
          entries += entry("6a898cc3-1dd2-11b2-99a6-080020736631", start_lba,
                           start_lba + len(member)//sector - 1, "zfs0")
          disk[sector*2:sector*2+len(entries)] = entries
          disk[start_lba*sector:start_lba*sector+len(member)] = member
          open("/tmp/fx/wholedisk.img", "wb").write(bytes(disk))
          EOF
          ./target/release/zvolrescue scan /tmp/fx/wholedisk.img
          ./target/release/zvolrescue -f json scan /tmp/fx/wholedisk.img | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"][0]; t=d["partitions"]; assert t["scheme"] == "gpt", t; assert [p["zfs"] for p in t["partitions"]] == [False, True], t; assert d["vdev_base"] == 2097152, d; assert d["vdev_base_from"] == "partition table", d; assert all(l["config_checksum"] == "ok" for l in d["labels"]), d["labels"]'
          # The pool inside it reads: the partition says where the vdev
          # starts and how long it is, so all four labels are where they
          # should be, and the volume comes back bit-exact.
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/fx/wholedisk.img --txg 4816229 -o /tmp/fx/from-disk.img
          cmp /tmp/disk0.img /tmp/fx/from-disk.img

      - name: A pool with no labels at all, read through a hand-written layout (SPEC F-65)
        run: |
          cargo run -q -p zfs-read --example mkfixture -- /tmp/hz raidz2 12
          python3 - <<'EOF'
          import json
          LABEL, PHYS_OFF, PHYS = 256*1024, 16*1024, 112*1024
          paths = []
          for i in range(4):
              b = bytearray(open(f"/tmp/hz/member{i}.img", "rb").read())
              aligned = len(b) & ~(LABEL-1)
              for off in (0, LABEL, aligned-2*LABEL, aligned-LABEL):
                  b[off+PHYS_OFF:off+PHYS_OFF+PHYS] = b"\0" * PHYS
              out = f"/tmp/hz/nolabel{i}.img"
              open(out, "wb").write(bytes(b))
              paths.append(out)
          json.dump({"name": "tank", "ashift": 12,
                     "tops": [{"kind": "raidz", "nparity": 2, "members": paths}]},
                    open("/tmp/hz/hints.json", "w"))
          EOF
          # Not one label survives: without the layout there is no pool.
          if ./target/release/zvolrescue -q list /tmp/hz/nolabel0.img /tmp/hz/nolabel1.img /tmp/hz/nolabel2.img /tmp/hz/nolabel3.img; then echo "must not read"; exit 1; else test $? = 2; fi
          # With it, the uberblocks the zero-point search confirmed carry
          # the rest: datasets, TXG history and the volume itself.
          ./target/release/zvolrescue -f json list -r /tmp/hz/nolabel0.img /tmp/hz/nolabel1.img /tmp/hz/nolabel2.img /tmp/hz/nolabel3.img --hints /tmp/hz/hints.json --txg 4816229 | python3 -c 'import json,sys; d=json.load(sys.stdin); names=[x["name"] for x in d["datasets"]]; assert names == ["tank","tank/vm","tank/vm/disk0","tank/vm/disk0@before"], names'
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/hz/nolabel0.img /tmp/hz/nolabel1.img /tmp/hz/nolabel2.img /tmp/hz/nolabel3.img --hints /tmp/hz/hints.json --txg 4816229 -o /tmp/hz/out.img
          cmp /tmp/disk0.img /tmp/hz/out.img
          # The order in a layout is what a DVA addresses, and a wrong one
          # costs redundancy rather than correctness: --search-order finds
          # the order no block has to be repaired around (SPEC F-66).
          python3 -c 'import json; d=json.load(open("/tmp/hz/hints.json")); m=d["tops"][0]["members"]; m[1],m[2]=m[2],m[1]; json.dump(d, open("/tmp/hz/swapped.json","w"))'
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/hz/nolabel0.img /tmp/hz/nolabel1.img /tmp/hz/nolabel2.img /tmp/hz/nolabel3.img --hints /tmp/hz/swapped.json --search-order --txg 4816229 -o /tmp/hz/searched.img 2>/tmp/hz/search.err
          cmp /tmp/disk0.img /tmp/hz/searched.img
          grep -q "best has 0 checksum mismatch" /tmp/hz/search.err
          grep -q "just as good" /tmp/hz/search.err && { echo "the right order must be unique here"; exit 1; } || true
          # The layout can be handed on as a label (SPEC F-67): placed on
          # a *copy* of each member, it makes the pool readable with no
          # hints at all. The image stops before the uberblock ring, so
          # the uberblocks already on the disk survive it.
          for i in 0 1 2 3; do
            ./target/release/zvolrescue -q scan /tmp/hz/nolabel0.img /tmp/hz/nolabel1.img /tmp/hz/nolabel2.img /tmp/hz/nolabel3.img --hints /tmp/hz/hints.json --emit-label /tmp/hz/L-$i.bin --emit-for 0:$i
            test "$(stat -c %s /tmp/hz/L-$i.bin)" = 131072
            cp /tmp/hz/nolabel$i.img /tmp/hz/relabel$i.img
            dd if=/tmp/hz/L-$i.bin of=/tmp/hz/relabel$i.img conv=notrunc status=none
          done
          ./target/release/zvolrescue -f json scan /tmp/hz/relabel0.img | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"][0]; assert d["config"]["ashift"] == 12, d["config"]; assert d["labels"][0]["verified"] > 0, d["labels"][0]'
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/hz/relabel0.img /tmp/hz/relabel1.img /tmp/hz/relabel2.img /tmp/hz/relabel3.img --txg 4816229 -o /tmp/hz/from-labels.img
          cmp /tmp/disk0.img /tmp/hz/from-labels.img
          # A layout that names a member which was not given is a usage error.
          python3 -c 'import json; d=json.load(open("/tmp/hz/hints.json")); d["tops"][0]["members"][0]="/tmp/nowhere.img"; json.dump(d, open("/tmp/hz/bad.json","w"))'
          if ./target/release/zvolrescue -q list /tmp/hz/nolabel0.img /tmp/hz/nolabel1.img /tmp/hz/nolabel2.img /tmp/hz/nolabel3.img --hints /tmp/hz/bad.json; then exit 1; else test $? = 1; fi
      - name: Bulk extraction and resume
        run: |
          ./target/release/zvolrescue -q dump -r tank /tmp/fx/member0.img /tmp/fx/member1.img -o /tmp/bulk --txg 4816229
          python3 -c 'import json; m=json.load(open("/tmp/bulk/manifest.json")); assert [v["dataset"] for v in m["volumes"]] == ["tank/vm/disk0"], m; assert m["volumes"][0]["sha256"] == "febfe0108392728dbde89ee63f9f25419a0192ac04420db3ad88b0032a088585"'
          cmp /tmp/disk0.img /tmp/bulk/tank_vm_disk0.img
          # Resume: pretend a run stopped after block 2 (16 KiB written), continue, same hash.
          head -c 16384 /tmp/disk0.img > /tmp/resume.img
          printf '{"version":1,"dataset":"tank/vm/disk0","dataset_guid":"0x00000000000000a3","txg":4816229,"volsize":33554432,"blocksize":8192,"blocks_done":2}' > /tmp/resume.img.resume.json
          ./target/release/zvolrescue -f json dump tank/vm/disk0 /tmp/fx/member0.img /tmp/fx/member1.img -o /tmp/resume.img --resume | python3 -c 'import json,sys; d=json.load(sys.stdin)["volumes"][0]; assert d["resumed_from_block"] == 2, d; assert d["blocks_read"] == 1, d; assert d["sha256"] == "febfe0108392728dbde89ee63f9f25419a0192ac04420db3ad88b0032a088585"'
          cmp /tmp/disk0.img /tmp/resume.img
          test ! -e /tmp/resume.img.resume.json
      - name: The pool's history from its transaction groups (COMPANIONS T-01…T-05, T-10)
        run: |
          ./target/release/zvoltimeline --version
          ./target/release/zvoltimeline /tmp/fx/member0.img /tmp/fx/member1.img
          # The fixture's newest TXG no longer has the volume; the one
          # before it does. That is exactly what the timeline must say,
          # and it must say which TXG to go back to (T-05).
          ./target/release/zvoltimeline -f json /tmp/fx/member0.img /tmp/fx/member1.img > /tmp/tl.json
          python3 - <<'EOF'
          import json
          d = json.load(open("/tmp/tl.json"))
          assert d["txgs"] == [4816228, 4816229, 4816230], d["txgs"]
          assert d["unreadable_txgs"] == [], d["unreadable_txgs"]
          ev = {(e["event"], e.get("object")): e for e in d["events"]}
          gone = ev[("destroyed", "tank/vm/disk0")]
          assert gone["txg"] == 4816230, gone
          assert gone["last_seen_txg"] == 4816229, gone
          assert ("snapshot-destroyed", "tank/vm/disk0@before") in ev
          # Every dataset of a modern pool has an origin; none of these is
          # a clone (SPEC: dsl_dir_is_clone, not dd_origin_obj != 0).
          assert not [e for e in d["events"] if e["event"] == "clone"], d["events"]
          assert ("host", None) in ev, d["events"]
          open("/tmp/recover.sh", "w").write(gone["recover_with"] + "\n")
          EOF
          # The command it printed is the command that gets the volume
          # back, byte for byte (COMPANIONS §2.4).
          cat /tmp/recover.sh
          ( cd /tmp && PATH="$GITHUB_WORKSPACE/target/release:$PATH" sh recover.sh )
          cmp /tmp/disk0.img /tmp/tank_vm_disk0.img
          # T-10: the same evidence gives the same bytes.
          ./target/release/zvoltimeline -f json /tmp/fx/member0.img /tmp/fx/member1.img > /tmp/tl2.json
          cmp /tmp/tl.json /tmp/tl2.json
          # T-07: what ZFS has finished with but has not freed. On the
          # fixture nothing is pending, which is itself the right answer
          # and has to be said rather than left out.
          ./target/release/zvoltimeline -f json --pending /tmp/fx/member0.img /tmp/fx/member1.img | python3 -c 'import json,sys; e=[x for x in json.load(sys.stdin)["events"] if x["event"] == "pending"]; assert len(e) == 3, e; assert all("0 byte(s) not yet freed" in x["details"] for x in e), e'
          # T-08: one object, by name and by GUID.
          ./target/release/zvoltimeline -f json --dataset tank/vm/disk0 /tmp/fx/member0.img | python3 -c 'import json,sys; e=json.load(sys.stdin)["events"]; assert {x["object"] for x in e} == {"tank/vm/disk0"}, e; open("/tmp/guid","w").write(e[0]["guid"])'
          ./target/release/zvoltimeline -f json --dataset "$(cat /tmp/guid)" /tmp/fx/member0.img | python3 -c 'import json,sys; e=json.load(sys.stdin)["events"]; assert {x["object"] for x in e} == {"tank/vm/disk0"}, e'
          # A range with nothing in it is answered, not guessed at.
          if ./target/release/zvoltimeline --from 1 --to 2 /tmp/fx/member0.img; then echo "must fail"; exit 1; else test $? = 3; fi
          # Never a write to the evidence.
          sha256sum /tmp/fx/member0.img /tmp/fx/member1.img > /tmp/fx.sums
          ./target/release/zvoltimeline /tmp/fx/member0.img /tmp/fx/member1.img -o /tmp/tl.txt
          sha256sum -c /tmp/fx.sums
      - name: The case file, and checking it back (COMPANIONS R-01…R-07)
        run: |
          ./target/release/zvolreport --version
          rm -rf /tmp/case && mkdir -p /tmp/case && cd /tmp/case
          B="$GITHUB_WORKSPACE/target/release"
          # UC-1 end to end, every step appending to one evidence log.
          "$B/zvolrescue" -q --hash-inputs scan /tmp/fx/member0.img /tmp/fx/member1.img --evidence-log case.jsonl
          "$B/zvoltimeline" /tmp/fx/member0.img /tmp/fx/member1.img -o timeline.txt --evidence-log case.jsonl
          "$B/zvolrescue" -q dump tank/vm/disk0 /tmp/fx/member0.img /tmp/fx/member1.img --txg 4816229 -o disk0.img --evidence-log case.jsonl
          "$B/zvolreport" build case.jsonl -o report.json --md report.md --case 42 --examiner "CI" --note "fixture pool"
          python3 - <<'EOF'
          import json
          r = json.load(open("/tmp/case/report.json"))
          assert r["case"] == "42" and r["examiner"] == "CI", r
          assert [t["tool"] for t in r["tools"]] == ["zvolrescue", "zvoltimeline"], r["tools"]
          # Every command, in the order it ran, with its exit code.
          assert [c["status"] for c in r["commands"]] == [0, 0, 0], r["commands"]
          assert len(r["commands"]) == 3, r["commands"]
          # --hash-inputs was given, so the evidence carries hashes.
          assert all(e["sha256"] for e in r["evidence"]), r["evidence"]
          assert r["pools"][0]["name"] == "tank", r["pools"]
          assert r["pools"][0]["txg_window"] == [4816228, 4816230], r["pools"]
          e = r["extractions"][0]
          assert e["dataset"] == "tank/vm/disk0" and e["txg"] == 4816229, e
          assert e["sha256"] == "febfe0108392728dbde89ee63f9f25419a0192ac04420db3ad88b0032a088585", e
          assert e["errors"] == 0 and not e["aborted"], e
          assert r.get("warnings", []) == [], r["warnings"]
          assert "tank/vm/disk0" in open("/tmp/case/report.md").read()
          EOF
          # R-03: the same log and flags, byte for byte.
          "$B/zvolreport" build case.jsonl -o again.json --case 42 --examiner "CI" --note "fixture pool" >/dev/null
          cmp report.json again.json
          # R-04: everything still matches what was recorded.
          "$B/zvolreport" verify report.json
          # R-07: a signature over the exact bytes of report.json, in a
          # form somebody without this tool can check. openssl is the
          # oracle in both directions: it reads the key we wrote, we read
          # the key it wrote, it verifies our signature and we verify its.
          "$B/zvolreport" keygen -o case.key
          test "$(stat -c %a case.key)" = 600
          openssl pkey -in case.key -pubout -out ours-by-openssl.pub
          cmp ours-by-openssl.pub case.key.pub
          openssl genpkey -algorithm ed25519 -out theirs.key
          openssl pkey -in theirs.key -pubout -out theirs.pub
          "$B/zvolreport" build case.jsonl -o signed.json --case 42 --examiner "CI" --note "fixture pool" --sign theirs.key >/dev/null
          # Signing says nothing new about the document: R-03 still holds.
          cmp report.json signed.json
          openssl pkeyutl -verify -pubin -inkey theirs.pub -rawin -in signed.json -sigfile signed.json.sig
          "$B/zvolreport" verify signed.json --key theirs.pub
          openssl pkeyutl -sign -inkey theirs.key -rawin -in signed.json -out openssl.sig
          "$B/zvolreport" verify signed.json --key theirs.pub --signature openssl.sig
          # The wrong key, an edited value, a byte appended, and no
          # signature at all: each of them exits 4.
          "$B/zvolreport" build case.jsonl -o mine.json --case 42 --sign case.key >/dev/null
          if "$B/zvolreport" verify mine.json --key theirs.pub; then echo "must fail"; exit 1; else test $? = 4; fi
          sed 's/"case": "42"/"case": "43"/' signed.json > edited.json
          cp signed.json.sig edited.json.sig
          if "$B/zvolreport" verify edited.json --key theirs.pub; then echo "must fail"; exit 1; else test $? = 4; fi
          printf 'x' >> edited.json
          if "$B/zvolreport" verify edited.json --key theirs.pub; then echo "must fail"; exit 1; else test $? = 4; fi
          rm -f mine.json.sig
          if "$B/zvolreport" verify mine.json --key case.key.pub; then echo "must fail"; exit 1; else test $? = 4; fi
          # One byte of the extracted image, and it does not.
          printf '\xff' | dd of=disk0.img bs=1 seek=4096 conv=notrunc status=none
          if "$B/zvolreport" verify report.json; then echo "must fail"; exit 1; else test $? = 4; fi
          "$B/zvolreport" -f json verify report.json | python3 -c 'import json,sys; d=json.load(sys.stdin); bad=[c for c in d["checked"] if c["status"] == "fail"]; assert len(bad) == 1 and bad[0]["path"].endswith("disk0.img"), d'
          # A file that is gone breaks the chain as surely as one that changed.
          rm disk0.img
          if "$B/zvolreport" verify report.json; then echo "must fail"; exit 1; else test $? = 4; fi
          # R-01: a record format this build does not read is refused, not skipped.
          sed 's/"v":1/"v":2/' case.jsonl > future.jsonl
          if "$B/zvolreport" build future.jsonl -o no.json; then echo "must fail"; exit 1; else test $? = 2; fi
          echo '{"hello":1}' > junk.jsonl
          if "$B/zvolreport" build junk.jsonl -o no.json; then echo "must fail"; exit 1; else test $? = 2; fi
          cd "$GITHUB_WORKSPACE"
      - name: A volume no uberblock leads to, found by carving (COMPANIONS §3.4)
        run: |
          ./target/release/zvolcarve --version
          # The same pool, with the volume on the members and no
          # uberblock mentioning it at any transaction group.
          cargo run -q -p zfs-read --example mkfixture -- /tmp/cv mirror 12 carved
          ./target/release/zvolrescue -f json list -r /tmp/cv/member0.img /tmp/cv/member1.img | python3 -c 'import json,sys; n=[d["name"] for d in json.load(sys.stdin)["datasets"]]; assert n == ["tank","tank/vm"], n'
          # A walk cannot find it. A scan of raw space can.
          rm -rf /tmp/carve
          ./target/release/zvolcarve -q scan /tmp/cv/member0.img /tmp/cv/member1.img -o /tmp/carve
          ./target/release/zvolcarve list /tmp/carve
          python3 - <<'EOF'
          import json
          i = json.load(open("/tmp/carve/candidates.json"))
          best = i["candidates"][0]
          assert best["dnode_type_code"] == 23, best        # DMU_OT_ZVOL
          assert best["volblocksize"] == 8192, best
          assert not best.get("profile_misses"), best
          assert best["assessment"]["blocks_failed"] == 0, best
          assert best["assessment"]["agreement"] == 1.0, best
          # Everything that failed the profile ranks below everything
          # that matched it, whatever else it has going for it (C-18).
          matched = [c["score"] for c in i["candidates"] if not c.get("profile_misses")]
          missed = [c["score"] for c in i["candidates"] if c.get("profile_misses")]
          assert min(matched) > 0.5 > max(missed, default=0.0), (matched, missed)
          open("/tmp/carve/best", "w").write(best["id"])
          EOF
          # C-12: the dnode says four blocks of 8 KiB, and the volume was
          # made for 32 MiB. Only what is inside it knows that, and it is
          # the number `dump` must use when none is given.
          python3 -c 'import json; c=json.load(open("/tmp/carve/candidates.json"))["candidates"][0]; f=c["contents"][0]; assert f["kind"] == "ext2/3/4", c["contents"]; assert f["size"] == 33554432, f; assert f["label"] == "fixture", f; assert c["implied_size"] == 32768, c'
          # And it comes out byte for byte what the walked extraction
          # gives — with no size given at all.
          ./target/release/zvolcarve dump /tmp/carve "$(cat /tmp/carve/best)" /tmp/cv/member0.img /tmp/cv/member1.img -o /tmp/carved.img
          test "$(stat -c %s /tmp/carved.img)" = 33554432
          echo "febfe0108392728dbde89ee63f9f25419a0192ac04420db3ad88b0032a088585  /tmp/carved.img" | sha256sum -c -
          cmp /tmp/disk0.img /tmp/carved.img
          # C-09: the same on raidz2. A dnode is 512 bytes and lies whole
          # inside one allocation sector on one column, so recognition
          # works there too; the extraction goes through the pool, so it
          # works with members missing.
          cargo run -q -p zfs-read --example mkfixture -- /tmp/cvz raidz2 12 carved
          rm -rf /tmp/carvez
          ./target/release/zvolcarve -q scan /tmp/cvz/member0.img /tmp/cvz/member1.img /tmp/cvz/member2.img /tmp/cvz/member3.img -o /tmp/carvez
          python3 - <<'EOF'
          import json
          best = json.load(open("/tmp/carvez/candidates.json"))["candidates"][0]
          assert best["dnode_type_code"] == 23, best
          assert best["assessment"]["agreement"] == 1.0, best
          open("/tmp/carvez/best", "w").write(best["id"])
          EOF
          ./target/release/zvolcarve -q dump /tmp/carvez "$(cat /tmp/carvez/best)" /tmp/cvz/member0.img /tmp/cvz/member1.img /tmp/cvz/member2.img /tmp/cvz/member3.img -o /tmp/carvedz.img
          cmp /tmp/disk0.img /tmp/carvedz.img
          # Two of four members gone: rebuilt from parity, same bytes.
          ./target/release/zvolcarve -q dump /tmp/carvez "$(cat /tmp/carvez/best)" /tmp/cvz/member1.img /tmp/cvz/member3.img -o /tmp/carvedz2.img
          cmp /tmp/disk0.img /tmp/carvedz2.img
          # C-11: a candidate is named by a dataset dnode the scan met,
          # since names themselves live in the MOS a carve cannot reach.
          python3 - <<'EOF'
          import json
          i = json.load(open("/tmp/carve/candidates.json"))
          assert i["datasets_met"] > 0, i["datasets_met"]
          best = i["candidates"][0]
          assert best["dataset_guid"] == "0x00000000000000a3", best
          assert best["dataset_creation_txg"] == 30, best
          EOF
          # C-06 on a pool whose configuration says where its metaslabs
          # are but whose MOS has no such object: the space has to come
          # back unaccounted for, by name, never as free. "We could not
          # look" and "it is free" are opposite answers for a recovery.
          python3 - <<'EOF'
          import json
          i = json.load(open("/tmp/carve/candidates.json"))
          space = i["space"]
          assert space["vdevs_read"] == 0, space
          assert space["skipped"], space
          a = i["candidates"][0]["assessment"]
          assert a["blocks_free"] == 0 and a["blocks_allocated"] == 0, a
          assert a["blocks_unknown"] > 0, a
          EOF
          # C-10: the compressions tried are the operator's to choose, and
          # dropping the one a pool used finds nothing at all. The
          # fixture's metadata is plaintext, so the plaintext pass alone
          # must still find the volume — and every codec named must be
          # one this build knows.
          rm -rf /tmp/carve-plain
          ./target/release/zvolcarve -f json scan /tmp/cv/member0.img -o /tmp/carve-plain --compressed none | python3 -c 'import json,sys; d=json.load(sys.stdin); z=[c for c in d["candidates"] if c["dnode_type_code"] == 23]; assert z, d["rejected"]; assert all(c["found"] == "plaintext" for c in d["candidates"]), d["candidates"][:2]'
          if ./target/release/zvolcarve -q scan /tmp/cv/member0.img -o /tmp/carve-plain --compressed lz4,nope; then echo "must fail"; exit 1; else test $? = 1; fi
          # C-19: with --sample, what is on the disk instead of a filter.
          rm -rf /tmp/carve-s
          ./target/release/zvolcarve -f json scan /tmp/cv/member0.img -o /tmp/carve-s --sample 50 | python3 -c 'import json,sys; h=json.load(sys.stdin)["histograms"]; assert h["sampled"] > 0, h; assert h["volblocksize"] and h["levels"] and h["dnode_type"], h; assert "8192" in [b["value"] for b in h["volblocksize"]], h["volblocksize"]'
          # C-14: an empty result must be a rejection, not an absence.
          rm -rf /tmp/carve-none
          ./target/release/zvolcarve -f json scan /tmp/cv/member0.img -o /tmp/carve-none --volblocksize 1048576 --strict-profile | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["candidates"] == []; assert d["rejected_by_profile"] > 0, d; names=[r["reason"] for r in d["rejected"] if r["profile"]]; assert "profile_volblocksize" in names, names'
          # C-17: the profile taken off a sibling the pool still has.
          rm -rf /tmp/carve-like
          ./target/release/zvolcarve -q scan /tmp/fx/member0.img -o /tmp/carve-like --like tank/vm/disk0
          python3 -c 'import json; p=json.load(open("/tmp/carve-like/candidates.json"))["profile"]; assert p["volblocksize"] == 8192 and p["levels"] == 1 and p["size"] == [33554432, 33554432], p'
          # C-08: interrupted, then resumed, is the same as one pass.
          rm -rf /tmp/carve-r /tmp/carve-1
          if ./target/release/zvolcarve -q scan /tmp/cv/member0.img -o /tmp/carve-r --max-hits 3 --dnode-type any; then echo "must exit 6"; exit 1; else test $? = 6; fi
          ./target/release/zvolcarve -q scan /tmp/cv/member0.img -o /tmp/carve-r --resume --dnode-type any
          ./target/release/zvolcarve -q scan /tmp/cv/member0.img -o /tmp/carve-1 --dnode-type any
          python3 -c 'import json; a=json.load(open("/tmp/carve-r/candidates.json")); b=json.load(open("/tmp/carve-1/candidates.json")); ka=sorted((c["device"],c["offset"],c["slot"]) for c in a["candidates"]); kb=sorted((c["device"],c["offset"],c["slot"]) for c in b["candidates"]); assert ka == kb, (len(ka), len(kb))'
          # Never a write to the evidence, and never one onto it.
          sha256sum /tmp/cv/member0.img /tmp/cv/member1.img > /tmp/cv.sums
          sha256sum -c /tmp/cv.sums
          if ./target/release/zvolcarve -q scan /tmp/cv/member0.img -o /tmp/cv/member0.img; then echo "must refuse"; exit 1; else test $? = 5; fi
      - name: Files out of a filesystem dataset (COMPANIONS §5.4)
        run: |
          ./target/release/zvolfiles --version
          cargo run -q -p zfs-read --example mkfixture -- /tmp/zp mirror 12 zpl
          ./target/release/zvolfiles list tank/fs /tmp/zp/member0.img /tmp/zp/member1.img -R
          ./target/release/zvolfiles -f json list tank/fs /tmp/zp/member0.img /tmp/zp/member1.img -R > /tmp/zp/list.json
          python3 - <<'EOF'
          import json
          d = json.load(open("/tmp/zp/list.json"))
          by = {f["path"]: f for f in d["files"]}
          assert list(by) == ["caf\ufffd.txt", "hardlink.txt", "hello.txt", "link", "sub", "sub/deep.txt"], list(by)
          # Z-09: a name that is not UTF-8 prints as best it can and
          # carries its exact bytes alongside; the others carry none.
          assert by["caf\ufffd.txt"]["path_hex"] == "636166e92e747874", by["caf\ufffd.txt"]
          assert all("path_hex" not in f for p, f in by.items() if p != "caf\ufffd.txt"), by
          # Z-04: extended attributes out of the system attributes.
          assert by["hello.txt"]["xattrs"] == ["user.case", "user.note"], by["hello.txt"]
          assert "xattrs" not in by["sub/deep.txt"], by["sub/deep.txt"]
          # Z-07: two names, one object.
          assert by["hardlink.txt"]["object"] == by["hello.txt"]["object"], by
          assert by["hello.txt"]["links"] == 2, by
          # Z-02: metadata out of the system attributes, not guessed at.
          assert by["hello.txt"]["type"] == "-" and by["hello.txt"]["mode"] == "0644", by
          assert by["hello.txt"]["size"] == 38, by
          assert by["sub"]["type"] == "d" and by["sub"]["mode"] == "0755", by
          assert by["sub/deep.txt"]["mode"] == "0600", by
          # Z-03: a symlink whose target lives in the attributes.
          assert by["link"]["type"] == "l" and by["link"]["target"] == "sub/deep.txt", by
          assert all("error" not in f for f in d["files"]), d["files"]
          EOF
          # Z-03, Z-05: the tree out, with a manifest that hashes it.
          rm -rf /tmp/zp/out
          ./target/release/zvolfiles extract tank/fs /tmp/zp/member0.img /tmp/zp/member1.img -o /tmp/zp/out
          test "$(cat /tmp/zp/out/hello.txt)" = "hello from a dataset nobody can mount"
          echo "d67c656e01756650d77717b0839985a056ec28ffe174601d690fc407a2ceffca  /tmp/zp/out/sub/deep.txt" | sha256sum -c -
          test "$(stat -c %a /tmp/zp/out/sub/deep.txt)" = 600
          python3 - <<'EOF'
          import json, os
          m = json.load(open("/tmp/zp/out/manifest.json"))
          f = {x["path"]: x for x in m["files"]}
          assert f["sub/deep.txt"]["sha256"] == "d67c656e01756650d77717b0839985a056ec28ffe174601d690fc407a2ceffca", f
          assert m["incomplete"] == 0 and m["failed"] == 0, m
          # Z-07: the second name is a hard link on disk, not a copy.
          assert m["hardlinks"] == 1, m
          assert f["hello.txt"]["hardlink_to"] == "hardlink.txt", f["hello.txt"]
          a = os.stat("/tmp/zp/out/hello.txt")
          b = os.stat("/tmp/zp/out/hardlink.txt")
          assert (a.st_ino, a.st_nlink) == (b.st_ino, 2), (a, b)
          # Z-09: the file is on disk under the bytes it had, not under
          # the replacement characters its name prints as.
          names = sorted(n for n in os.listdir(b"/tmp/zp/out") if not n.isascii())
          assert names == [b"caf\xe9.txt"], names
          assert open(b"/tmp/zp/out/caf\xe9.txt", "rb").read() == b"a name is bytes, not text\n"
          assert f["caf\ufffd.txt"]["path_hex"] == "636166e92e747874", f
          # Z-04: attributes recorded with their values, since applying
          # them would need the platform's own call.
          x = {v["name"]: v["value"] for v in f["hello.txt"]["xattrs"]}
          assert x == {"user.case": "42", "user.note": "kept in the attributes"}, x
          EOF
          # One path, not the whole tree.
          rm -rf /tmp/zp/one
          ./target/release/zvolfiles -q extract tank/fs /tmp/zp/member0.img -o /tmp/zp/one --path sub
          test -f /tmp/zp/one/sub/deep.txt && test ! -e /tmp/zp/one/hello.txt
          # Z-09: and that path can itself be a name that is not text.
          rm -rf /tmp/zp/latin1
          ./target/release/zvolfiles -q extract tank/fs /tmp/zp/member0.img -o /tmp/zp/latin1 --path "$(printf 'caf\xe9.txt')"
          test "$(cat "$(printf '/tmp/zp/latin1/caf\xe9.txt')")" = "a name is bytes, not text"
          # The text it prints as is not a name any file has.
          if ./target/release/zvolfiles -q extract tank/fs /tmp/zp/member0.img -o /tmp/zp/no --path 'caf.txt'; then echo "must fail"; exit 1; else test $? = 3; fi
          # Z-08: with the root directory ZAP zeroed on every member, the
          # walk cannot work and the objects still come out whole.
          cp /tmp/zp/member0.img /tmp/zp/bad0.img
          cp /tmp/zp/member1.img /tmp/zp/bad1.img
          python3 - <<'EOF'
          for path in ("/tmp/zp/bad0.img", "/tmp/zp/bad1.img"):
              data = bytearray(open(path, "rb").read())
              i = data.find(b"hello.txt")
              assert i > 0, path
              start = (i // 4096) * 4096
              data[start:start + 4096] = b"\x00" * 4096
              open(path, "wb").write(bytes(data))
          EOF
          if ./target/release/zvolfiles -q list tank/fs /tmp/zp/bad0.img /tmp/zp/bad1.img -R; then echo "the walk must fail"; exit 1; else test $? = 4; fi
          rm -rf /tmp/zp/objs
          ./target/release/zvolfiles -q objects tank/fs /tmp/zp/bad0.img /tmp/zp/bad1.img -o /tmp/zp/objs || test $? = 4
          cmp /tmp/zp/out/sub/deep.txt /tmp/zp/objs/objects/000009.bin
          # Never a write to the evidence, and never one onto it.
          sha256sum /tmp/zp/member0.img /tmp/zp/member1.img > /tmp/zp.sums
          sha256sum -c /tmp/zp.sums
          if ./target/release/zvolfiles -q extract tank/fs /tmp/zp/member0.img -o /tmp/zp/member0.img; then echo "must refuse"; exit 1; else test $? = 5; fi
      - name: A closed pipe is not a failure
        run: |
          # `zvolcarve list DIR | head -4` closes the pipe while the
          # tool is still writing. Rust turns the EPIPE into a panic —
          # a backtrace and exit 101 — unless the hook is in place, and
          # an operator quitting `less` has done nothing wrong. The
          # carve listing is long enough that head really does close it.
          set -o pipefail || true
          for cmd in \
            "./target/release/zvolcarve list /tmp/carve" \
            "./target/release/zvolrescue -f json list /tmp/fx/member0.img /tmp/fx/member1.img" \
            "./target/release/zvoltimeline /tmp/fx/member0.img /tmp/fx/member1.img" \
            "./target/release/zvolfiles list tank/fs /tmp/zp/member0.img -R"; do
            $cmd 2>/tmp/pipe-err.txt | head -2 >/dev/null
            code=${PIPESTATUS[0]}
            if [ "$code" != 0 ] || [ -s /tmp/pipe-err.txt ]; then
              echo "$cmd exited $code with:"; cat /tmp/pipe-err.txt; exit 1
            fi
          done
          # And a panic that is not a closed pipe still reaches stderr:
          # a missing workspace is an error, not an exit 0.
          if ./target/release/zvolcarve list /tmp/there-is-no-such-workspace; then
            echo "a missing workspace must fail"; exit 1
          fi
      - name: Filesystem signatures, against filesystems really made (SPEC F-43)
        run: |
          # The one place this can be checked against something other
          # than our own opinion: make the filesystems and read them back.
          truncate -s 64M /tmp/sig-ext4.img
          mkfs.ext4 -q -F -L zvoltest /tmp/sig-ext4.img
          truncate -s 16M /tmp/sig-swap.img
          mkswap -L swaptest /tmp/sig-swap.img >/dev/null
          cargo run -q -p zfs-read --example signatures -- /tmp/sig-ext4.img /tmp/sig-swap.img > /tmp/sig.txt
          cat /tmp/sig.txt
          grep -q 'sig-ext4.img: ext2/3/4 at 1024 (67108864 byte(s)) label "zvoltest"' /tmp/sig.txt
          grep -q 'sig-swap.img: swap at 4086 (16777216 byte(s)) label "swaptest"' /tmp/sig.txt
          # A member of a pool is a ZFS label, and empty space is nothing.
          cargo run -q -p zfs-read --example signatures -- /tmp/fx/member0.img | grep -q 'zfs at 16384'
          head -c 1048576 /dev/zero > /tmp/sig-blank.img
          if cargo run -q -p zfs-read --example signatures -- /tmp/sig-blank.img | grep -q 'nothing recognised'; then :; else echo "zeros must be nothing"; exit 1; fi
      - name: End-to-end on a raidz2 fixture (missing and corrupted members)
        run: |
          cargo run -p zfs-read --example mkfixture -- /tmp/rz raidz2 12
          ./target/release/zvolrescue scan /tmp/rz/member0.img /tmp/rz/member1.img /tmp/rz/member2.img /tmp/rz/member3.img
          # All four members: same image as the mirror fixture.
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/rz/member0.img /tmp/rz/member1.img /tmp/rz/member2.img /tmp/rz/member3.img -o /tmp/rz-all.img
          cmp /tmp/disk0.img /tmp/rz-all.img
          # Two members missing: rebuilt from parity.
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/rz/member1.img /tmp/rz/member3.img -o /tmp/rz-2miss.img
          cmp /tmp/disk0.img /tmp/rz-2miss.img
          # One missing and one silently corrupted across the stripe area: found by checksum.
          cp /tmp/rz/member0.img /tmp/rz-bad0.img
          python3 -c 'p="/tmp/rz-bad0.img"; b=bytearray(open(p,"rb").read()); s=4*1024*1024+0x200000//4; b[s:s+(1<<20)]=bytes(x^0xa5 for x in b[s:s+(1<<20)]); open(p,"wb").write(b)'
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/rz-bad0.img /tmp/rz/member1.img /tmp/rz/member3.img -o /tmp/rz-mix.img
          cmp /tmp/disk0.img /tmp/rz-mix.img
          # Three missing: beyond raidz2, exit 3.
          if ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/rz/member2.img -o /tmp/rz-3miss.img; then echo "must fail"; exit 1; else test $? = 3; fi

      - name: A member whose labels are gone, bound to the leaf its siblings name (SPEC F-62)
        run: |
          python3 - <<'EOF'
          LABEL, PHYS_OFF, PHYS = 256*1024, 16*1024, 112*1024
          for i in (0, 1):
              b = bytearray(open(f"/tmp/rz/member{i}.img", "rb").read())
              aligned = len(b) & ~(LABEL-1)
              for off in (0, LABEL, aligned-2*LABEL, aligned-LABEL):
                  b[off+PHYS_OFF:off+PHYS_OFF+PHYS] = b"\0" * PHYS
              open(f"/tmp/rz/nolabel{i}.img", "wb").write(bytes(b))
          EOF
          # The siblings' configuration names both leaves as missing.
          ./target/release/zvolrescue -f json scan /tmp/rz/nolabel0.img /tmp/rz/nolabel1.img /tmp/rz/member2.img /tmp/rz/member3.img | python3 -c 'import json,sys; t=json.load(sys.stdin)["pools"][0]["tops"][0]; missing=[m["guid"] for m in t["members"] if m["present"] is None]; assert len(missing) == 2, t; open("/tmp/rz/guids","w").write(" ".join(missing))'
          G0=$(cut -d" " -f1 /tmp/rz/guids); G1=$(cut -d" " -f2 /tmp/rz/guids)
          # Bound correctly, with a third member left out so they must be
          # used: the volume comes back bit-exact.
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/rz/nolabel0.img /tmp/rz/nolabel1.img /tmp/rz/member2.img --assume-member /tmp/rz/nolabel0.img=$G0 --assume-member /tmp/rz/nolabel1.img=$G1 --txg 4816229 -o /tmp/rz-bound.img
          cmp /tmp/disk0.img /tmp/rz-bound.img
          # Swapped: the assertion is wrong, the checksums say so, and
          # nothing is handed back as if it were the volume.
          if ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/rz/nolabel0.img /tmp/rz/nolabel1.img /tmp/rz/member2.img --assume-member /tmp/rz/nolabel0.img=$G1 --assume-member /tmp/rz/nolabel1.img=$G0 --txg 4816229 -o /tmp/rz-swapped.img; then echo "a swapped binding must not succeed"; exit 1; else test $? = 3; fi
          # Without a GUID, when several leaves are missing, the tool
          # works out which one this member is by reading through it —
          # and says so plainly when the evidence does not choose.
          python3 - <<'EOF'
          LABEL, PHYS_OFF, PHYS = 256*1024, 16*1024, 112*1024
          b = bytearray(open("/tmp/fx/member0.img", "rb").read())
          aligned = len(b) & ~(LABEL-1)
          for off in (0, LABEL, aligned-2*LABEL, aligned-LABEL):
              b[off+PHYS_OFF:off+PHYS_OFF+PHYS] = b"\0" * PHYS
          open("/tmp/fx/nolabel0.img", "wb").write(bytes(b))
          EOF
          # A mirror leaf: its sibling is withheld for the trial, so the
          # walk leans on it entirely and the answer is not a guess.
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/fx/nolabel0.img /tmp/fx/member1.img --assume-member /tmp/fx/nolabel0.img --txg 4816229 -o /tmp/fx-bound.img
          cmp /tmp/disk0.img /tmp/fx-bound.img
          # A device that is not this pool's data reads as no leaf at all.
          python3 -c 'b=bytearray(open("/tmp/fx/nolabel0.img","rb").read()); s=4*1024*1024; b[s:]=bytes(x^0xa5 for x in b[s:]); open("/tmp/fx/garbage.img","wb").write(bytes(b))'
          if ./target/release/zvolrescue -q list /tmp/fx/garbage.img /tmp/fx/member1.img --assume-member /tmp/fx/garbage.img; then echo "garbage must not bind"; exit 1; else test $? = 1; fi
          # Refusals: not a member of this run, and no leaf is missing.
          if ./target/release/zvolrescue -q list /tmp/rz/member2.img /tmp/rz/member3.img --assume-member /tmp/elsewhere.img; then exit 1; else test $? = 1; fi
          if ./target/release/zvolrescue -q list /tmp/fx/member0.img /tmp/fx/member1.img --assume-member /tmp/fx/member0.img; then exit 1; else test $? = 1; fi

  crosscheck:
    name: Cross-check against OpenZFS userland (ztest + zdb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends zfsutils-linux zfs-test
      - run: cargo build --release && cargo build --release -p zfs-read --examples
      - run: tests/crosscheck-ztest.sh ./target/release/zvolrescue /tmp/crosscheck ./target/release/examples/walk-objects ./target/release/examples/unwrap-key ./target/release/zvoltimeline ./target/release/examples/space

  freebsd:
    name: FreeBSD 14 (ports rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          prepare: pkg install -y rust
          run: |
            cargo test --all-targets
            cargo build --release
            ./target/release/zvolrescue --version
