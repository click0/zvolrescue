name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - run: cargo build --release
      - run: ./target/release/zvolrescue --version
      - name: End-to-end on fixture members (scan, list, dump)
        run: |
          cargo run -p zfs-read --example mkfixture -- /tmp/fx mirror 12
          ./target/release/zvolrescue scan /tmp/fx/member0.img /tmp/fx/member1.img
          ./target/release/zvolrescue -f json -vv scan /tmp/fx/member0.img | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["pools"][0]["readable"]; assert d["devices"][0]["config"]["ashift"] == 12'
          # Newest TXG: the volume has been destroyed; the previous TXG still has it.
          ./target/release/zvolrescue list -r /tmp/fx/member0.img /tmp/fx/member1.img --diff 4816229
          ./target/release/zvolrescue -f json list -r /tmp/fx/member0.img | python3 -c 'import json,sys; d=json.load(sys.stdin); names=[x["name"] for x in d["datasets"]]; assert names == ["tank","tank/vm"], names'
          ./target/release/zvolrescue -f json list -r /tmp/fx/member0.img --txg 4816229 | python3 -c 'import json,sys; d=json.load(sys.stdin); names=[x["name"] for x in d["datasets"]]; assert names == ["tank","tank/vm","tank/vm/disk0","tank/vm/disk0@before"], names; assert d["datasets"][2]["volsize"] == 33554432'
          ./target/release/zvolrescue -f json list -r /tmp/fx/member0.img --diff 4816229 | python3 -c 'import json,sys; d=json.load(sys.stdin); gone=[x["name"] for x in d["diff"]["destroyed_since"]]; assert gone == ["tank/vm/disk0","tank/vm/disk0@before"], gone'
          # dump without --txg must find the last TXG that still had the volume (SPEC F-40).
          ./target/release/zvolrescue -f json dump tank/vm/disk0 /tmp/fx/member0.img /tmp/fx/member1.img -o /tmp/disk0.img --evidence-log /tmp/ev.jsonl | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["volumes"][0]["txg"] == 4816229, d["volumes"]; assert d["txgs_searched"] == [4816230, 4816229], d["txgs_searched"]'
          echo "d6d58af862ec2761bf43158f7ee2b2b0f4628fa6ca8095544493f9d698d7b80d  /tmp/disk0.img" | sha256sum -c -
          test "$(stat -c %s /tmp/disk0.img)" = 33554432
          # Damage block 0 on one member: the mirror copy must heal it, a lone damaged member must not.
          cp /tmp/fx/member0.img /tmp/bad.img
          printf '\xff' | dd of=/tmp/bad.img bs=1 seek=$((4*1024*1024 + 0x200000 + 4096 + 5)) conv=notrunc status=none
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/bad.img /tmp/fx/member1.img -o /tmp/healed.img
          cmp /tmp/disk0.img /tmp/healed.img
          if ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/bad.img -o /tmp/partial.img --strict; then echo "strict must fail"; exit 1; else test $? = 4; fi
          if ./target/release/zvolrescue dump tank/vm/disk0 /tmp/fx/member0.img -o /tmp/fx/member0.img; then echo "must refuse"; exit 1; else test $? = 5; fi
      - name: Zero point of a member whose labels are gone (SPEC F-61)
        run: |
          # Erase all four vdev_phys areas, leaving only the uberblock rings.
          python3 - <<'EOF'
          import os, shutil
          LABEL, PHYS_OFF, PHYS = 256*1024, 16*1024, 112*1024
          shutil.copy("/tmp/fx/member0.img", "/tmp/nolabel.img")
          size = os.path.getsize("/tmp/nolabel.img")
          aligned = size & ~(LABEL-1)
          with open("/tmp/nolabel.img", "r+b") as f:
              for off in (0, LABEL, aligned-2*LABEL, aligned-LABEL):
                  f.seek(off + PHYS_OFF); f.write(b"\0" * PHYS)
          # The same member 1 MiB further along: a partition that moved.
          data = open("/tmp/nolabel.img", "rb").read()
          open("/tmp/moved.img", "wb").write(b"\x5a" * (1 << 20) + data)
          EOF
          ./target/release/zvolrescue scan /tmp/nolabel.img /tmp/moved.img
          ./target/release/zvolrescue -f json scan /tmp/nolabel.img | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"][0]; assert d.get("config") is None; z=d["zero_point"][0]; assert z["base"] == 0, z; assert z["anchors"] >= 4, z; assert z["labels"] == ["L0","L1","L2","L3"], z'
          ./target/release/zvolrescue -f json scan /tmp/moved.img | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"][0]; z=d["zero_point"][0]; assert z["base"] == 1048576, z; assert z["psize"] == 67108864, z'
          # An intact member is not searched unless asked, and then agrees.
          ./target/release/zvolrescue -f json scan /tmp/fx/member0.img | python3 -c 'import json,sys; assert "zero_point" not in json.load(sys.stdin)["devices"][0]'
          ./target/release/zvolrescue -f json scan --zero-point /tmp/fx/member0.img | python3 -c 'import json,sys; z=json.load(sys.stdin)["devices"][0]["zero_point"]; assert z[0]["base"] == 0, z'
          # Nothing to anchor to: no candidate is invented.
          head -c 33554432 /dev/zero > /tmp/blank.img
          ./target/release/zvolrescue -f json scan --zero-point /tmp/blank.img | python3 -c 'import json,sys; assert "zero_point" not in json.load(sys.stdin)["devices"][0]'
          # A member whose labels are intact but which starts 3 MiB in:
          # list and dump must read it through the recovered base. The
          # move is a whole number of labels, so the rear pair even parses
          # at base 0 — with a checksum that does not verify there.
          python3 -c 'data=open("/tmp/fx/member0.img","rb").read(); open("/tmp/moved-intact.img","wb").write(b"\x5a"*(3<<20)+data)'
          ./target/release/zvolrescue -f json list -r /tmp/moved-intact.img --txg 4816229 | python3 -c 'import json,sys; d=json.load(sys.stdin); names=[x["name"] for x in d["datasets"]]; assert names == ["tank","tank/vm","tank/vm/disk0","tank/vm/disk0@before"], names'
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/moved-intact.img -o /tmp/moved.img --txg 4816229
          cmp /tmp/disk0.img /tmp/moved.img
      - name: A pool with no labels at all, read through a hand-written layout (SPEC F-65)
        run: |
          cargo run -q -p zfs-read --example mkfixture -- /tmp/hz raidz2 12
          python3 - <<'EOF'
          import json
          LABEL, PHYS_OFF, PHYS = 256*1024, 16*1024, 112*1024
          paths = []
          for i in range(4):
              b = bytearray(open(f"/tmp/hz/member{i}.img", "rb").read())
              aligned = len(b) & ~(LABEL-1)
              for off in (0, LABEL, aligned-2*LABEL, aligned-LABEL):
                  b[off+PHYS_OFF:off+PHYS_OFF+PHYS] = b"\0" * PHYS
              out = f"/tmp/hz/nolabel{i}.img"
              open(out, "wb").write(bytes(b))
              paths.append(out)
          json.dump({"name": "tank", "ashift": 12,
                     "tops": [{"kind": "raidz", "nparity": 2, "members": paths}]},
                    open("/tmp/hz/hints.json", "w"))
          EOF
          # Not one label survives: without the layout there is no pool.
          if ./target/release/zvolrescue -q list /tmp/hz/nolabel0.img /tmp/hz/nolabel1.img /tmp/hz/nolabel2.img /tmp/hz/nolabel3.img; then echo "must not read"; exit 1; else test $? = 2; fi
          # With it, the uberblocks the zero-point search confirmed carry
          # the rest: datasets, TXG history and the volume itself.
          ./target/release/zvolrescue -f json list -r /tmp/hz/nolabel0.img /tmp/hz/nolabel1.img /tmp/hz/nolabel2.img /tmp/hz/nolabel3.img --hints /tmp/hz/hints.json --txg 4816229 | python3 -c 'import json,sys; d=json.load(sys.stdin); names=[x["name"] for x in d["datasets"]]; assert names == ["tank","tank/vm","tank/vm/disk0","tank/vm/disk0@before"], names'
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/hz/nolabel0.img /tmp/hz/nolabel1.img /tmp/hz/nolabel2.img /tmp/hz/nolabel3.img --hints /tmp/hz/hints.json --txg 4816229 -o /tmp/hz/out.img
          cmp /tmp/disk0.img /tmp/hz/out.img
          # The order in a layout is what a DVA addresses, and a wrong one
          # costs redundancy rather than correctness: --search-order finds
          # the order no block has to be repaired around (SPEC F-66).
          python3 -c 'import json; d=json.load(open("/tmp/hz/hints.json")); m=d["tops"][0]["members"]; m[1],m[2]=m[2],m[1]; json.dump(d, open("/tmp/hz/swapped.json","w"))'
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/hz/nolabel0.img /tmp/hz/nolabel1.img /tmp/hz/nolabel2.img /tmp/hz/nolabel3.img --hints /tmp/hz/swapped.json --search-order --txg 4816229 -o /tmp/hz/searched.img 2>/tmp/hz/search.err
          cmp /tmp/disk0.img /tmp/hz/searched.img
          grep -q "best has 0 checksum mismatch" /tmp/hz/search.err
          grep -q "just as good" /tmp/hz/search.err && { echo "the right order must be unique here"; exit 1; } || true
          # A layout that names a member which was not given is a usage error.
          python3 -c 'import json; d=json.load(open("/tmp/hz/hints.json")); d["tops"][0]["members"][0]="/tmp/nowhere.img"; json.dump(d, open("/tmp/hz/bad.json","w"))'
          if ./target/release/zvolrescue -q list /tmp/hz/nolabel0.img /tmp/hz/nolabel1.img /tmp/hz/nolabel2.img /tmp/hz/nolabel3.img --hints /tmp/hz/bad.json; then exit 1; else test $? = 1; fi
      - name: Bulk extraction and resume
        run: |
          ./target/release/zvolrescue -q dump -r tank /tmp/fx/member0.img /tmp/fx/member1.img -o /tmp/bulk --txg 4816229
          python3 -c 'import json; m=json.load(open("/tmp/bulk/manifest.json")); assert [v["dataset"] for v in m["volumes"]] == ["tank/vm/disk0"], m; assert m["volumes"][0]["sha256"] == "d6d58af862ec2761bf43158f7ee2b2b0f4628fa6ca8095544493f9d698d7b80d"'
          cmp /tmp/disk0.img /tmp/bulk/tank_vm_disk0.img
          # Resume: pretend a run stopped after block 2 (16 KiB written), continue, same hash.
          head -c 16384 /tmp/disk0.img > /tmp/resume.img
          printf '{"version":1,"dataset":"tank/vm/disk0","dataset_guid":"0x00000000000000a3","txg":4816229,"volsize":33554432,"blocksize":8192,"blocks_done":2}' > /tmp/resume.img.resume.json
          ./target/release/zvolrescue -f json dump tank/vm/disk0 /tmp/fx/member0.img /tmp/fx/member1.img -o /tmp/resume.img --resume | python3 -c 'import json,sys; d=json.load(sys.stdin)["volumes"][0]; assert d["resumed_from_block"] == 2, d; assert d["blocks_read"] == 1, d; assert d["sha256"] == "d6d58af862ec2761bf43158f7ee2b2b0f4628fa6ca8095544493f9d698d7b80d"'
          cmp /tmp/disk0.img /tmp/resume.img
          test ! -e /tmp/resume.img.resume.json
      - name: End-to-end on a raidz2 fixture (missing and corrupted members)
        run: |
          cargo run -p zfs-read --example mkfixture -- /tmp/rz raidz2 12
          ./target/release/zvolrescue scan /tmp/rz/member0.img /tmp/rz/member1.img /tmp/rz/member2.img /tmp/rz/member3.img
          # All four members: same image as the mirror fixture.
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/rz/member0.img /tmp/rz/member1.img /tmp/rz/member2.img /tmp/rz/member3.img -o /tmp/rz-all.img
          cmp /tmp/disk0.img /tmp/rz-all.img
          # Two members missing: rebuilt from parity.
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/rz/member1.img /tmp/rz/member3.img -o /tmp/rz-2miss.img
          cmp /tmp/disk0.img /tmp/rz-2miss.img
          # One missing and one silently corrupted across the stripe area: found by checksum.
          cp /tmp/rz/member0.img /tmp/rz-bad0.img
          python3 -c 'p="/tmp/rz-bad0.img"; b=bytearray(open(p,"rb").read()); s=4*1024*1024+0x200000//4; b[s:s+(1<<20)]=bytes(x^0xa5 for x in b[s:s+(1<<20)]); open(p,"wb").write(b)'
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/rz-bad0.img /tmp/rz/member1.img /tmp/rz/member3.img -o /tmp/rz-mix.img
          cmp /tmp/disk0.img /tmp/rz-mix.img
          # Three missing: beyond raidz2, exit 3.
          if ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/rz/member2.img -o /tmp/rz-3miss.img; then echo "must fail"; exit 1; else test $? = 3; fi

      - name: A member whose labels are gone, bound to the leaf its siblings name (SPEC F-62)
        run: |
          python3 - <<'EOF'
          LABEL, PHYS_OFF, PHYS = 256*1024, 16*1024, 112*1024
          for i in (0, 1):
              b = bytearray(open(f"/tmp/rz/member{i}.img", "rb").read())
              aligned = len(b) & ~(LABEL-1)
              for off in (0, LABEL, aligned-2*LABEL, aligned-LABEL):
                  b[off+PHYS_OFF:off+PHYS_OFF+PHYS] = b"\0" * PHYS
              open(f"/tmp/rz/nolabel{i}.img", "wb").write(bytes(b))
          EOF
          # The siblings' configuration names both leaves as missing.
          ./target/release/zvolrescue -f json scan /tmp/rz/nolabel0.img /tmp/rz/nolabel1.img /tmp/rz/member2.img /tmp/rz/member3.img | python3 -c 'import json,sys; t=json.load(sys.stdin)["pools"][0]["tops"][0]; missing=[m["guid"] for m in t["members"] if m["present"] is None]; assert len(missing) == 2, t; open("/tmp/rz/guids","w").write(" ".join(missing))'
          G0=$(cut -d" " -f1 /tmp/rz/guids); G1=$(cut -d" " -f2 /tmp/rz/guids)
          # Bound correctly, with a third member left out so they must be
          # used: the volume comes back bit-exact.
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/rz/nolabel0.img /tmp/rz/nolabel1.img /tmp/rz/member2.img --assume-member /tmp/rz/nolabel0.img=$G0 --assume-member /tmp/rz/nolabel1.img=$G1 --txg 4816229 -o /tmp/rz-bound.img
          cmp /tmp/disk0.img /tmp/rz-bound.img
          # Swapped: the assertion is wrong, the checksums say so, and
          # nothing is handed back as if it were the volume.
          if ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/rz/nolabel0.img /tmp/rz/nolabel1.img /tmp/rz/member2.img --assume-member /tmp/rz/nolabel0.img=$G1 --assume-member /tmp/rz/nolabel1.img=$G0 --txg 4816229 -o /tmp/rz-swapped.img; then echo "a swapped binding must not succeed"; exit 1; else test $? = 3; fi
          # Without a GUID, when several leaves are missing, the tool
          # works out which one this member is by reading through it —
          # and says so plainly when the evidence does not choose.
          python3 - <<'EOF'
          LABEL, PHYS_OFF, PHYS = 256*1024, 16*1024, 112*1024
          b = bytearray(open("/tmp/fx/member0.img", "rb").read())
          aligned = len(b) & ~(LABEL-1)
          for off in (0, LABEL, aligned-2*LABEL, aligned-LABEL):
              b[off+PHYS_OFF:off+PHYS_OFF+PHYS] = b"\0" * PHYS
          open("/tmp/fx/nolabel0.img", "wb").write(bytes(b))
          EOF
          # A mirror leaf: its sibling is withheld for the trial, so the
          # walk leans on it entirely and the answer is not a guess.
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/fx/nolabel0.img /tmp/fx/member1.img --assume-member /tmp/fx/nolabel0.img --txg 4816229 -o /tmp/fx-bound.img
          cmp /tmp/disk0.img /tmp/fx-bound.img
          # A device that is not this pool's data reads as no leaf at all.
          python3 -c 'b=bytearray(open("/tmp/fx/nolabel0.img","rb").read()); s=4*1024*1024; b[s:]=bytes(x^0xa5 for x in b[s:]); open("/tmp/fx/garbage.img","wb").write(bytes(b))'
          if ./target/release/zvolrescue -q list /tmp/fx/garbage.img /tmp/fx/member1.img --assume-member /tmp/fx/garbage.img; then echo "garbage must not bind"; exit 1; else test $? = 1; fi
          # Refusals: not a member of this run, and no leaf is missing.
          if ./target/release/zvolrescue -q list /tmp/rz/member2.img /tmp/rz/member3.img --assume-member /tmp/elsewhere.img; then exit 1; else test $? = 1; fi
          if ./target/release/zvolrescue -q list /tmp/fx/member0.img /tmp/fx/member1.img --assume-member /tmp/fx/member0.img; then exit 1; else test $? = 1; fi

  crosscheck:
    name: Cross-check against OpenZFS userland (ztest + zdb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends zfsutils-linux zfs-test
      - run: cargo build --release && cargo build --release -p zfs-read --examples
      - run: tests/crosscheck-ztest.sh ./target/release/zvolrescue /tmp/crosscheck ./target/release/examples/walk-objects ./target/release/examples/unwrap-key

  freebsd:
    name: FreeBSD 14 (ports rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          prepare: pkg install -y rust
          run: |
            cargo test --all-targets
            cargo build --release
            ./target/release/zvolrescue --version
