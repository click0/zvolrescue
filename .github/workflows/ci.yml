name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: The dependency graph — licences, advisories, banned crates (SPEC §8.3, N-07)
        # deny.toml: every licence in the tree is a permissive one on the
        # list (CDDL on `edonr` alone), no advisory stands against a
        # crate, and no crate that exists to open a socket, run a program
        # or load code is in the graph.
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
      - name: Nothing in the source runs a program or opens a socket (SPEC §8.3)
        run: |
          # The binaries' own import tables are read by the `imports`
          # test of each binary crate (tests/support/imports.rs), which
          # `cargo test` below runs. This is the same rule one level up,
          # where a violation is a line with a file name.
          if grep -rnE 'process::Command|std::net::' crates/*/src; then
            echo "::error::a binary crate shells out or opens a socket"
            exit 1
          fi
      - run: cargo test --all-targets
      - run: cargo build --release
      - run: ./target/release/zvolrescue --version
      - name: The version and the CHANGELOG say the same thing
        run: |
          # The release workflow takes the tag's CHANGELOG section as
          # the notes and refuses a tag that has none — but it only
          # finds out at release time, with the tag already pushed and
          # nowhere to put the fix. Here it is still a branch.
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "workspace version: $v"
          test -n "$v"
          for f in CHANGELOG.md CHANGELOG.uk.md; do
            grep -q "^## v$v — " "$f" || { echo "::error::$f has no '## v$v — date' section"; exit 1; }
          done
          # The section's lead line becomes the release title, so it has
          # to be there.
          awk -v want="v$v" '$0 ~ "^## " want { p=1; next } /^## / && p { exit } p { print }' CHANGELOG.md |
            grep -q '^\*\*' || { echo "::error::the v$v section has no **lead line** for the release title"; exit 1; }
          test "$(./target/release/zvolrescue --version)" = "zvolrescue $v"
          # The READMEs carry the version in their status line and were
          # the one place that quietly went stale: they still said v0.7.0
          # after v0.7.1 shipped, and then v0.7.0 stopped existing at all.
          grep -q "\*\*Status:\*\* v$v " README.md || { echo "::error::README.md's status line is not v$v"; exit 1; }
          grep -q "\*\*Статус:\*\* v$v " README_UK.md || { echo "::error::README_UK.md's status line is not v$v"; exit 1; }
          # Exactly one open section, and every version named once. The
          # release notes carry whatever the open section still holds by
          # reading from its heading to the next `## `, so a second
          # heading of the same name does not duplicate anything — it
          # truncates. This repository had two `## Unreleased` for three
          # commits, and everything under the second would have been
          # dropped from the notes without a word.
          for f in CHANGELOG.md CHANGELOG.uk.md; do
            dupes=$(grep '^## ' "$f" | sort | uniq -d)
            test -z "$dupes" || { echo "::error::$f has a repeated section heading: $dupes"; exit 1; }
          done
          test "$(grep -c '^## Unreleased$' CHANGELOG.md)" -le 1
          test "$(grep -c '^## Незібране$' CHANGELOG.uk.md)" -le 1
          # And the two languages have the same shape, so one cannot
          # quietly file something the other does not.
          test "$(grep -c '^## ' CHANGELOG.md)" = "$(grep -c '^## ' CHANGELOG.uk.md)"
      - name: Every way a read can fail is classified (tests/golden)
        run: |
          # The damage matrix decides whether a failed block is the tool
          # answering damage honestly or the tool breaking, and it decides
          # it from the text the error prints. That list drifted once and
          # six correct results were recorded as defects. It is held
          # against the enum here, where a new variant is still on a
          # branch.
          python3 tests/golden/check-read-errors.py
          # The same reasoning one level up: the matrix also decides
          # whether a *dataset* the tool did not list is damage doing
          # what the manifest asked, or the tool losing one. That
          # decision is a table with a doctest beside it, because the
          # case that matters most — a dataset gone and the blocks
          # naming it refused — needs a mirror wider than two leaves to
          # reach, which is a property of the pool `ztest` happened to
          # build and not something a run can be relied on to produce.
          python3 -m doctest tests/golden/run-matrix.py
      - name: End-to-end on fixture members (scan, list, dump)
        run: |
          cargo run -p zfs-read --example mkfixture -- /tmp/fx mirror 12
          ./target/release/zvolrescue scan /tmp/fx/member0.img /tmp/fx/member1.img
          ./target/release/zvolrescue -f json -vv scan /tmp/fx/member0.img | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["pools"][0]["readable"]; assert d["devices"][0]["config"]["ashift"] == 12'
          # Newest TXG: the volume has been destroyed; the previous TXG still has it.
          ./target/release/zvolrescue list -r /tmp/fx/member0.img /tmp/fx/member1.img --diff 4816229
          ./target/release/zvolrescue -f json list -r /tmp/fx/member0.img | python3 -c 'import json,sys; d=json.load(sys.stdin); names=[x["name"] for x in d["datasets"]]; assert names == ["tank","tank/vm"], names'
          ./target/release/zvolrescue -f json list -r /tmp/fx/member0.img --txg 4816229 | python3 -c 'import json,sys; d=json.load(sys.stdin); names=[x["name"] for x in d["datasets"]]; assert names == ["tank","tank/vm","tank/vm/disk0","tank/vm/disk0@before"], names; assert d["datasets"][2]["volsize"] == 33554432'
          ./target/release/zvolrescue -f json list -r /tmp/fx/member0.img --diff 4816229 | python3 -c 'import json,sys; d=json.load(sys.stdin); gone=[x["name"] for x in d["diff"]["destroyed_since"]]; assert gone == ["tank/vm/disk0","tank/vm/disk0@before"], gone'
          # dump without --txg must find the last TXG that still had the volume (SPEC F-40).
          ./target/release/zvolrescue -f json dump tank/vm/disk0 /tmp/fx/member0.img /tmp/fx/member1.img -o /tmp/disk0.img --evidence-log /tmp/ev.jsonl | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["volumes"][0]["txg"] == 4816229, d["volumes"]; assert d["txgs_searched"] == [4816230, 4816229], d["txgs_searched"]'
          echo "febfe0108392728dbde89ee63f9f25419a0192ac04420db3ad88b0032a088585  /tmp/disk0.img" | sha256sum -c -
          test "$(stat -c %s /tmp/disk0.img)" = 33554432
          # Damage block 0 on one member: the mirror copy must heal it, a lone damaged member must not.
          cp /tmp/fx/member0.img /tmp/bad.img
          printf '\xff' | dd of=/tmp/bad.img bs=1 seek=$((4*1024*1024 + 0x200000 + 4096 + 5)) conv=notrunc status=none
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/bad.img /tmp/fx/member1.img -o /tmp/healed.img
          cmp /tmp/disk0.img /tmp/healed.img
          if ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/bad.img -o /tmp/partial.img --strict; then echo "strict must fail"; exit 1; else test $? = 4; fi
          # An incomplete image says so with the status, not only in the
          # warning: a caller that reads `dump || fail` must not be told
          # a zero-filled image is the volume. Without --strict the run
          # finishes and still exits 4.
          if ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/bad.img -o /tmp/zeroed.img > /tmp/zeroed.out; then echo "zeroed blocks must exit 4"; exit 1; else test $? = 4; fi
          grep -q "1 zeroed (unreadable)" /tmp/zeroed.out
          grep -q "written as zeros (exit 4)" /tmp/zeroed.out
          # Healed from the other side of the mirror: nothing zeroed, exit 0.
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/bad.img /tmp/fx/member1.img -o /tmp/healed2.img > /tmp/healed2.out
          grep -q "0 zeroed (unreadable)" /tmp/healed2.out
          if ./target/release/zvolrescue dump tank/vm/disk0 /tmp/fx/member0.img -o /tmp/fx/member0.img; then echo "must refuse"; exit 1; else test $? = 5; fi
      - name: Zero point of a member whose labels are gone (SPEC F-61)
        run: |
          # Erase all four vdev_phys areas, leaving only the uberblock rings.
          python3 - <<'EOF'
          import os, shutil
          LABEL, PHYS_OFF, PHYS = 256*1024, 16*1024, 112*1024
          shutil.copy("/tmp/fx/member0.img", "/tmp/nolabel.img")
          size = os.path.getsize("/tmp/nolabel.img")
          aligned = size & ~(LABEL-1)
          with open("/tmp/nolabel.img", "r+b") as f:
              for off in (0, LABEL, aligned-2*LABEL, aligned-LABEL):
                  f.seek(off + PHYS_OFF); f.write(b"\0" * PHYS)
          # The same member 1 MiB further along: a partition that moved.
          data = open("/tmp/nolabel.img", "rb").read()
          open("/tmp/moved.img", "wb").write(b"\x5a" * (1 << 20) + data)
          EOF
          ./target/release/zvolrescue scan /tmp/nolabel.img /tmp/moved.img
          ./target/release/zvolrescue -f json scan /tmp/nolabel.img | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"][0]; assert d.get("config") is None; z=d["zero_point"][0]; assert z["base"] == 0, z; assert z["anchors"] >= 4, z; assert z["labels"] == ["L0","L1","L2","L3"], z'
          ./target/release/zvolrescue -f json scan /tmp/moved.img | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"][0]; z=d["zero_point"][0]; assert z["base"] == 1048576, z; assert z["psize"] == 67108864, z'
          # An intact member is not searched unless asked, and then agrees.
          ./target/release/zvolrescue -f json scan /tmp/fx/member0.img | python3 -c 'import json,sys; assert "zero_point" not in json.load(sys.stdin)["devices"][0]'
          ./target/release/zvolrescue -f json scan --zero-point /tmp/fx/member0.img | python3 -c 'import json,sys; z=json.load(sys.stdin)["devices"][0]["zero_point"]; assert z[0]["base"] == 0, z'
          # Nothing to anchor to: no candidate is invented.
          head -c 33554432 /dev/zero > /tmp/blank.img
          ./target/release/zvolrescue -f json scan --zero-point /tmp/blank.img | python3 -c 'import json,sys; assert "zero_point" not in json.load(sys.stdin)["devices"][0]'
          # A member whose labels are intact but which starts 3 MiB in:
          # list and dump must read it through the recovered base. The
          # move is a whole number of labels, so the rear pair even parses
          # at base 0 — with a checksum that does not verify there.
          python3 -c 'data=open("/tmp/fx/member0.img","rb").read(); open("/tmp/moved-intact.img","wb").write(b"\x5a"*(3<<20)+data)'
          ./target/release/zvolrescue -f json list -r /tmp/moved-intact.img --txg 4816229 | python3 -c 'import json,sys; d=json.load(sys.stdin); names=[x["name"] for x in d["datasets"]]; assert names == ["tank","tank/vm","tank/vm/disk0","tank/vm/disk0@before"], names'
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/moved-intact.img -o /tmp/moved.img --txg 4816229
          cmp /tmp/disk0.img /tmp/moved.img
      - name: A member inside a whole-disk image (SPEC F-06, F-60)
        run: |
          python3 - <<'EOF'
          import struct
          member = open("/tmp/fx/member0.img", "rb").read()
          sector, start_lba = 512, 4096
          disk = bytearray(sector * (start_lba + len(member)//sector + 4096))
          disk[510], disk[511] = 0x55, 0xAA          # protective MBR
          disk[446+4] = 0xee
          struct.pack_into("<I", disk, 446+8, 1)
          struct.pack_into("<I", disk, 446+12, 0xffffffff)
          disk[sector:sector+8] = b"EFI PART"        # GPT header at LBA 1
          struct.pack_into("<I", disk, sector+80, 2)
          struct.pack_into("<I", disk, sector+84, 128)
          def guid_le(g):
              hx = bytes.fromhex(g.replace("-", ""))
              return struct.pack("<IHH", int.from_bytes(hx[0:4], "big"),
                                 int.from_bytes(hx[4:6], "big"),
                                 int.from_bytes(hx[6:8], "big")) + hx[8:16]
          def entry(kind, first, last, name):
              e = bytearray(128)
              e[0:16] = guid_le(kind)
              e[16:32] = b"\x22" * 16
              struct.pack_into("<Q", e, 32, first)
              struct.pack_into("<Q", e, 40, last)
              n = name.encode("utf-16-le")
              e[56:56+len(n)] = n
              return e
          entries = entry("0fc63daf-8483-4772-8e79-3d69d8477de4", 2048, 4095, "boot")
          entries += entry("6a898cc3-1dd2-11b2-99a6-080020736631", start_lba,
                           start_lba + len(member)//sector - 1, "zfs0")
          disk[sector*2:sector*2+len(entries)] = entries
          disk[start_lba*sector:start_lba*sector+len(member)] = member
          open("/tmp/fx/wholedisk.img", "wb").write(bytes(disk))
          EOF
          ./target/release/zvolrescue scan /tmp/fx/wholedisk.img
          ./target/release/zvolrescue -f json scan /tmp/fx/wholedisk.img | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"][0]; t=d["partitions"]; assert t["scheme"] == "gpt", t; assert [p["zfs"] for p in t["partitions"]] == [False, True], t; assert d["vdev_base"] == 2097152, d; assert d["vdev_base_from"] == "partition table", d; assert all(l["config_checksum"] == "ok" for l in d["labels"]), d["labels"]'
          # The pool inside it reads: the partition says where the vdev
          # starts and how long it is, so all four labels are where they
          # should be, and the volume comes back bit-exact.
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/fx/wholedisk.img --txg 4816229 -o /tmp/fx/from-disk.img
          cmp /tmp/disk0.img /tmp/fx/from-disk.img

      - name: A pool with no labels at all, read through a hand-written layout (SPEC F-65)
        run: |
          cargo run -q -p zfs-read --example mkfixture -- /tmp/hz raidz2 12
          python3 - <<'EOF'
          import json
          LABEL, PHYS_OFF, PHYS = 256*1024, 16*1024, 112*1024
          paths = []
          for i in range(4):
              b = bytearray(open(f"/tmp/hz/member{i}.img", "rb").read())
              aligned = len(b) & ~(LABEL-1)
              for off in (0, LABEL, aligned-2*LABEL, aligned-LABEL):
                  b[off+PHYS_OFF:off+PHYS_OFF+PHYS] = b"\0" * PHYS
              out = f"/tmp/hz/nolabel{i}.img"
              open(out, "wb").write(bytes(b))
              paths.append(out)
          json.dump({"name": "tank", "ashift": 12,
                     "tops": [{"kind": "raidz", "nparity": 2, "members": paths}]},
                    open("/tmp/hz/hints.json", "w"))
          EOF
          # Not one label survives: without the layout there is no pool.
          if ./target/release/zvolrescue -q list /tmp/hz/nolabel0.img /tmp/hz/nolabel1.img /tmp/hz/nolabel2.img /tmp/hz/nolabel3.img; then echo "must not read"; exit 1; else test $? = 2; fi
          # With it, the uberblocks the zero-point search confirmed carry
          # the rest: datasets, TXG history and the volume itself.
          ./target/release/zvolrescue -f json list -r /tmp/hz/nolabel0.img /tmp/hz/nolabel1.img /tmp/hz/nolabel2.img /tmp/hz/nolabel3.img --hints /tmp/hz/hints.json --txg 4816229 | python3 -c 'import json,sys; d=json.load(sys.stdin); names=[x["name"] for x in d["datasets"]]; assert names == ["tank","tank/vm","tank/vm/disk0","tank/vm/disk0@before"], names'
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/hz/nolabel0.img /tmp/hz/nolabel1.img /tmp/hz/nolabel2.img /tmp/hz/nolabel3.img --hints /tmp/hz/hints.json --txg 4816229 -o /tmp/hz/out.img
          cmp /tmp/disk0.img /tmp/hz/out.img
          # The order in a layout is what a DVA addresses, and a wrong one
          # costs redundancy rather than correctness: --search-order finds
          # the order no block has to be repaired around (SPEC F-66).
          python3 -c 'import json; d=json.load(open("/tmp/hz/hints.json")); m=d["tops"][0]["members"]; m[1],m[2]=m[2],m[1]; json.dump(d, open("/tmp/hz/swapped.json","w"))'
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/hz/nolabel0.img /tmp/hz/nolabel1.img /tmp/hz/nolabel2.img /tmp/hz/nolabel3.img --hints /tmp/hz/swapped.json --search-order --txg 4816229 -o /tmp/hz/searched.img 2>/tmp/hz/search.err
          cmp /tmp/disk0.img /tmp/hz/searched.img
          grep -q "best has 0 checksum mismatch" /tmp/hz/search.err
          grep -q "just as good" /tmp/hz/search.err && { echo "the right order must be unique here"; exit 1; } || true
          # The layout can be handed on as a label (SPEC F-67): placed on
          # a *copy* of each member, it makes the pool readable with no
          # hints at all. The image stops before the uberblock ring, so
          # the uberblocks already on the disk survive it.
          for i in 0 1 2 3; do
            ./target/release/zvolrescue -q scan /tmp/hz/nolabel0.img /tmp/hz/nolabel1.img /tmp/hz/nolabel2.img /tmp/hz/nolabel3.img --hints /tmp/hz/hints.json --emit-label /tmp/hz/L-$i.bin --emit-for 0:$i
            test "$(stat -c %s /tmp/hz/L-$i.bin)" = 131072
            cp /tmp/hz/nolabel$i.img /tmp/hz/relabel$i.img
            dd if=/tmp/hz/L-$i.bin of=/tmp/hz/relabel$i.img conv=notrunc status=none
          done
          ./target/release/zvolrescue -f json scan /tmp/hz/relabel0.img | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"][0]; assert d["config"]["ashift"] == 12, d["config"]; assert d["labels"][0]["verified"] > 0, d["labels"][0]'
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/hz/relabel0.img /tmp/hz/relabel1.img /tmp/hz/relabel2.img /tmp/hz/relabel3.img --txg 4816229 -o /tmp/hz/from-labels.img
          cmp /tmp/disk0.img /tmp/hz/from-labels.img
          # A layout that names a member which was not given is a usage error.
          python3 -c 'import json; d=json.load(open("/tmp/hz/hints.json")); d["tops"][0]["members"][0]="/tmp/nowhere.img"; json.dump(d, open("/tmp/hz/bad.json","w"))'
          if ./target/release/zvolrescue -q list /tmp/hz/nolabel0.img /tmp/hz/nolabel1.img /tmp/hz/nolabel2.img /tmp/hz/nolabel3.img --hints /tmp/hz/bad.json; then exit 1; else test $? = 1; fi
      - name: Bulk extraction and resume
        run: |
          ./target/release/zvolrescue -q dump -r tank /tmp/fx/member0.img /tmp/fx/member1.img -o /tmp/bulk --txg 4816229
          python3 -c 'import json; m=json.load(open("/tmp/bulk/manifest.json")); assert [v["dataset"] for v in m["volumes"]] == ["tank/vm/disk0"], m; assert m["volumes"][0]["sha256"] == "febfe0108392728dbde89ee63f9f25419a0192ac04420db3ad88b0032a088585"'
          cmp /tmp/disk0.img /tmp/bulk/tank_vm_disk0.img
          # Resume: pretend a run stopped after block 2 (16 KiB written), continue, same hash.
          head -c 16384 /tmp/disk0.img > /tmp/resume.img
          printf '{"version":1,"dataset":"tank/vm/disk0","dataset_guid":"0x00000000000000a3","txg":4816229,"volsize":33554432,"blocksize":8192,"blocks_done":2}' > /tmp/resume.img.resume.json
          ./target/release/zvolrescue -f json dump tank/vm/disk0 /tmp/fx/member0.img /tmp/fx/member1.img -o /tmp/resume.img --resume | python3 -c 'import json,sys; d=json.load(sys.stdin)["volumes"][0]; assert d["resumed_from_block"] == 2, d; assert d["blocks_read"] == 1, d; assert d["sha256"] == "febfe0108392728dbde89ee63f9f25419a0192ac04420db3ad88b0032a088585"'
          cmp /tmp/disk0.img /tmp/resume.img
          test ! -e /tmp/resume.img.resume.json
      - name: A SIGINT ends a dump where --resume takes it up (SPEC F-32)
        run: |
          # A real signal, part-way through a 512 MiB dense volume: the
          # run ends at the next block with its state written, exits 6,
          # names the block; resumed there, the image and its hash are
          # those of a straight run. Job control is on for the launch so
          # the background job does not inherit SIGINT ignored, as a
          # non-interactive shell's background jobs otherwise do.
          rm -rf /tmp/sigint && cargo run -q --release -p zfs-read --example mkfixture -- /tmp/sigint bench 12 512 off > /dev/null
          ./target/release/zvolrescue -q -f json dump tank/vm/disk0 /tmp/sigint/member0.img /tmp/sigint/member1.img -o /tmp/sigint/ref.img | python3 -c 'import json,sys; open("/tmp/sigint/ref.sha","w").write(json.load(sys.stdin)["volumes"][0]["sha256"])'
          set -m
          ./target/release/zvolrescue -f json dump tank/vm/disk0 /tmp/sigint/member0.img /tmp/sigint/member1.img -o /tmp/sigint/cut.img --evidence-log /tmp/sigint/ev.jsonl > /tmp/sigint/first.json 2>/tmp/sigint/first.err &
          pid=$!
          set +m
          for _ in $(seq 1 6000); do
            sz=$(stat -c %s /tmp/sigint/cut.img 2>/dev/null || echo 0)
            [ "$sz" -ge $((128 * 1048576)) ] && break
            kill -0 $pid 2>/dev/null || { echo "::error::the dump finished before 128 MiB were on disk"; exit 1; }
            sleep 0.005
          done
          kill -INT $pid
          set +e; wait $pid; code=$?; set -e
          cat /tmp/sigint/first.err
          test "$code" = 6
          grep -q "interrupted at block" /tmp/sigint/first.err
          python3 - <<'EOF'
          import json
          v = json.load(open("/tmp/sigint/first.json"))["volumes"][0]
          at = v["interrupted_at"]
          assert at > 0 and v["blocks_read"] == at and not v["aborted"], v
          s = json.load(open("/tmp/sigint/cut.img.resume.json"))
          assert s["blocks_done"] == at, (s, at)
          r = json.loads(open("/tmp/sigint/ev.jsonl").readlines()[-1])
          assert r["status"] == 6 and r["result"]["volumes"][0]["interrupted_at"] == at, r["status"]
          open("/tmp/sigint/at", "w").write(str(at))
          EOF
          ./target/release/zvolrescue -f json dump tank/vm/disk0 /tmp/sigint/member0.img /tmp/sigint/member1.img -o /tmp/sigint/cut.img --resume --evidence-log /tmp/sigint/ev.jsonl | python3 -c 'import json,sys; v=json.load(sys.stdin)["volumes"][0]; assert v["resumed_from_block"] == int(open("/tmp/sigint/at").read()), v; assert "interrupted_at" not in v, v; assert v["sha256"] == open("/tmp/sigint/ref.sha").read(), v'
          cmp /tmp/sigint/cut.img /tmp/sigint/ref.img
          test ! -e /tmp/sigint/cut.img.resume.json
          # zvolcarve scan: a SIGINT a second in ends it at the next
          # chunk (exit 6), the state file says where each member got
          # to, and --resume goes on from there to the end of a range.
          # The members are sparse 4 GiB copies — the 512 MiB ones scan
          # in under a second, which leaves nothing to interrupt.
          cp --sparse=always /tmp/sigint/member0.img /tmp/sigint/big0.img
          cp --sparse=always /tmp/sigint/member1.img /tmp/sigint/big1.img
          truncate -s 4G /tmp/sigint/big0.img /tmp/sigint/big1.img
          set -m
          ./target/release/zvolcarve -f json scan /tmp/sigint/big0.img /tmp/sigint/big1.img -o /tmp/sigint/carve > /tmp/sigint/scan1.json 2>/tmp/sigint/scan1.err &
          pid=$!
          set +m
          sleep 1
          kill -INT $pid
          set +e; wait $pid; code=$?; set -e
          cat /tmp/sigint/scan1.err
          test "$code" = 6
          python3 -c 'import json; s=json.load(open("/tmp/sigint/carve/state.json")); assert not s["complete"], s; assert s["reached"][0] < 4294967296 and s["reached"][1] == 0, s'
          ./target/release/zvolcarve -q -f json scan /tmp/sigint/big0.img /tmp/sigint/big1.img -o /tmp/sigint/carve --resume --range 0-805306368 > /tmp/sigint/scan2.json
          python3 -c 'import json; s=json.load(open("/tmp/sigint/carve/state.json")); assert s["complete"] and s["reached"][0] >= 805306368 and s["reached"][1] == 805306368, s'
          rm -f /tmp/sigint/big0.img /tmp/sigint/big1.img
          # zvolcarve dump: the candidate is the volume itself, found in
          # the range its dnode lives in; interrupted at 128 MiB, the
          # state file is the one zvolrescue would have written, and
          # --resume ends with zvolrescue's hash.
          ./target/release/zvolcarve -q -f json scan /tmp/sigint/member0.img /tmp/sigint/member1.img -o /tmp/sigint/carve-tail --range 536870912-564133888 > /tmp/sigint/scan3.json
          id=$(python3 -c 'import json; c=[c for c in json.load(open("/tmp/sigint/carve-tail/candidates.json"))["candidates"] if c["dnode_type_code"] == 23]; assert c, "no zvol candidate"; print(c[0]["id"])')
          set -m
          ./target/release/zvolcarve -f json dump /tmp/sigint/carve-tail "$id" /tmp/sigint/member0.img /tmp/sigint/member1.img -o /tmp/sigint/carved.img > /tmp/sigint/carved1.json 2>/tmp/sigint/carved1.err &
          pid=$!
          set +m
          for _ in $(seq 1 6000); do
            sz=$(stat -c %s /tmp/sigint/carved.img 2>/dev/null || echo 0)
            [ "$sz" -ge $((128 * 1048576)) ] && break
            kill -0 $pid 2>/dev/null || { echo "::error::the carve dump finished before 128 MiB were on disk"; exit 1; }
            sleep 0.005
          done
          kill -INT $pid
          set +e; wait $pid; code=$?; set -e
          cat /tmp/sigint/carved1.err
          test "$code" = 6
          python3 -c 'import json; v=json.load(open("/tmp/sigint/carved1.json")); at=v["interrupted_at"]; s=json.load(open("/tmp/sigint/carved.img.resume.json")); assert at > 0 and s["blocks_done"] == at and s["dataset"] == v["candidate"] and s["dataset_guid"] == "candidate", (v, s); open("/tmp/sigint/cat","w").write(str(at))'
          ./target/release/zvolcarve -f json dump /tmp/sigint/carve-tail "$id" /tmp/sigint/member0.img /tmp/sigint/member1.img -o /tmp/sigint/carved.img --resume | python3 -c 'import json,sys; v=json.load(sys.stdin); assert v["resumed_from_block"] == int(open("/tmp/sigint/cat").read()), v; assert v["interrupted_at"] is None, v; assert v["sha256"] == open("/tmp/sigint/ref.sha").read(), v'
          cmp /tmp/sigint/carved.img /tmp/sigint/ref.img
          test ! -e /tmp/sigint/carved.img.resume.json
      - name: The pool's history from its transaction groups (COMPANIONS T-01…T-05, T-10)
        run: |
          ./target/release/zvoltimeline --version
          ./target/release/zvoltimeline /tmp/fx/member0.img /tmp/fx/member1.img
          # The fixture's newest TXG no longer has the volume; the one
          # before it does. That is exactly what the timeline must say,
          # and it must say which TXG to go back to (T-05).
          ./target/release/zvoltimeline -f json /tmp/fx/member0.img /tmp/fx/member1.img > /tmp/tl.json
          python3 - <<'EOF'
          import json
          d = json.load(open("/tmp/tl.json"))
          assert d["txgs"] == [4816228, 4816229, 4816230], d["txgs"]
          assert d["unreadable_txgs"] == [], d["unreadable_txgs"]
          ev = {(e["event"], e.get("object")): e for e in d["events"]}
          gone = ev[("destroyed", "tank/vm/disk0")]
          assert gone["txg"] == 4816230, gone
          assert gone["last_seen_txg"] == 4816229, gone
          assert ("snapshot-destroyed", "tank/vm/disk0@before") in ev
          # Every dataset of a modern pool has an origin; none of these is
          # a clone (SPEC: dsl_dir_is_clone, not dd_origin_obj != 0).
          assert not [e for e in d["events"] if e["event"] == "clone"], d["events"]
          assert ("host", None) in ev, d["events"]
          open("/tmp/recover.sh", "w").write(gone["recover_with"] + "\n")
          EOF
          # The command it printed is the command that gets the volume
          # back, byte for byte (COMPANIONS §2.4).
          cat /tmp/recover.sh
          ( cd /tmp && PATH="$GITHUB_WORKSPACE/target/release:$PATH" sh recover.sh )
          cmp /tmp/disk0.img /tmp/tank_vm_disk0.img
          # T-10: the same evidence gives the same bytes.
          ./target/release/zvoltimeline -f json /tmp/fx/member0.img /tmp/fx/member1.img > /tmp/tl2.json
          cmp /tmp/tl.json /tmp/tl2.json
          # T-07: what ZFS has finished with but has not freed. On the
          # fixture nothing is pending, which is itself the right answer
          # and has to be said rather than left out.
          ./target/release/zvoltimeline -f json --pending /tmp/fx/member0.img /tmp/fx/member1.img | python3 -c 'import json,sys; e=[x for x in json.load(sys.stdin)["events"] if x["event"] == "pending"]; assert len(e) == 3, e; assert all("0 byte(s) not yet freed" in x["details"] for x in e), e'
          # T-08: one object, by name and by GUID.
          ./target/release/zvoltimeline -f json --dataset tank/vm/disk0 /tmp/fx/member0.img | python3 -c 'import json,sys; e=json.load(sys.stdin)["events"]; assert {x["object"] for x in e} == {"tank/vm/disk0"}, e; open("/tmp/guid","w").write(e[0]["guid"])'
          ./target/release/zvoltimeline -f json --dataset "$(cat /tmp/guid)" /tmp/fx/member0.img | python3 -c 'import json,sys; e=json.load(sys.stdin)["events"]; assert {x["object"] for x in e} == {"tank/vm/disk0"}, e'
          # A range with nothing in it is answered, not guessed at.
          if ./target/release/zvoltimeline --from 1 --to 2 /tmp/fx/member0.img; then echo "must fail"; exit 1; else test $? = 3; fi
          # Never a write to the evidence.
          sha256sum /tmp/fx/member0.img /tmp/fx/member1.img > /tmp/fx.sums
          ./target/release/zvoltimeline /tmp/fx/member0.img /tmp/fx/member1.img -o /tmp/tl.txt
          sha256sum -c /tmp/fx.sums
      - name: The case file, and checking it back (COMPANIONS R-01…R-07)
        run: |
          ./target/release/zvolreport --version
          rm -rf /tmp/case && mkdir -p /tmp/case && cd /tmp/case
          B="$GITHUB_WORKSPACE/target/release"
          # UC-1 end to end, every step appending to one evidence log.
          "$B/zvolrescue" -q --hash-inputs scan /tmp/fx/member0.img /tmp/fx/member1.img --evidence-log case.jsonl
          "$B/zvoltimeline" /tmp/fx/member0.img /tmp/fx/member1.img -o timeline.txt --evidence-log case.jsonl
          "$B/zvolrescue" -q dump tank/vm/disk0 /tmp/fx/member0.img /tmp/fx/member1.img --txg 4816229 -o disk0.img --evidence-log case.jsonl
          "$B/zvolreport" build case.jsonl -o report.json --md report.md --case 42 --examiner "CI" --note "fixture pool"
          python3 - <<'EOF'
          import json
          r = json.load(open("/tmp/case/report.json"))
          assert r["case"] == "42" and r["examiner"] == "CI", r
          assert [t["tool"] for t in r["tools"]] == ["zvolrescue", "zvoltimeline"], r["tools"]
          # Every command, in the order it ran, with its exit code.
          assert [c["status"] for c in r["commands"]] == [0, 0, 0], r["commands"]
          assert len(r["commands"]) == 3, r["commands"]
          # --hash-inputs was given, so the evidence carries hashes.
          assert all(e["sha256"] for e in r["evidence"]), r["evidence"]
          assert r["pools"][0]["name"] == "tank", r["pools"]
          assert r["pools"][0]["txg_window"] == [4816228, 4816230], r["pools"]
          e = r["extractions"][0]
          assert e["dataset"] == "tank/vm/disk0" and e["txg"] == 4816229, e
          assert e["sha256"] == "febfe0108392728dbde89ee63f9f25419a0192ac04420db3ad88b0032a088585", e
          assert e["errors"] == 0 and not e["aborted"], e
          assert r.get("warnings", []) == [], r["warnings"]
          assert "tank/vm/disk0" in open("/tmp/case/report.md").read()
          EOF
          # R-03: the same log and flags, byte for byte.
          "$B/zvolreport" build case.jsonl -o again.json --case 42 --examiner "CI" --note "fixture pool" >/dev/null
          cmp report.json again.json
          # R-04: everything still matches what was recorded.
          "$B/zvolreport" verify report.json
          # R-07: a signature over the exact bytes of report.json, in a
          # form somebody without this tool can check. openssl is the
          # oracle in both directions: it reads the key we wrote, we read
          # the key it wrote, it verifies our signature and we verify its.
          "$B/zvolreport" keygen -o case.key
          test "$(stat -c %a case.key)" = 600
          openssl pkey -in case.key -pubout -out ours-by-openssl.pub
          cmp ours-by-openssl.pub case.key.pub
          openssl genpkey -algorithm ed25519 -out theirs.key
          openssl pkey -in theirs.key -pubout -out theirs.pub
          "$B/zvolreport" build case.jsonl -o signed.json --case 42 --examiner "CI" --note "fixture pool" --sign theirs.key >/dev/null
          # Signing says nothing new about the document: R-03 still holds.
          cmp report.json signed.json
          openssl pkeyutl -verify -pubin -inkey theirs.pub -rawin -in signed.json -sigfile signed.json.sig
          "$B/zvolreport" verify signed.json --key theirs.pub
          openssl pkeyutl -sign -inkey theirs.key -rawin -in signed.json -out openssl.sig
          "$B/zvolreport" verify signed.json --key theirs.pub --signature openssl.sig
          # The wrong key, an edited value, a byte appended, and no
          # signature at all: each of them exits 4.
          "$B/zvolreport" build case.jsonl -o mine.json --case 42 --sign case.key >/dev/null
          if "$B/zvolreport" verify mine.json --key theirs.pub; then echo "must fail"; exit 1; else test $? = 4; fi
          sed 's/"case": "42"/"case": "43"/' signed.json > edited.json
          cp signed.json.sig edited.json.sig
          if "$B/zvolreport" verify edited.json --key theirs.pub; then echo "must fail"; exit 1; else test $? = 4; fi
          printf 'x' >> edited.json
          if "$B/zvolreport" verify edited.json --key theirs.pub; then echo "must fail"; exit 1; else test $? = 4; fi
          rm -f mine.json.sig
          if "$B/zvolreport" verify mine.json --key case.key.pub; then echo "must fail"; exit 1; else test $? = 4; fi
          # One byte of the extracted image, and it does not.
          printf '\xff' | dd of=disk0.img bs=1 seek=4096 conv=notrunc status=none
          if "$B/zvolreport" verify report.json; then echo "must fail"; exit 1; else test $? = 4; fi
          "$B/zvolreport" -f json verify report.json | python3 -c 'import json,sys; d=json.load(sys.stdin); bad=[c for c in d["checked"] if c["status"] == "fail"]; assert len(bad) == 1 and bad[0]["path"].endswith("disk0.img"), d'
          # A file that is gone breaks the chain as surely as one that changed.
          rm disk0.img
          if "$B/zvolreport" verify report.json; then echo "must fail"; exit 1; else test $? = 4; fi
          # R-01: a record format this build does not read is refused, not skipped.
          sed 's/"v":1/"v":2/' case.jsonl > future.jsonl
          if "$B/zvolreport" build future.jsonl -o no.json; then echo "must fail"; exit 1; else test $? = 2; fi
          echo '{"hello":1}' > junk.jsonl
          if "$B/zvolreport" build junk.jsonl -o no.json; then echo "must fail"; exit 1; else test $? = 2; fi
          cd "$GITHUB_WORKSPACE"
      - name: A volume no uberblock leads to, found by carving (COMPANIONS §3.4)
        run: |
          ./target/release/zvolcarve --version
          # The same pool, with the volume on the members and no
          # uberblock mentioning it at any transaction group.
          cargo run -q -p zfs-read --example mkfixture -- /tmp/cv mirror 12 carved
          ./target/release/zvolrescue -f json list -r /tmp/cv/member0.img /tmp/cv/member1.img | python3 -c 'import json,sys; n=[d["name"] for d in json.load(sys.stdin)["datasets"]]; assert n == ["tank","tank/vm"], n'
          # A walk cannot find it. A scan of raw space can.
          rm -rf /tmp/carve
          ./target/release/zvolcarve -q scan /tmp/cv/member0.img /tmp/cv/member1.img -o /tmp/carve
          ./target/release/zvolcarve list /tmp/carve
          python3 - <<'EOF'
          import json
          i = json.load(open("/tmp/carve/candidates.json"))
          best = i["candidates"][0]
          assert best["dnode_type_code"] == 23, best        # DMU_OT_ZVOL
          assert best["volblocksize"] == 8192, best
          assert not best.get("profile_misses"), best
          assert best["assessment"]["blocks_failed"] == 0, best
          assert best["assessment"]["agreement"] == 1.0, best
          # Everything that failed the profile ranks below everything
          # that matched it, whatever else it has going for it (C-18).
          matched = [c["score"] for c in i["candidates"] if not c.get("profile_misses")]
          missed = [c["score"] for c in i["candidates"] if c.get("profile_misses")]
          assert min(matched) > 0.5 > max(missed, default=0.0), (matched, missed)
          open("/tmp/carve/best", "w").write(best["id"])
          EOF
          # C-12: the dnode says four blocks of 8 KiB, and the volume was
          # made for 32 MiB. Only what is inside it knows that, and it is
          # the number `dump` must use when none is given.
          python3 -c 'import json; c=json.load(open("/tmp/carve/candidates.json"))["candidates"][0]; f=c["contents"][0]; assert f["kind"] == "ext2/3/4", c["contents"]; assert f["size"] == 33554432, f; assert f["label"] == "fixture", f; assert c["implied_size"] == 32768, c'
          # And it comes out byte for byte what the walked extraction
          # gives — with no size given at all.
          ./target/release/zvolcarve dump /tmp/carve "$(cat /tmp/carve/best)" /tmp/cv/member0.img /tmp/cv/member1.img -o /tmp/carved.img
          test "$(stat -c %s /tmp/carved.img)" = 33554432
          echo "febfe0108392728dbde89ee63f9f25419a0192ac04420db3ad88b0032a088585  /tmp/carved.img" | sha256sum -c -
          cmp /tmp/disk0.img /tmp/carved.img
          # C-09: the same on raidz2. A dnode is 512 bytes and lies whole
          # inside one allocation sector on one column, so recognition
          # works there too; the extraction goes through the pool, so it
          # works with members missing.
          cargo run -q -p zfs-read --example mkfixture -- /tmp/cvz raidz2 12 carved
          rm -rf /tmp/carvez
          ./target/release/zvolcarve -q scan /tmp/cvz/member0.img /tmp/cvz/member1.img /tmp/cvz/member2.img /tmp/cvz/member3.img -o /tmp/carvez
          python3 - <<'EOF'
          import json
          best = json.load(open("/tmp/carvez/candidates.json"))["candidates"][0]
          assert best["dnode_type_code"] == 23, best
          assert best["assessment"]["agreement"] == 1.0, best
          open("/tmp/carvez/best", "w").write(best["id"])
          EOF
          ./target/release/zvolcarve -q dump /tmp/carvez "$(cat /tmp/carvez/best)" /tmp/cvz/member0.img /tmp/cvz/member1.img /tmp/cvz/member2.img /tmp/cvz/member3.img -o /tmp/carvedz.img
          cmp /tmp/disk0.img /tmp/carvedz.img
          # Two of four members gone: rebuilt from parity, same bytes.
          ./target/release/zvolcarve -q dump /tmp/carvez "$(cat /tmp/carvez/best)" /tmp/cvz/member1.img /tmp/cvz/member3.img -o /tmp/carvedz2.img
          cmp /tmp/disk0.img /tmp/carvedz2.img
          # C-11: a candidate is named by a dataset dnode the scan met,
          # since names themselves live in the MOS a carve cannot reach.
          python3 - <<'EOF'
          import json
          i = json.load(open("/tmp/carve/candidates.json"))
          assert i["datasets_met"] > 0, i["datasets_met"]
          best = i["candidates"][0]
          assert best["dataset_guid"] == "0x00000000000000a3", best
          assert best["dataset_creation_txg"] == 30, best
          EOF
          # C-06 on a pool whose configuration says where its metaslabs
          # are but whose MOS has no such object: the space has to come
          # back unaccounted for, by name, never as free. "We could not
          # look" and "it is free" are opposite answers for a recovery.
          python3 - <<'EOF'
          import json
          i = json.load(open("/tmp/carve/candidates.json"))
          space = i["space"]
          assert space["vdevs_read"] == 0, space
          assert space["skipped"], space
          a = i["candidates"][0]["assessment"]
          assert a["blocks_free"] == 0 and a["blocks_allocated"] == 0, a
          assert a["blocks_unknown"] > 0, a
          EOF
          # C-10: the compressions tried are the operator's to choose, and
          # dropping the one a pool used finds nothing at all. The
          # fixture's metadata is plaintext, so the plaintext pass alone
          # must still find the volume — and every codec named must be
          # one this build knows.
          rm -rf /tmp/carve-plain
          ./target/release/zvolcarve -f json scan /tmp/cv/member0.img -o /tmp/carve-plain --compressed none | python3 -c 'import json,sys; d=json.load(sys.stdin); z=[c for c in d["candidates"] if c["dnode_type_code"] == 23]; assert z, d["rejected"]; assert all(c["found"] == "plaintext" for c in d["candidates"]), d["candidates"][:2]'
          if ./target/release/zvolcarve -q scan /tmp/cv/member0.img -o /tmp/carve-plain --compressed lz4,nope; then echo "must fail"; exit 1; else test $? = 1; fi
          # C-19: with --sample, what is on the disk instead of a filter.
          rm -rf /tmp/carve-s
          ./target/release/zvolcarve -f json scan /tmp/cv/member0.img -o /tmp/carve-s --sample 50 | python3 -c 'import json,sys; h=json.load(sys.stdin)["histograms"]; assert h["sampled"] > 0, h; assert h["volblocksize"] and h["levels"] and h["dnode_type"], h; assert "8192" in [b["value"] for b in h["volblocksize"]], h["volblocksize"]'
          # C-14: an empty result must be a rejection, not an absence.
          rm -rf /tmp/carve-none
          ./target/release/zvolcarve -f json scan /tmp/cv/member0.img -o /tmp/carve-none --volblocksize 1048576 --strict-profile | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["candidates"] == []; assert d["rejected_by_profile"] > 0, d; names=[r["reason"] for r in d["rejected"] if r["profile"]]; assert "profile_volblocksize" in names, names'
          # C-17: the profile taken off a sibling the pool still has.
          rm -rf /tmp/carve-like
          ./target/release/zvolcarve -q scan /tmp/fx/member0.img -o /tmp/carve-like --like tank/vm/disk0
          python3 -c 'import json; p=json.load(open("/tmp/carve-like/candidates.json"))["profile"]; assert p["volblocksize"] == 8192 and p["levels"] == 1 and p["size"] == [33554432, 33554432], p'
          # C-08: interrupted, then resumed, is the same as one pass.
          rm -rf /tmp/carve-r /tmp/carve-1
          if ./target/release/zvolcarve -q scan /tmp/cv/member0.img -o /tmp/carve-r --max-hits 3 --dnode-type any; then echo "must exit 6"; exit 1; else test $? = 6; fi
          ./target/release/zvolcarve -q scan /tmp/cv/member0.img -o /tmp/carve-r --resume --dnode-type any
          ./target/release/zvolcarve -q scan /tmp/cv/member0.img -o /tmp/carve-1 --dnode-type any
          python3 -c 'import json; a=json.load(open("/tmp/carve-r/candidates.json")); b=json.load(open("/tmp/carve-1/candidates.json")); ka=sorted((c["device"],c["offset"],c["slot"]) for c in a["candidates"]); kb=sorted((c["device"],c["offset"],c["slot"]) for c in b["candidates"]); assert ka == kb, (len(ka), len(kb))'
          # Never a write to the evidence, and never one onto it.
          sha256sum /tmp/cv/member0.img /tmp/cv/member1.img > /tmp/cv.sums
          sha256sum -c /tmp/cv.sums
          if ./target/release/zvolcarve -q scan /tmp/cv/member0.img -o /tmp/cv/member0.img; then echo "must refuse"; exit 1; else test $? = 5; fi
      - name: A feature this build cannot account for stops the read (SPEC F-70)
        run: |
          # The failure this prevents is the only silent one left: a
          # reflowed raidz reads the wrong blocks and their checksums
          # agree with themselves, so nothing objects.
          rm -rf /tmp/f70 /tmp/f70x /tmp/f70y
          cargo run -q -p zfs-read --example mkfixture -- /tmp/f70 mirror 12
          cargo run -q -p zfs-read --example mkfixture -- /tmp/f70x mirror 12 "" org.openzfs:raidz_expansion
          cargo run -q -p zfs-read --example mkfixture -- /tmp/f70y mirror 12 "" org.example:not_a_real_feature
          # A pool whose active features are all accounted for reads as before.
          ./target/release/zvolrescue -q list -r /tmp/f70/member0.img /tmp/f70/member1.img > /dev/null
          # A real ztest pool carries hole_birth, embedded_data and
          # vdev_zaps_v2; the cross-check job proves those read correctly,
          # and this proves they are not refused.
          # Known and unimplemented: refused, and named as such.
          if ./target/release/zvolrescue -q list -r /tmp/f70x/member0.img /tmp/f70x/member1.img; then echo "must refuse"; exit 1; else test $? = 3; fi
          ./target/release/zvolrescue -q list -r /tmp/f70x/member0.img 2>&1 | grep -q "raidz_expansion: not implemented"
          # Unknown: refused too, with the other message.
          if ./target/release/zvolrescue -q list -r /tmp/f70y/member0.img; then echo "must refuse"; exit 1; else test $? = 3; fi
          ./target/release/zvolrescue -q list -r /tmp/f70y/member0.img 2>&1 | grep -q "unknown to this build"
          # The override reads, and says what it costs.
          ./target/release/zvolrescue -q list -r --ignore-unknown-features /tmp/f70x/member0.img /tmp/f70x/member1.img > /dev/null
          ./target/release/zvolrescue -q list -r --ignore-unknown-features /tmp/f70x/member0.img 2>&1 | grep -q "no checksum catches"
          # `scan` surveys rather than refuses, and says it unprompted —
          # not behind -v, because it is what an operator looks at first.
          ./target/release/zvolrescue -q scan /tmp/f70x/member0.img | grep -q "NOT ACCOUNTED FOR: org.openzfs:raidz_expansion"
          ./target/release/zvolrescue -q -f json scan /tmp/f70x/member0.img | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["devices"][0]["config"]["unaccounted_features"] == ["org.openzfs:raidz_expansion"], d["devices"][0]["config"]'
          test "$(./target/release/zvolrescue -q scan /tmp/f70/member0.img | grep -c 'NOT ACCOUNTED FOR')" = 0
          # The companions share the check, since they share the members.
          if ./target/release/zvolfiles -q list tank/fs /tmp/f70x/member0.img; then echo "must refuse"; exit 1; else test $? = 3; fi
      - name: The legacy digests, taken in the same pass (SPEC F-53)
        run: |
          # An extracted image usually leaves for a toolchain that may
          # only speak MD5 or SHA-1. Taking them later costs another
          # full read of the image, so they are taken as it is written —
          # and they have to be the same digests coreutils computes, or
          # they are worth nothing to whatever is waiting.
          rm -rf /tmp/f53 && mkdir -p /tmp/f53
          cargo run -q -p zfs-read --example mkfixture -- /tmp/f53 mirror 12
          cd /tmp/f53
          $GITHUB_WORKSPACE/target/release/zvolrescue -q --evidence-log case.jsonl \
            dump tank/vm/disk0 member0.img member1.img --txg 4816229 --hash md5,sha1 -o vol.img > out
          grep -q "^  sha1:   $(sha1sum vol.img | cut -d' ' -f1)$" out
          grep -q "^  md5:    $(md5sum vol.img | cut -d' ' -f1)$" out
          grep -q "^  sha256: $(sha256sum vol.img | cut -d' ' -f1)$" out
          # Not asked for is not computed, and not written down.
          $GITHUB_WORKSPACE/target/release/zvolrescue -q dump tank/vm/disk0 member0.img \
            --txg 4816229 -o plain.img > plain.out
          test "$(grep -c 'sha1:\|md5:' plain.out)" = 0
          # A name that is not a digest is refused rather than ignored.
          if $GITHUB_WORKSPACE/target/release/zvolrescue -q dump tank/vm/disk0 member0.img \
               --txg 4816229 --hash crc32 -o x.img; then echo "must refuse"; exit 1; else test $? = 1; fi
          # The record carries all three, and verify checks all three back.
          $GITHUB_WORKSPACE/target/release/zvolreport -q build case.jsonl -o report.json > /dev/null
          $GITHUB_WORKSPACE/target/release/zvolreport -q verify report.json > verified
          grep -q "output    PASS      sha256" verified
          grep -q "output    PASS      sha1" verified
          grep -q "output    PASS      md5" verified
          # One byte changed, and every one of them says so.
          printf '\xff' | dd of=vol.img bs=1 seek=100 conv=notrunc status=none
          if $GITHUB_WORKSPACE/target/release/zvolreport -q verify report.json > broke; then
            echo "must fail"; exit 1; else test $? = 4; fi
          test "$(grep -c 'output    FAIL' broke)" = 3
          cd "$GITHUB_WORKSPACE"
      - name: The properties a dataset has set, user properties included (SPEC F-14)
        run: |
          # Only what was set on the dataset itself is on disk. A number
          # keeps its number unless this build can show its working for
          # a name: checksum and compression share the block pointer's
          # own enumerations, and nothing else is decoded.
          rm -rf /tmp/f14
          cargo run -q -p zfs-read --example mkfixture -- /tmp/f14 mirror 12
          ./target/release/zvolrescue -q list -r -p --txg 4816229 /tmp/f14/member0.img /tmp/f14/member1.img > /tmp/f14/out
          grep -q "property: compression = 15 (lz4)" /tmp/f14/out
          grep -q "property: checksum = 12 (skein)" /tmp/f14/out
          # A user property: a string, unquoted, with no meaning invented.
          grep -q "property: org.example:ticket = RT-4471" /tmp/f14/out
          # A dataset that set none shows none, and asking is what makes
          # the difference between "none set" and "not asked".
          test "$(grep -c 'property:' /tmp/f14/out)" = 3
          test "$(./target/release/zvolrescue -q list -r --txg 4816229 /tmp/f14/member0.img | grep -c 'property:')" = 0
          ./target/release/zvolrescue -q -f json list -r -p --txg 4816229 /tmp/f14/member0.img | python3 -c '
          import json,sys
          d = json.load(sys.stdin)
          by = {x["name"]: x for x in d["datasets"]}
          got = by["tank/vm/disk0"]["properties"]
          assert got == [
              {"name": "compression", "value": 15, "means": "lz4"},
              {"name": "checksum", "value": 12, "means": "skein"},
              {"name": "org.example:ticket", "value": "RT-4471"},
          ], got
          # Set nothing, and the list is empty rather than absent.
          assert by["tank/vm"]["properties"] == [], by["tank/vm"]
          '
      - name: A pool a top-level vdev was removed from (SPEC F-69)
        run: |
          # The volume's data blocks are addressed on a vdev that is gone;
          # the mapping it left behind in the MOS says where those bytes
          # went. Nothing in the labels describes that vdev, because
          # removal is what took its members away.
          rm -rf /tmp/f69 /tmp/f69b
          cargo run -q -p zfs-read --example mkfixture -- /tmp/f69 mirror 12 removed
          cargo run -q -p zfs-read --example mkfixture -- /tmp/f69b mirror 12
          ./target/release/zvolrescue -q list -r /tmp/f69/member0.img /tmp/f69/member1.img | grep -q "tank/vm/disk0"
          # device_removal is active and accounted for, so no refusal.
          test "$(./target/release/zvolrescue -q scan /tmp/f69/member0.img | grep -c 'NOT ACCOUNTED FOR')" = 0
          # The same volume, byte for byte, as on a pool that never had a
          # vdev removed: the translation is right or the hash is not.
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/f69/member0.img /tmp/f69/member1.img -o /tmp/f69/out.img > /tmp/f69/log
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/f69b/member0.img /tmp/f69b/member1.img --txg 4816229 -o /tmp/f69b/out.img > /tmp/f69b/log
          cmp /tmp/f69/out.img /tmp/f69b/out.img
          grep -q "0 zeroed (unreadable)" /tmp/f69/log
          # The removed vdev is still counted and has no member to find.
          # From the labels alone that is a missing vdev; `scan` asks the
          # pool's own configuration and says which it really is — so a
          # pool with every live member present is READABLE, not "NOT
          # readable", and the JSON `readable` a script keys on is true.
          ./target/release/zvolrescue -q scan /tmp/f69/member0.img /tmp/f69/member1.img | grep -q "top-level vdev #1: removed; its blocks live on the vdevs that remain"
          ./target/release/zvolrescue -q scan /tmp/f69/member0.img /tmp/f69/member1.img | grep -q "READABLE from scanned members"
          ./target/release/zvolrescue -q -f json scan /tmp/f69/member0.img /tmp/f69/member1.img | python3 -c 'import json,sys; p=json.load(sys.stdin)["pools"][0]; assert p["readable"] and p["removed_tops"] == [1] and p["missing_tops"] == [], p'
          # A pool that never had a vdev removed never opens its MOS for this.
          test "$(./target/release/zvolrescue -q --debug scan /tmp/f69b/member0.img /tmp/f69b/member1.img 2>&1 | grep -c '\[indirect\]')" = 0
          # A label-less member is still bound into a pool with a removed
          # vdev: the vdev that is gone on purpose is not a reason to
          # refuse the one that is only unlabelled (SPEC F-62).
          cp /tmp/f69/member1.img /tmp/f69/nolabel.img
          python3 -c 'b=bytearray(open("/tmp/f69/nolabel.img","rb").read())
          for off in (0, 256*1024, len(b)-512*1024, len(b)-256*1024):
              b[off+16*1024:off+128*1024] = bytes(112*1024)
          open("/tmp/f69/nolabel.img","wb").write(bytes(b))'
          ./target/release/zvolrescue -q list -r /tmp/f69/nolabel.img /tmp/f69/member0.img --assume-member /tmp/f69/nolabel.img 2>&1 | grep -q "read as leaf"
          # Never a write to the evidence.
          sha256sum /tmp/f69/member0.img /tmp/f69/member1.img > /tmp/f69.sums
          ./target/release/zvolfiles -q list tank /tmp/f69/member0.img > /dev/null 2>&1 || true
          sha256sum -c /tmp/f69.sums
      - name: Where the vdev begins, from the pointers alone (SPEC F-63, COMPANIONS C-21)
        run: |
          # A member with every label gone, sitting at a known offset
          # inside a larger device: no label, no partition table, no
          # sibling, no uberblock ring, no hints. Only the pointers.
          cargo run -q -p zfs-read --example mkfixture -- /tmp/f63 mirror 12 zpl
          python3 - <<'EOF'
          import os
          LABEL, AT = 256 << 10, 1 << 20
          m = bytearray(open("/tmp/f63/member0.img", "rb").read())
          tail = (len(m) // LABEL) * LABEL
          for b in (0, LABEL, tail - 2 * LABEL, tail - LABEL):
              m[b:b + LABEL] = b"\0" * LABEL
          with open("/tmp/f63/disk.img", "wb") as f:
              f.write(b"\0" * AT)
              f.write(bytes(m))
              f.write(b"\0" * (2 << 20))
          EOF
          # Nothing else can place it, or the case proves nothing.
          ./target/release/zvolrescue -q -f json scan /tmp/f63/disk.img | python3 -c 'import json,sys; d=json.load(sys.stdin); assert not d["devices"][0].get("pool"), d["devices"][0]'
          ./target/release/zvolcarve -f json zeropoint /tmp/f63/disk.img > /tmp/f63/zp.json
          python3 - <<'EOF'
          import json
          m = json.load(open("/tmp/f63/zp.json"))["members"][0]
          assert m["probes"] > 0, m
          # Every allocation is a multiple of 1 << ashift, so the shared
          # alignment cannot be finer than the pool's 12.
          assert 12 in m["shifts"], m
          best = m["bases"][0]
          assert best["base"] == (1 << 20), m["bases"]
          assert best["confirmed"] > 1, best
          # A wrong base can agree with a probe by landing on a different
          # block of identical content, so what has to hold is that the
          # right one agrees with more — not that nothing else agrees.
          for other in m["bases"][1:]:
              assert other["confirmed"] < best["confirmed"], m["bases"]
          EOF
          # And a device with no pool on it yields no base at all.
          head -c 8388608 /dev/zero > /tmp/f63/empty.img
          if ./target/release/zvolcarve -q zeropoint /tmp/f63/empty.img; then echo "an empty device must yield nothing"; exit 1; else test $? = 3; fi
          # Never a write to the evidence.
          sha256sum /tmp/f63/disk.img > /tmp/f63.sums
          sha256sum -c /tmp/f63.sums
      - name: The MOS when no uberblock survives (SPEC F-64, COMPANIONS C-20)
        run: |
          # Every other way into a pool starts at an uberblock. With all
          # four rings zeroed there is no root pointer anywhere, and the
          # only way in is the MOS's own header, found in raw space.
          cargo run -q -p zfs-read --example mkfixture -- /tmp/f64 mirror 12 sample
          python3 - <<'EOF'
          import os
          LABEL, UB_OFF, UB_SIZE = 256 << 10, 128 << 10, 128 << 10
          for name in ("member0.img", "member1.img"):
              p = f"/tmp/f64/{name}"
              n = os.path.getsize(p)
              tail = (n // LABEL) * LABEL
              with open(p, "r+b") as f:
                  for base in (0, LABEL, tail - 2 * LABEL, tail - LABEL):
                      f.seek(base + UB_OFF)
                      f.write(b"\0" * UB_SIZE)
          EOF
          # The ordinary path must now fail, or the case proves nothing.
          if ./target/release/zvolrescue -q list -r /tmp/f64/member0.img /tmp/f64/member1.img; then echo "an uberblock survived; the case is void"; exit 1; else test $? = 3; fi
          rm -rf /tmp/f64out
          ./target/release/zvolcarve roots /tmp/f64/member0.img /tmp/f64/member1.img -o /tmp/f64out
          python3 - <<'EOF'
          import json
          d = json.load(open("/tmp/f64out/roots.json"))
          assert d["roots"], "no MOS header was found"
          best = d["roots"][0]
          # Ranked by how much of the pool came out, so the best one is
          # the one a whole dataset tree walked out of.
          assert best["datasets"] >= 2, best
          assert "tank" in best["sample"] and "tank/vm" in best["sample"], best
          assert "error" not in best, best
          # And a header that walked out nothing says why rather than
          # being dropped, so "unreadable" is told from "absent".
          for r in d["roots"]:
              assert r["datasets"] > 0 or r.get("error"), r
          EOF
          # Never a write to the evidence, and never one onto it.
          sha256sum /tmp/f64/member0.img /tmp/f64/member1.img > /tmp/f64.sums
          sha256sum -c /tmp/f64.sums
          if ./target/release/zvolcarve -q roots /tmp/f64/member0.img -o /tmp/f64/member0.img; then echo "must refuse"; exit 1; else test $? = 5; fi
      - name: Files out of a filesystem dataset (COMPANIONS §5.4)
        run: |
          ./target/release/zvolfiles --version
          cargo run -q -p zfs-read --example mkfixture -- /tmp/zp mirror 12 zpl
          ./target/release/zvolfiles list tank/fs /tmp/zp/member0.img /tmp/zp/member1.img -R
          ./target/release/zvolfiles -f json list tank/fs /tmp/zp/member0.img /tmp/zp/member1.img -R > /tmp/zp/list.json
          python3 - <<'EOF'
          import json
          d = json.load(open("/tmp/zp/list.json"))
          by = {f["path"]: f for f in d["files"]}
          assert list(by) == ["bigdnode.txt", "caf\ufffd.txt", "hardlink.txt", "hello.txt", "link", "spilled.txt", "sub", "sub/deep.txt"], list(by)
          # Z-09: a name that is not UTF-8 prints as best it can and
          # carries its exact bytes alongside; the others carry none.
          assert by["caf\ufffd.txt"]["path_hex"] == "636166e92e747874", by["caf\ufffd.txt"]
          assert all("path_hex" not in f for p, f in by.items() if p != "caf\ufffd.txt"), by
          # Z-04: extended attributes out of the system attributes.
          assert by["hello.txt"]["xattrs"] == ["user.case", "user.note"], by["hello.txt"]
          assert "xattrs" not in by["sub/deep.txt"], by["sub/deep.txt"]
          # Z-10: an attribute too large for the bonus buffer is in the
          # spill block, and a dnode two slots wide is read across both.
          # Both files look complete without them, which is the point.
          assert by["spilled.txt"]["xattrs"] == ["user.spilled"], by["spilled.txt"]
          assert by["bigdnode.txt"]["xattrs"] == ["user.wide"], by["bigdnode.txt"]
          # Z-10: a project id where the dataset keeps one, and no key at
          # all where it does not. Absent is not project zero: zero is a
          # project a file can really be in.
          assert by["sub/deep.txt"]["projid"] == 42, by["sub/deep.txt"]
          assert all("projid" not in f for p, f in by.items() if p != "sub/deep.txt"), by
          # Z-07: two names, one object.
          assert by["hardlink.txt"]["object"] == by["hello.txt"]["object"], by
          assert by["hello.txt"]["links"] == 2, by
          # Z-02: metadata out of the system attributes, not guessed at.
          assert by["hello.txt"]["type"] == "-" and by["hello.txt"]["mode"] == "0644", by
          assert by["hello.txt"]["size"] == 38, by
          assert by["sub"]["type"] == "d" and by["sub"]["mode"] == "0755", by
          assert by["sub/deep.txt"]["mode"] == "0600", by
          # Z-03: a symlink whose target lives in the attributes.
          assert by["link"]["type"] == "l" and by["link"]["target"] == "sub/deep.txt", by
          assert all("error" not in f for f in d["files"]), d["files"]
          EOF
          # Z-03, Z-05: the tree out, with a manifest that hashes it.
          rm -rf /tmp/zp/out
          ./target/release/zvolfiles extract tank/fs /tmp/zp/member0.img /tmp/zp/member1.img -o /tmp/zp/out
          test "$(cat /tmp/zp/out/hello.txt)" = "hello from a dataset nobody can mount"
          echo "d67c656e01756650d77717b0839985a056ec28ffe174601d690fc407a2ceffca  /tmp/zp/out/sub/deep.txt" | sha256sum -c -
          test "$(stat -c %a /tmp/zp/out/sub/deep.txt)" = 600
          python3 - <<'EOF'
          import json, os
          m = json.load(open("/tmp/zp/out/manifest.json"))
          f = {x["path"]: x for x in m["files"]}
          assert f["sub/deep.txt"]["sha256"] == "d67c656e01756650d77717b0839985a056ec28ffe174601d690fc407a2ceffca", f
          assert m["incomplete"] == 0 and m["failed"] == 0, m
          # Z-07: the second name is a hard link on disk, not a copy.
          assert m["hardlinks"] == 1, m
          assert f["hello.txt"]["hardlink_to"] == "hardlink.txt", f["hello.txt"]
          a = os.stat("/tmp/zp/out/hello.txt")
          b = os.stat("/tmp/zp/out/hardlink.txt")
          assert (a.st_ino, a.st_nlink) == (b.st_ino, 2), (a, b)
          # Z-09: the file is on disk under the bytes it had, not under
          # the replacement characters its name prints as.
          names = sorted(n for n in os.listdir(b"/tmp/zp/out") if not n.isascii())
          assert names == [b"caf\xe9.txt"], names
          assert open(b"/tmp/zp/out/caf\xe9.txt", "rb").read() == b"a name is bytes, not text\n"
          assert f["caf\ufffd.txt"]["path_hex"] == "636166e92e747874", f
          # Z-04: attributes recorded with their values, since applying
          # them would need the platform's own call.
          x = {v["name"]: v["value"] for v in f["hello.txt"]["xattrs"]}
          assert x == {"user.case": "42", "user.note": "kept in the attributes"}, x
          # Z-10: and the ones that only a spill block or a second dnode
          # slot had room for come out whole, not truncated.
          x = {v["name"]: v for v in f["spilled.txt"]["xattrs"]}
          assert x["user.spilled"]["bytes"] == 600, x
          assert x["user.spilled"]["value"].startswith("abcdefghij"), x
          x = {v["name"]: v for v in f["bigdnode.txt"]["xattrs"]}
          assert x["user.wide"]["bytes"] == 400, x
          # Z-10: the project id reaches the manifest too, and only where
          # there is one.
          assert f["sub/deep.txt"]["projid"] == 42, f["sub/deep.txt"]
          assert "projid" not in f["hello.txt"], f["hello.txt"]
          # Z-04: a value is in `value` or in `value_hex` and never in
          # both, so no reader can take hex for text. This one is not
          # text — sixteen of its bytes are the planted dnode header —
          # and says so by having no `value` at all.
          assert "value" not in x["user.wide"], x
          assert x["user.wide"]["value_hex"].startswith("41424344"), x
          for entry in f.values():
              for v in entry.get("xattrs", []):
                  assert ("value" in v) != ("value_hex" in v), v
                  assert len(v.get("value_hex", "")) in (0, 2 * v["bytes"]), v
          EOF
          # One path, not the whole tree.
          rm -rf /tmp/zp/one
          ./target/release/zvolfiles -q extract tank/fs /tmp/zp/member0.img -o /tmp/zp/one --path sub
          test -f /tmp/zp/one/sub/deep.txt && test ! -e /tmp/zp/one/hello.txt
          # Z-09: and that path can itself be a name that is not text.
          rm -rf /tmp/zp/latin1
          ./target/release/zvolfiles -q extract tank/fs /tmp/zp/member0.img -o /tmp/zp/latin1 --path "$(printf 'caf\xe9.txt')"
          test "$(cat "$(printf '/tmp/zp/latin1/caf\xe9.txt')")" = "a name is bytes, not text"
          # The text it prints as is not a name any file has.
          if ./target/release/zvolfiles -q extract tank/fs /tmp/zp/member0.img -o /tmp/zp/no --path 'caf.txt'; then echo "must fail"; exit 1; else test $? = 3; fi
          # Z-08: with the root directory ZAP zeroed on every member, the
          # walk cannot work and the objects still come out whole.
          cp /tmp/zp/member0.img /tmp/zp/bad0.img
          cp /tmp/zp/member1.img /tmp/zp/bad1.img
          python3 - <<'EOF'
          for path in ("/tmp/zp/bad0.img", "/tmp/zp/bad1.img"):
              data = bytearray(open(path, "rb").read())
              i = data.find(b"hello.txt")
              assert i > 0, path
              start = (i // 4096) * 4096
              data[start:start + 4096] = b"\x00" * 4096
              open(path, "wb").write(bytes(data))
          EOF
          if ./target/release/zvolfiles -q list tank/fs /tmp/zp/bad0.img /tmp/zp/bad1.img -R; then echo "the walk must fail"; exit 1; else test $? = 4; fi
          rm -rf /tmp/zp/objs
          ./target/release/zvolfiles -q objects tank/fs /tmp/zp/bad0.img /tmp/zp/bad1.img -o /tmp/zp/objs || test $? = 4
          cmp /tmp/zp/out/sub/deep.txt /tmp/zp/objs/objects/000009.bin
          # Z-10: the slot the two-slot dnode owns is not an object of
          # its own. A dump that stepped by one would invent object 13
          # out of that file's extended attribute.
          python3 -c 'import json; o = json.load(open("/tmp/zp/objs/objects.json")); n = [x["object"] for x in o["objects"]]; assert 12 in n and 13 not in n, n'
          # Never a write to the evidence, and never one onto it.
          sha256sum /tmp/zp/member0.img /tmp/zp/member1.img > /tmp/zp.sums
          sha256sum -c /tmp/zp.sums
          if ./target/release/zvolfiles -q extract tank/fs /tmp/zp/member0.img -o /tmp/zp/member0.img; then echo "must refuse"; exit 1; else test $? = 5; fi
      - name: A device is not an image, and the record says which (SPEC F-68)
        run: |
          rm -rf /tmp/f68 && mkdir -p /tmp/f68
          # An image: nothing to warn about, and the record says so.
          ./target/release/zvolrescue -q --evidence-log /tmp/f68/img.jsonl \
            list /tmp/fx/member0.img /tmp/fx/member1.img >/dev/null 2>/tmp/f68/img.err
          test ! -s /tmp/f68/img.err || { echo "an image should say nothing:"; cat /tmp/f68/img.err; exit 1; }
          python3 -c 'import json; r=json.loads(open("/tmp/f68/img.jsonl").read().splitlines()[-1]); k=[i["kind"] for i in r["inputs"]]; assert k == ["file","file"], k'
          # The same member through a read-only loop device: the tool
          # still only reads, and says once that the next tool might not.
          LOOP=$(sudo losetup --show -rf /tmp/fx/member0.img)
          echo "attached $LOOP"
          sudo ./target/release/zvolrescue -q --evidence-log /tmp/f68/dev.jsonl \
            list "$LOOP" >/dev/null 2>/tmp/f68/dev.err || { sudo losetup -d "$LOOP"; cat /tmp/f68/dev.err; exit 1; }
          sudo losetup -d "$LOOP"
          cat /tmp/f68/dev.err
          grep -q "devices, not images" /tmp/f68/dev.err
          sudo python3 -c 'import json; r=json.loads(open("/tmp/f68/dev.jsonl").read().splitlines()[-1]); k=[i["kind"] for i in r["inputs"]]; assert k == ["device"], k'
          # And a report built from that log says so too, so a reader
          # knows the work was done against the evidence itself.
          sudo chmod a+r /tmp/f68/dev.jsonl
          ./target/release/zvolreport -q build /tmp/f68/dev.jsonl -o /tmp/f68/report.json >/dev/null
          python3 -c 'import json; d=json.load(open("/tmp/f68/report.json")); assert any("read as a device" in w for w in d["warnings"]), d["warnings"]; assert d["evidence"][0]["kind"] == "device", d["evidence"]'
      - name: Every ashift, not just the one the fixtures happen to use (SPEC §9)
        run: |
          # ashift sets the stride of every DVA offset and of the RAIDZ
          # column layout, so being wrong about it is the difference
          # between the right sector and a neighbour's. Every other
          # fixture here is built at 12; these are the ends of the range
          # — 9 is a 512-byte disk, 13 an 8 KiB one.
          golden=febfe0108392728dbde89ee63f9f25419a0192ac04420db3ad88b0032a088585
          for topology in mirror raidz2; do
            for a in 9 13; do
              d=/tmp/ax-$topology-$a
              rm -rf "$d"
              cargo run -q -p zfs-read --example mkfixture -- "$d" "$topology" "$a" >/dev/null
              members=$(echo "$d"/member*.img)
              # The label must say what the pool was made with: a
              # fixture read at the wrong ashift that still produced the
              # right image would mean the number is not being used.
              ./target/release/zvolrescue -f json scan $members |
                python3 -c "import json,sys; g=json.load(sys.stdin)['devices'][0]['config']['ashift']; assert g == $a, f'reported ashift {g}, built $a'"
              ./target/release/zvolrescue -q dump tank/vm/disk0 $members --txg 4816229 -o /tmp/ax.img
              echo "$golden  /tmp/ax.img" | sha256sum -c - >/dev/null
              echo "  $topology ashift=$a: image matches"
            done
          done
          # Where ashift bites hardest: RAIDZ parity reconstruction has
          # to walk the columns with the right stride. Two of four
          # members, at 512-byte sectors.
          ./target/release/zvolrescue -q dump tank/vm/disk0 \
            /tmp/ax-raidz2-9/member0.img /tmp/ax-raidz2-9/member1.img \
            --txg 4816229 -o /tmp/ax-degraded.img
          echo "$golden  /tmp/ax-degraded.img" | sha256sum -c -
          rm -rf /tmp/ax-* /tmp/ax.img
      - name: A closed pipe is not a failure
        run: |
          # `zvolcarve list DIR | head -4` closes the pipe while the
          # tool is still writing. Rust turns the EPIPE into a panic —
          # a backtrace and exit 101 — unless the hook is in place, and
          # an operator quitting `less` has done nothing wrong. The
          # carve listing is long enough that head really does close it.
          # No `pipefail`: the pipeline's own status is `head`'s, which
          # is always 0, and the step runs under `bash -e`. With
          # pipefail on, a tool exiting non-zero killed the step at this
          # line — before the `if` below could say which command it was
          # or print the stderr it had just captured to a file. That is
          # how this step failed once and explained nothing.
          for cmd in \
            "./target/release/zvolcarve list /tmp/carve" \
            "./target/release/zvolrescue -f json list /tmp/fx/member0.img /tmp/fx/member1.img" \
            "./target/release/zvoltimeline /tmp/fx/member0.img /tmp/fx/member1.img" \
            "./target/release/zvolfiles list tank/fs /tmp/zp/member0.img -R"; do
            set -- $cmd
            test -x "$1" || { echo "no such binary: $1"; exit 1; }
            $cmd 2>/tmp/pipe-err.txt | head -2 >/dev/null
            code=${PIPESTATUS[0]}
            if [ "$code" != 0 ] || [ -s /tmp/pipe-err.txt ]; then
              echo "FAILED: $cmd"
              echo "  exit $code, stderr follows:"
              sed 's/^/  | /' /tmp/pipe-err.txt
              echo "  (exit 0 with nothing on stderr is what a closed pipe must look like)"
              exit 1
            fi
          done
          # `head -2` is a race: if the tool finishes writing before head
          # exits, no EPIPE happens and the case proves nothing. That is
          # how a tool writing its report into an explicit sink — where a
          # closed pipe arrives as an `Err` and not as a panic — passed
          # here for weeks and then failed once. A reader that leaves at
          # once makes it certain.
          for cmd in \
            "./target/release/zvolcarve list /tmp/carve" \
            "./target/release/zvolrescue -f json list /tmp/fx/member0.img /tmp/fx/member1.img" \
            "./target/release/zvoltimeline /tmp/fx/member0.img /tmp/fx/member1.img" \
            "./target/release/zvoltimeline -f json /tmp/fx/member0.img /tmp/fx/member1.img" \
            "./target/release/zvolfiles list tank/fs /tmp/zp/member0.img -R"; do
            $cmd 2>/tmp/pipe-err.txt | true
            code=${PIPESTATUS[0]}
            if [ "$code" != 0 ] || [ -s /tmp/pipe-err.txt ]; then
              echo "FAILED (reader left at once): $cmd"
              echo "  exit $code, stderr follows:"
              sed 's/^/  | /' /tmp/pipe-err.txt
              exit 1
            fi
          done
          # And a panic that is not a closed pipe still reaches stderr:
          # a missing workspace is an error, not an exit 0.
          if ./target/release/zvolcarve list /tmp/there-is-no-such-workspace; then
            echo "a missing workspace must fail"; exit 1
          fi
      - name: Filesystem signatures, against filesystems really made (SPEC F-43)
        run: |
          # The one place this can be checked against something other
          # than our own opinion: make the filesystems and read them back.
          truncate -s 64M /tmp/sig-ext4.img
          mkfs.ext4 -q -F -L zvoltest /tmp/sig-ext4.img
          truncate -s 16M /tmp/sig-swap.img
          mkswap -L swaptest /tmp/sig-swap.img >/dev/null
          cargo run -q -p zfs-read --example signatures -- /tmp/sig-ext4.img /tmp/sig-swap.img > /tmp/sig.txt
          cat /tmp/sig.txt
          grep -q 'sig-ext4.img: ext2/3/4 at 1024 (67108864 byte(s)) label "zvoltest"' /tmp/sig.txt
          grep -q 'sig-swap.img: swap at 4086 (16777216 byte(s)) label "swaptest"' /tmp/sig.txt
          # A member of a pool is a ZFS label, and empty space is nothing.
          cargo run -q -p zfs-read --example signatures -- /tmp/fx/member0.img | grep -q 'zfs at 16384'
          head -c 1048576 /dev/zero > /tmp/sig-blank.img
          if cargo run -q -p zfs-read --example signatures -- /tmp/sig-blank.img | grep -q 'nothing recognised'; then :; else echo "zeros must be nothing"; exit 1; fi
      - name: End-to-end on a raidz2 fixture (missing and corrupted members)
        run: |
          cargo run -p zfs-read --example mkfixture -- /tmp/rz raidz2 12
          ./target/release/zvolrescue scan /tmp/rz/member0.img /tmp/rz/member1.img /tmp/rz/member2.img /tmp/rz/member3.img
          # All four members: same image as the mirror fixture.
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/rz/member0.img /tmp/rz/member1.img /tmp/rz/member2.img /tmp/rz/member3.img -o /tmp/rz-all.img
          cmp /tmp/disk0.img /tmp/rz-all.img
          # Two members missing: rebuilt from parity.
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/rz/member1.img /tmp/rz/member3.img -o /tmp/rz-2miss.img
          cmp /tmp/disk0.img /tmp/rz-2miss.img
          # One missing and one silently corrupted across the stripe area: found by checksum.
          cp /tmp/rz/member0.img /tmp/rz-bad0.img
          python3 -c 'p="/tmp/rz-bad0.img"; b=bytearray(open(p,"rb").read()); s=4*1024*1024+0x200000//4; b[s:s+(1<<20)]=bytes(x^0xa5 for x in b[s:s+(1<<20)]); open(p,"wb").write(b)'
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/rz-bad0.img /tmp/rz/member1.img /tmp/rz/member3.img -o /tmp/rz-mix.img
          cmp /tmp/disk0.img /tmp/rz-mix.img
          # Three missing: beyond raidz2, exit 3.
          if ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/rz/member2.img -o /tmp/rz-3miss.img; then echo "must fail"; exit 1; else test $? = 3; fi

      - name: A three-way mirror, and a pool of two mirrors (SPEC §9)
        run: |
          # The shapes ztest builds by chance — a mirror `zpool attach`
          # widened, and several top-level vdevs — as fixtures, so they
          # are tried on every push and not when a run happens to make
          # them.
          cargo run -q -p zfs-read --example mkfixture -- /tmp/m3 mirror3 12
          ./target/release/zvolrescue -f json scan /tmp/m3/member0.img /tmp/m3/member1.img /tmp/m3/member2.img | python3 -c 'import json,sys; t=json.load(sys.stdin)["pools"][0]["tops"][0]; assert t["kind"] == "mirror" and len(t["members"]) == 3, t; assert all(m["present"] for m in t["members"]), t'
          # Any one side is a whole copy.
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/m3/member1.img --txg 4816229 -o /tmp/m3-one.img
          cmp /tmp/disk0.img /tmp/m3-one.img
          # The damage-matrix shape: one side's labels gone, another
          # absent, the third describing the pool. The bare side is
          # bound by reading (SPEC F-62) and the volume comes out.
          python3 -c '
          LABEL, PHYS_OFF, PHYS = 256*1024, 16*1024, 112*1024
          b = bytearray(open("/tmp/m3/member0.img", "rb").read())
          aligned = len(b) & ~(LABEL-1)
          for off in (0, LABEL, aligned-2*LABEL, aligned-LABEL):
              b[off+PHYS_OFF:off+PHYS_OFF+PHYS] = b"\0" * PHYS
          open("/tmp/m3/bare0.img", "wb").write(bytes(b))'
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/m3/bare0.img /tmp/m3/member2.img --assume-member /tmp/m3/bare0.img --txg 4816229 -o /tmp/m3-bound.img 2> /tmp/m3-bound.err
          grep -q "read as leaf" /tmp/m3-bound.err
          cmp /tmp/disk0.img /tmp/m3-bound.img
          # Two top-level mirrors: the MOS on mirror-0 (two leaves), the
          # volume's data on mirror-1 (three). A read crosses both.
          cargo run -q -p zfs-read --example mkfixture -- /tmp/st striped 12
          ./target/release/zvolrescue scan /tmp/st/member*.img
          ./target/release/zvolrescue -f json scan /tmp/st/member*.img | python3 -c 'import json,sys; p=json.load(sys.stdin)["pools"][0]; assert p["readable"] and p["missing_tops"] == [], p; t=p["tops"]; assert [x["id"] for x in t] == [0, 1], t; assert [len(x["members"]) for x in t] == [2, 3], t'
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/st/member*.img -o /tmp/st-all.img
          cmp /tmp/disk0.img /tmp/st-all.img
          # One side of each mirror is enough.
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/st/member1.img /tmp/st/member3.img -o /tmp/st-one-each.img
          cmp /tmp/disk0.img /tmp/st-one-each.img
          # mirror-1 gone entirely: nothing describes it, the MOS still
          # lists the volume, and its blocks are refused by the top's
          # name — zeros with the reason, exit 4.
          ./target/release/zvolrescue -f json scan /tmp/st/member0.img /tmp/st/member1.img | python3 -c 'import json,sys; p=json.load(sys.stdin)["pools"][0]; assert p["missing_tops"] == [1] and not p["readable"], p'
          if ./target/release/zvolrescue -f json dump tank/vm/disk0 /tmp/st/member0.img /tmp/st/member1.img -o /tmp/st-no-data.img > /tmp/st-no-data.json; then echo "must exit 4"; exit 1; else test $? = 4; fi
          python3 -c 'import json; v=json.load(open("/tmp/st-no-data.json"))["volumes"][0]; assert v["blocks_zeroed"] == 2, v; assert "unknown top-level vdev 1" in v["bad"][0]["reason"], v["bad"]'

      - name: A member whose labels are gone, bound to the leaf its siblings name (SPEC F-62)
        run: |
          python3 - <<'EOF'
          LABEL, PHYS_OFF, PHYS = 256*1024, 16*1024, 112*1024
          for i in (0, 1):
              b = bytearray(open(f"/tmp/rz/member{i}.img", "rb").read())
              aligned = len(b) & ~(LABEL-1)
              for off in (0, LABEL, aligned-2*LABEL, aligned-LABEL):
                  b[off+PHYS_OFF:off+PHYS_OFF+PHYS] = b"\0" * PHYS
              open(f"/tmp/rz/nolabel{i}.img", "wb").write(bytes(b))
          EOF
          # The siblings' configuration names both leaves as missing.
          ./target/release/zvolrescue -f json scan /tmp/rz/nolabel0.img /tmp/rz/nolabel1.img /tmp/rz/member2.img /tmp/rz/member3.img | python3 -c 'import json,sys; t=json.load(sys.stdin)["pools"][0]["tops"][0]; missing=[m["guid"] for m in t["members"] if m["present"] is None]; assert len(missing) == 2, t; open("/tmp/rz/guids","w").write(" ".join(missing))'
          G0=$(cut -d" " -f1 /tmp/rz/guids); G1=$(cut -d" " -f2 /tmp/rz/guids)
          # Bound correctly, with a third member left out so they must be
          # used: the volume comes back bit-exact.
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/rz/nolabel0.img /tmp/rz/nolabel1.img /tmp/rz/member2.img --assume-member /tmp/rz/nolabel0.img=$G0 --assume-member /tmp/rz/nolabel1.img=$G1 --txg 4816229 -o /tmp/rz-bound.img
          cmp /tmp/disk0.img /tmp/rz-bound.img
          # Swapped: the assertion is wrong, the checksums say so, and
          # nothing is handed back as if it were the volume.
          if ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/rz/nolabel0.img /tmp/rz/nolabel1.img /tmp/rz/member2.img --assume-member /tmp/rz/nolabel0.img=$G1 --assume-member /tmp/rz/nolabel1.img=$G0 --txg 4816229 -o /tmp/rz-swapped.img; then echo "a swapped binding must not succeed"; exit 1; else test $? = 3; fi
          # Without a GUID, when several leaves are missing, the tool
          # works out which one this member is by reading through it —
          # and says so plainly when the evidence does not choose.
          python3 - <<'EOF'
          LABEL, PHYS_OFF, PHYS = 256*1024, 16*1024, 112*1024
          b = bytearray(open("/tmp/fx/member0.img", "rb").read())
          aligned = len(b) & ~(LABEL-1)
          for off in (0, LABEL, aligned-2*LABEL, aligned-LABEL):
              b[off+PHYS_OFF:off+PHYS_OFF+PHYS] = b"\0" * PHYS
          open("/tmp/fx/nolabel0.img", "wb").write(bytes(b))
          EOF
          # A mirror leaf: its sibling is withheld for the trial, so the
          # walk leans on it entirely and the answer is not a guess.
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/fx/nolabel0.img /tmp/fx/member1.img --assume-member /tmp/fx/nolabel0.img --txg 4816229 -o /tmp/fx-bound.img
          cmp /tmp/disk0.img /tmp/fx-bound.img
          # A device that is not this pool's data reads as no leaf at all.
          python3 -c 'b=bytearray(open("/tmp/fx/nolabel0.img","rb").read()); s=4*1024*1024; b[s:]=bytes(x^0xa5 for x in b[s:]); open("/tmp/fx/garbage.img","wb").write(bytes(b))'
          if ./target/release/zvolrescue -q list /tmp/fx/garbage.img /tmp/fx/member1.img --assume-member /tmp/fx/garbage.img; then echo "garbage must not bind"; exit 1; else test $? = 1; fi
          # Refusals: not a member of this run, and no leaf is missing.
          if ./target/release/zvolrescue -q list /tmp/rz/member2.img /tmp/rz/member3.img --assume-member /tmp/elsewhere.img; then exit 1; else test $? = 1; fi
          if ./target/release/zvolrescue -q list /tmp/fx/member0.img /tmp/fx/member1.img --assume-member /tmp/fx/member0.img; then exit 1; else test $? = 1; fi

      - name: A bare member is named by its own disk, and the pool says which leaf that is (SPEC F-71)
        run: |
          # The labels of member1 are gone; its disk still carries the
          # GPT label the pool recorded it under, /dev/gpt/tank-d1. The
          # scan lists the disk's names, ties the vacant leaf to the disk
          # that carries its path, and spells out the binding.
          python3 - <<'EOF'
          import struct
          LABEL, PHYS_OFF, PHYS = 256*1024, 16*1024, 112*1024
          member = bytearray(open("/tmp/fx/member1.img", "rb").read())
          aligned = len(member) & ~(LABEL-1)
          for off in (0, LABEL, aligned-2*LABEL, aligned-LABEL):
              member[off+PHYS_OFF:off+PHYS_OFF+PHYS] = b"\0" * PHYS
          sector, start_lba = 512, 2048
          disk = bytearray(sector * (start_lba + len(member)//sector + 64))
          disk[510], disk[511] = 0x55, 0xAA
          disk[446+4] = 0xee
          struct.pack_into("<I", disk, 446+12, 0xffffffff)
          disk[sector:sector+8] = b"EFI PART"
          struct.pack_into("<I", disk, sector+80, 1)
          struct.pack_into("<I", disk, sector+84, 128)
          e = bytearray(128)
          e[0:16] = bytes.fromhex("ba7c6e51cf6ed6118ff800022d09712b")   # freebsd-zfs
          e[16:32] = bytes.fromhex("d1d1d1d1d1d1d1d1d1d1d1d1d1d1d1d1")
          struct.pack_into("<QQ", e, 32, start_lba, start_lba + len(member)//sector - 1)
          n = "tank-d1".encode("utf-16-le"); e[56:56+len(n)] = n
          disk[sector*2:sector*2+128] = e
          disk[start_lba*sector:start_lba*sector+len(member)] = member
          open("/tmp/fx/disk1.img", "wb").write(bytes(disk))
          # And a glabel'd copy of member0: the metadata in the last
          # sector, the provider ZFS saw ending right before it.
          m0 = open("/tmp/fx/member0.img", "rb").read()
          tail = bytearray(512); tail[0:11] = b"GEOM::LABEL"
          struct.pack_into("<I", tail, 16, 2); tail[20:27] = b"tank-d0"
          struct.pack_into("<Q", tail, 36, len(m0) + 512)   # the provider, sector included
          open("/tmp/fx/label0.img", "wb").write(m0 + bytes(tail))
          EOF
          ./target/release/zvolrescue scan /tmp/fx/member0.img /tmp/fx/disk1.img
          ./target/release/zvolrescue -f json scan /tmp/fx/member0.img /tmp/fx/disk1.img | python3 -c '
          import json,sys
          d = json.load(sys.stdin)
          disk = d["devices"][1]
          assert disk.get("config") is None, disk
          p = disk["partitions"]["partitions"][0]
          assert p["name"] == "tank-d1" and p["guid"] == "d1d1d1d1-d1d1-d1d1-d1d1-d1d1d1d1d1d1", p
          assert "/dev/gpt/tank-d1" in disk["names"] and "/dev/gptid/d1d1d1d1-d1d1-d1d1-d1d1-d1d1d1d1d1d1" in disk["names"], disk["names"]
          m = d["pools"][0]["tops"][0]["members"]
          assert m[0]["present"] and m[1]["present"] is None, m
          assert m[1]["named_by"] == "/tmp/fx/disk1.img", m
          assert "name_hints" not in d["pools"][0], d["pools"][0]
          open("/tmp/fx/named-guid", "w").write(m[1]["guid"])'
          ./target/release/zvolrescue -q scan /tmp/fx/member0.img /tmp/fx/disk1.img | grep -q "MISSING; /tmp/fx/disk1.img is named /dev/gpt/tank-d1 on its own disk (SPEC F-71)"
          # The binding it spelled out reads.
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/fx/member0.img /tmp/fx/disk1.img --assume-member /tmp/fx/disk1.img=$(cat /tmp/fx/named-guid) --txg 4816229 -o /tmp/fx/named.img
          cmp /tmp/disk0.img /tmp/fx/named.img
          # glabel: the name, the provider size, all four labels, and
          # the volume — from a member the plain size would misread.
          ./target/release/zvolrescue -f json scan /tmp/fx/label0.img | python3 -c '
          import json,sys
          d = json.load(sys.stdin)["devices"][0]
          assert d["geom"]["class"] == "label" and d["geom"]["name"] == "tank-d0", d["geom"]
          assert d["geom"]["provsize"] == d["size"], d
          assert d["names"] == ["/dev/label/tank-d0"], d["names"]
          assert sum(1 for l in d["labels"] if l["config_checksum"] == "ok") == 4, d["labels"]'
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/fx/label0.img --txg 4816229 -o /tmp/fx/labelled.img
          cmp /tmp/disk0.img /tmp/fx/labelled.img
          # A disk with nothing on it but geli metadata says so.
          python3 -c 'b=bytearray(8<<20); b[-512:-503]=b"GEOM::ELI"; b[-496:-492]=(7).to_bytes(4,"little"); open("/tmp/fx/eli.img","wb").write(bytes(b))'
          ./target/release/zvolrescue -q scan /tmp/fx/eli.img | grep -q "GEOM::ELI v7 in the last sector; the member is geli-encrypted"

      - name: An image with its ddrescue map (SPEC F-72)
        run: |
          # The map says two sectors of the volume's first data block and
          # the whole of label L1 were never read. Read through the map,
          # the block is kept less those sectors and the reason names the
          # imager; the mirror's other side heals it; scan reports what
          # the map touches.
          python3 - <<'EOF'
          SIZE = 64*1024*1024
          LABEL = 256*1024
          bad = 4*1024*1024 + 0x200000 + 4096 + 2048
          lines = ["# Mapfile. Created by GNU ddrescue version 1.27",
                   "# current_pos  current_status  current_pass",
                   f"{SIZE:#x}  +  1",
                   "#      pos        size  status",
                   f"0x0  {LABEL:#x}  +",
                   f"{LABEL:#x}  {LABEL:#x}  -",
                   f"{2*LABEL:#x}  {bad-2*LABEL:#x}  +",
                   f"{bad:#x}  0x400  -",
                   f"{bad+0x400:#x}  {SIZE-bad-0x400:#x}  +"]
          open("/tmp/fx/member0.map", "w").write("\n".join(lines) + "\n")
          EOF
          ./target/release/zvolrescue scan /tmp/fx/member0.img --map /tmp/fx/member0.img=/tmp/fx/member0.map
          ./target/release/zvolrescue -f json scan /tmp/fx/member0.img --map /tmp/fx/member0.img=/tmp/fx/member0.map | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"][0]; assert d["map"]["unreadable_bytes"] == 0x40400, d["map"]; assert d["map"]["labels_touched"] == [1], d["map"]; assert d["labels"][1]["config_checksum"] == "missing", d["labels"][1]'
          if ./target/release/zvolrescue -f json dump tank/vm/disk0 /tmp/fx/member0.img --map /tmp/fx/member0.img=/tmp/fx/member0.map --txg 4816229 -o /tmp/fx/mapped.img --evidence-log /tmp/fx/map-ev.jsonl > /tmp/fx/mapped.json; then echo "must exit 4"; exit 1; else test $? = 4; fi
          python3 -c '
          import json
          v = json.load(open("/tmp/fx/mapped.json"))["volumes"][0]
          assert v["blocks_salvaged"] == 1 and v["blocks_zeroed"] == 0, v
          assert (v["bad"][0]["offset"], v["bad"][0]["len"]) == (2048, 1024), v["bad"]
          assert "imager could not read (ddrescue map)" in v["bad"][0]["reason"], v["bad"]
          want = bytearray(open("/tmp/disk0.img", "rb").read()); want[2048:3072] = b"\0" * 1024
          assert open("/tmp/fx/mapped.img", "rb").read() == bytes(want)
          ev = json.loads(open("/tmp/fx/map-ev.jsonl").readlines()[-1])
          assert any(i["path"].endswith("member0.map") for i in ev["inputs"]), ev["inputs"]'
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/fx/member0.img /tmp/fx/member1.img --map /tmp/fx/member0.img=/tmp/fx/member0.map --txg 4816229 -o /tmp/fx/map-healed.img
          cmp /tmp/disk0.img /tmp/fx/map-healed.img
      - name: A device that refuses a read stops the run (SPEC F-33, N-10)
        run: |
          # A real block device with a real refusal: a mirror member on a
          # loop device, with the eight sectors of the volume's first data
          # block mapped to device-mapper's error target. Without leave
          # the first refused read stops the run with exit 7, names the
          # device and the LBA, and the evidence record carries the
          # incident. With --device-may-fail the mirror heals the block
          # from its other side, the image is the reference, and no
          # address on the device is read twice — strace shows every
          # read of it, and none overlaps another. Carving refuses the
          # device outright; a plain scan reads its four labels and no
          # more.
          sudo apt-get install -y -qq --no-install-recommends dmsetup strace
          rm -rf /tmp/dm && cargo run -q -p zfs-read --example mkfixture -- /tmp/dm mirror 12
          ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/dm/member0.img /tmp/dm/member1.img --txg 4816229 -o /tmp/dm/ref.img
          loop=$(sudo losetup --find --show /tmp/dm/member0.img)
          size=$(sudo blockdev --getsz "$loop")
          # Block 0 of the volume: 4 MiB of front labels + 0x201000 = sector 12296.
          bad=12296
          printf '0 %s linear %s 0\n%s 8 error\n%s %s linear %s %s\n' "$bad" "$loop" "$bad" "$((bad+8))" "$((size-bad-8))" "$loop" "$((bad+8))" | sudo dmsetup create zr-bad
          dev=/dev/mapper/zr-bad
          # strace -y prints the path the fd resolves to, which for a
          # device-mapper node is /dev/dm-N, not the /dev/mapper name.
          real=$(readlink -f "$dev")
          set +e
          sudo ./target/release/zvolrescue -q dump tank/vm/disk0 "$dev" /tmp/dm/member1.img --txg 4816229 -o /tmp/dm/stop.img --evidence-log /tmp/dm/ev.jsonl 2>/tmp/dm/stop.err; code=$?
          set -e
          cat /tmp/dm/stop.err
          test "$code" = 7
          grep -q "MEDIUM INCIDENT: $dev refused 8192 byte(s) at byte $((bad*512)) (LBA $bad, 16 sector(s) of 512): Input/output error" /tmp/dm/stop.err
          grep -q "stopped here" /tmp/dm/stop.err
          grep -q "image it with a tool made for failing media" /tmp/dm/stop.err
          sudo python3 - <<'EOF'
          import json
          r = json.loads(open("/tmp/dm/ev.jsonl").readlines()[-1])
          assert r["status"] == 7, r["status"]
          i = r["incidents"]
          assert len(i) == 1 and i[0]["stopped"] and i[0]["lba"] == 12296 and i[0]["sectors"] == 16 and i[0]["path"] == "/dev/mapper/zr-bad", i
          assert [x["kind"] for x in r["inputs"]] == ["device", "file"], r["inputs"]
          v = r["result"]["volumes"][0]
          assert v["aborted"] and v["stopped_by_medium"].startswith("medium refused a read, stopping: /dev/mapper/zr-bad"), v
          assert v["blocks_salvaged"] == 0 and v["blocks_read"] == 0, v
          EOF
          # --device-may-fail: the mirror heals, the image is whole, the incident is on record — and no address was read twice.
          sudo strace -f -y -e trace=pread64 -o /tmp/dm/trace.txt ./target/release/zvolrescue -q dump tank/vm/disk0 "$dev" /tmp/dm/member1.img --txg 4816229 -o /tmp/dm/healed.img --device-may-fail --evidence-log /tmp/dm/ev.jsonl 2>/tmp/dm/heal.err
          cat /tmp/dm/heal.err
          cmp /tmp/dm/healed.img /tmp/dm/ref.img
          grep -q "skipped (--device-may-fail)" /tmp/dm/heal.err
          sudo REAL="$real" python3 - <<'EOF'
          import json, os, re
          r = json.loads(open("/tmp/dm/ev.jsonl").readlines()[-1])
          assert r["status"] == 0 and len(r["incidents"]) == 1 and not r["incidents"][0]["stopped"], r
          reads = []
          pat = re.compile(r'pread64\(\d+<(?:/dev/mapper/zr-bad|' + re.escape(os.environ["REAL"]) + r')>, .*, (\d+), (\d+)\) = ')
          for line in open("/tmp/dm/trace.txt"):
              m = pat.search(line)
              if m:
                  reads.append((int(m.group(2)), int(m.group(1))))
          assert reads, "no read of the device seen"
          reads.sort()
          overlapping = [(a, b) for a, b in zip(reads, reads[1:]) if b[0] < a[0] + a[1]]
          assert not overlapping, f"an address on the device was read twice: {overlapping}"
          assert any(o <= 12296 * 512 < o + n for o, n in reads), "the refused block was asked for once"
          print(f"{len(reads)} reads of the device, none overlapping")
          EOF
          # A scan reads the four labels and nothing else; carving refuses the device before opening it.
          sudo strace -f -y -e trace=pread64 -o /tmp/dm/scan.txt ./target/release/zvolrescue -q scan "$dev" | grep -q 'pool "tank"'
          test "$(grep -c -e "<$real>" -e '</dev/mapper/zr-bad>' /tmp/dm/scan.txt)" = 4
          # A healthy device asked for its zero point is refused the
          # search and says so, with exit 5 — even though its labels
          # verify and the pool is reported (SPEC N-10: a surface is
          # never scanned on a device without leave). The decision is
          # deliberate: the operator asked for a surface search and did
          # not get one, and a script must be told. strace shows the
          # refusal came before any read past the labels.
          set +e; sudo strace -f -y -e trace=pread64 -o /tmp/dm/zp.txt ./target/release/zvolrescue -q -f json scan "$dev" /tmp/dm/member1.img --zero-point >/tmp/dm/zp.json 2>/tmp/dm/zp.err; code=$?; set -e
          test "$code" = 5
          test "$(grep -c -e "<$real>" -e '</dev/mapper/zr-bad>' /tmp/dm/zp.txt)" = 4
          sudo python3 - <<'EOF'
          import json
          d = json.load(open("/tmp/dm/zp.json"))
          dev, img = d["devices"]
          assert dev["surface_scan_refused"] is True and dev.get("zero_point", []) == [], dev
          assert img.get("surface_scan_refused") in (None, False) and len(img.get("zero_point", [])) == 1, img
          assert [p["name"] for p in d["pools"]] == ["tank"], d["pools"]
          EOF
          sudo ./target/release/zvolrescue -q scan "$dev" /tmp/dm/member1.img --zero-point 2>/dev/null | grep -q "zero point: not searched" || { echo "the text form does not say the search was refused"; exit 1; }
          set +e; sudo ./target/release/zvolcarve scan "$dev" -o /tmp/dm/carve 2>/tmp/dm/carve.err; code=$?; set -e
          test "$code" = 5 && grep -q "a block device is not scanned (SPEC N-10)" /tmp/dm/carve.err
          # With leave, the carve runs — and stops at the error target with exit 7, the incident on record.
          set +e; sudo ./target/release/zvolcarve scan "$dev" -o /tmp/dm/carve --surface-scan-on-device --evidence-log /tmp/dm/ev.jsonl 2>/tmp/dm/carve2.err; code=$?; set -e
          cat /tmp/dm/carve2.err | tail -3
          test "$code" = 7
          sudo dmsetup remove zr-bad
          # The refusal on the way to the dataset, not on a data block:
          # the eight sectors of the MOS objset itself. Before this was
          # tested, a single-volume dump and a list returned early from
          # "cannot read the pool" with exit 3, printed no incident and
          # wrote no evidence record — the ledger had the incident and
          # nobody read it; only a bulk -r run reached the report. Now
          # every early failure ends the way every run ends: exit 7,
          # the incident on stderr and in the record. The MOS block's
          # address comes from the reader's own trace, so this keeps
          # pointing at it if the fixture's layout moves.
          off=$(./target/release/zvolrescue --debug -q list /tmp/dm/member0.img /tmp/dm/member1.img --txg 4816229 2>&1 >/dev/null | sed -n 's/.*open MOS at txg 4816229:.*dva0 vdev 0 off \(0x[0-9a-f]*\).*/\1/p' | head -1)
          test -n "$off"
          mos=$(( (0x400000 + off) / 512 ))
          echo "MOS objset at txg 4816229: DVA $off, sector $mos"
          printf '0 %s linear %s 0\n%s 8 error\n%s %s linear %s %s\n' "$mos" "$loop" "$mos" "$((mos+8))" "$((size-mos-8))" "$loop" "$((mos+8))" | sudo dmsetup create zr-bad
          for cmd in "dump tank/vm/disk0 $dev /tmp/dm/member1.img --txg 4816229 -o /tmp/dm/mos.img" "list $dev /tmp/dm/member1.img --txg 4816229"; do
            set +e; sudo ./target/release/zvolrescue -q $cmd --evidence-log /tmp/dm/ev.jsonl >/tmp/dm/mos.out 2>/tmp/dm/mos.err; code=$?; set -e
            cat /tmp/dm/mos.err
            test "$code" = 7
            grep -q "cannot read the pool at txg 4816229" /tmp/dm/mos.err
            grep -q "MEDIUM INCIDENT: $dev refused 4096 byte(s) at byte $((mos*512)) (LBA $mos, 8 sector(s) of 512): Input/output error" /tmp/dm/mos.err
            grep -q "stopped here" /tmp/dm/mos.err
            sudo MOS="$mos" python3 - <<'EOF'
          import json, os
          r = json.loads(open("/tmp/dm/ev.jsonl").readlines()[-1])
          assert r["status"] == 7, r["status"]
          i = r["incidents"]
          assert len(i) == 1 and i[0]["stopped"] and i[0]["lba"] == int(os.environ["MOS"]) and i[0]["sectors"] == 8, i
          assert r["result"].get("volumes", []) == [] and r["result"].get("datasets", []) == [], r["result"]
          EOF
          done
          sudo dmsetup remove zr-bad
          # A device closed by its first refusal is not read again by
          # anyone: the eight sectors of label 0 on the error target.
          # The label read is the first thing a scan asks of a member,
          # and it is refused — and a scan then goes on to probe the
          # partition table and the GEOM sector of the same device
          # directly, around the pool reader. The io layer refuses
          # those too now: strace shows exactly one read of the device,
          # and the run ends with exit 7 and the incident.
          printf '0 8 error\n8 %s linear %s 8\n' "$((size-8))" "$loop" | sudo dmsetup create zr-bad
          set +e; sudo strace -f -y -e trace=pread64 -o /tmp/dm/closed.txt ./target/release/zvolrescue -q -f json scan "$dev" /tmp/dm/member1.img >/tmp/dm/closed.out 2>/tmp/dm/closed.err; code=$?; set -e
          cat /tmp/dm/closed.err
          test "$code" = 7
          grep -q "MEDIUM INCIDENT: $dev refused .* at byte 0 (LBA 0, " /tmp/dm/closed.err
          grep -q "stopped here" /tmp/dm/closed.err
          test "$(grep -c -e "<$real>" -e '</dev/mapper/zr-bad>' /tmp/dm/closed.txt)" = 1
          # The report says what happened and no more: the refused
          # device with its incident and no labels, and no further
          # member opened after the stop (SPEC F-33: the first refused
          # read stops the run — the devices after it are not touched).
          sudo python3 - <<'EOF'
          import json
          d = json.load(open("/tmp/dm/closed.out"))
          assert len(d["devices"]) == 1, d["devices"]
          dev = d["devices"][0]
          assert dev["labels"] == [] and dev["surface_scan_refused"] is True, dev
          assert "medium refused a read, stopping" in dev["error"] and "(LBA 0, " in dev["error"], dev["error"]
          EOF
          # Every tool ends the run the same way when the members do not
          # open: exit 7, the incident on stderr, and a record in the
          # evidence log that says nothing was produced. zvolfiles and
          # zvoltimeline used to return the bare code with no record.
          for cmd in "./target/release/zvolfiles list tank/fs $dev /tmp/dm/member1.img" "./target/release/zvoltimeline $dev /tmp/dm/member1.img"; do
            set +e; sudo $cmd --evidence-log /tmp/dm/ev.jsonl >/tmp/dm/early.out 2>/tmp/dm/early.err; code=$?; set -e
            cat /tmp/dm/early.err
            test "$code" = 7
            grep -q "MEDIUM INCIDENT: $dev refused .* at byte 0 (LBA 0, " /tmp/dm/early.err
            test "$(grep -c 'MEDIUM INCIDENT' /tmp/dm/early.err)" = 1
            sudo python3 - <<'EOF'
          import json
          r = json.loads(open("/tmp/dm/ev.jsonl").readlines()[-1])
          assert r["status"] == 7, r["status"]
          assert r["incidents"] and r["incidents"][0]["stopped"] and r["incidents"][0]["lba"] == 0, r["incidents"]
          assert r["result"]["produced"] is False, r["result"]
          EOF
          done
          sudo dmsetup remove zr-bad
          sudo losetup -d "$loop"
      - name: Memory and throughput on dense volumes (SPEC N-03, N-08)
        run: |
          # Six dense 512 MiB volumes — mirror and raidz2, compression
          # off, lz4 and gzip — extracted and checked against the SHA-256
          # the generator computed. The peak resident set of each run
          # must stay under N-03's 512 MiB, and the rate above a floor;
          # the rate against a plain copy is printed for the record (the
          # N-08 ratios are against a disk's read rate, which a warm page
          # cache is not — see tests/bench.sh).
          cargo build --release -p zfs-read --examples
          tests/bench.sh ./target/release/zvolrescue ./target/release/examples/mkfixture /tmp/bench 512 | tee /tmp/bench.md
          rm -rf /tmp/bench
      - name: The same inputs give the same bytes, twice (SPEC N-05)
        run: |
          # Reproducibility, checked rather than asserted: the same
          # members, the same arguments, twice — the images are
          # identical, and so are the JSON documents of scan, list and
          # dump once the two fields that are meant to vary (`seconds`,
          # `peak_rss_kib`) are set aside. The evidence record's own
          # timestamp is the other designated field.
          rm -rf /tmp/repro && ./target/release/examples/mkfixture /tmp/repro bench 12 32 lz4 > /dev/null
          m="/tmp/repro/member0.img /tmp/repro/member1.img"
          for i in 1 2; do
            ./target/release/zvolrescue -q -f json dump tank/vm/disk0 $m -o /tmp/repro/out.img > /tmp/repro/dump$i.json
            cp /tmp/repro/out.img /tmp/repro/out$i.img
            ./target/release/zvolrescue -f json scan $m > /tmp/repro/scan$i.json
            ./target/release/zvolrescue -f json list $m > /tmp/repro/list$i.json
          done
          cmp /tmp/repro/out1.img /tmp/repro/out2.img
          cmp /tmp/repro/scan1.json /tmp/repro/scan2.json
          cmp /tmp/repro/list1.json /tmp/repro/list2.json
          python3 - <<'EOF'
          import json
          a, b = (json.load(open(f"/tmp/repro/dump{i}.json")) for i in (1, 2))
          for x in (a, b):
              x.pop("peak_rss_kib", None)
              for v in x["volumes"]:
                  v.pop("seconds", None)
          assert a == b, "two dumps of the same volume differ beyond seconds and peak_rss_kib"
          EOF
          rm -rf /tmp/repro
      - name: The zstd decoder against libzstd, on the same blocks (SPEC §12 Q3, D-8)
        run: |
          # A fixture volume's bytes in 128 KiB blocks, compressed by
          # the zstd command, decoded through the reader's own decoder
          # and checked against the originals; libzstd's own benchmark
          # on the same bytes. Nothing but correctness is enforced —
          # the table is the record behind D-8.
          zstd --version
          cargo build --release -p zfs-ondisk --example zstd-bench
          tests/zstd-bench.sh ./target/release/zvolrescue ./target/release/examples/mkfixture ./target/release/examples/zstd-bench /tmp/zstd 64 3 | tee /tmp/zstd.md

  fuzz:
    name: Fuzz the parsers (bounded, every push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Every target, 30 seconds each, from the committed seeds (SPEC §9)
        run: |
          # The parsers of zfs-ondisk on hostile input: a nvlist, a block
          # pointer, a dnode, a ZAP, an uberblock, every bonus buffer,
          # every decompressor, a partition table. Each starts from one
          # well-formed instance (fuzz/seeds, written by the example
          # `fuzz-seeds` and read back by the parser it feeds) and runs
          # under the address sanitizer for a bounded time; a panic, an
          # abort or a run past the time limit on one input fails the
          # job with that input saved under fuzz/artifacts.
          cargo fuzz build
          fail=0
          for t in $(cargo fuzz list); do
            echo "== $t"
            mkdir -p "fuzz/corpus/$t"
            if ! cargo fuzz run "$t" "fuzz/corpus/$t" "fuzz/seeds/$t" -- -max_total_time=30 -timeout=10 2>&1 | tail -20; then
              fail=1
            fi
          done
          exit $fail
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  miri:
    name: Miri on the zfs-ondisk unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Every unit test of the on-disk parsers, interpreted (SPEC §9)
        run: |
          # The workspace forbids unsafe code, so what Miri catches here
          # is in the dependencies the parsers lean on and in the
          # standard library's contract as the tests use it: an
          # uninitialised read, an aliasing violation, an out-of-bounds
          # access that the native build happened to survive. A handful
          # of tests that loop over megabytes of pure arithmetic run a
          # tenth of their volume under Miri, and one that hashes
          # 112 KiB three times is skipped there; each says so beside
          # its loop. The whole crate takes a few minutes.
          cargo miri setup
          cargo miri test -p zfs-ondisk --lib

  crosscheck:
    name: Cross-check against OpenZFS userland (ztest + zdb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends zfsutils-linux zfs-test
      - run: cargo build --release && cargo build --release -p zfs-read --examples
      - run: tests/crosscheck-ztest.sh ./target/release/zvolrescue /tmp/crosscheck ./target/release/examples/walk-objects ./target/release/examples/unwrap-key ./target/release/zvoltimeline ./target/release/examples/space

  # The damage matrix found two real defects in the tool during one
  # afternoon and then ran only when someone remembered to run it. This
  # is a subset — one geometry, ten manifests, about five minutes — kept
  # small enough to sit in every push. The full matrix over three
  # geometries stays a manual run.
  matrix:
    name: Damage matrix (one geometry, pinned subset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: click0/zvolrescue-testdata
          path: testdata
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends zfsutils-linux zfs-test zstd
      - run: cargo build --release && cargo build --release -p zfs-read --examples
      - name: Build one pool of the interim golden image
        run: POOLS=mirror RUN_TIME=20 sh tests/golden/build-ztest-image.sh /tmp/golden
      - name: Ten manifests — no defect, and nothing written to the evidence
        run: |
          rc=0
          python3 tests/golden/run-matrix.py \
            --image /tmp/golden/pools/mirror --oracle /tmp/golden/oracle/mirror \
            --manifests testdata/manifests --out /tmp/golden/report --label mirror \
            --tmp /tmp --only \
              labels-all-four \
              labels-bit-flips-all-four \
              data-one-member \
              data-zeros-two-members-same-range \
              member-missing-one \
              metadata-mos-one-copy \
              metadata-objset-one-copy \
              partition-start-shifted \
              combo-vdev-phys-gone-and-member-missing \
              combo-labels-plus-data || rc=$?
          # `run-matrix.py` exits 1 on a `defect`, and under `bash -e`
          # that killed this step before the block below printed a word
          # about which case defected or why. A check that fails without
          # saying why is the one thing this job exists to prevent, so
          # its exit is captured and judged below with everything else.
          echo "run-matrix.py exit ${rc:-0}"
          # What this job may assert, and what it may not.
          #
          # It builds its own pool with `ztest` on every push, and a
          # freshly built ztest pool is a different experiment each time:
          # ztest attaches and detaches devices as it runs, so the
          # "mirror" comes out two, three or four leaves wide; it removes
          # vdevs, leaving an `indirect` top behind; and it makes datasets
          # with `checksum=off`, where damage is undetectable by
          # construction. A manifest's expected outcome states what ZFS
          # redundancy guarantees — two copies gone means refused, one
          # copy gone means recovered — and that cannot be judged against
          # a pool whose redundancy was chosen at random. An earlier
          # version of this step demanded ten passes and got three
          # different answers from three identical commits.
          #
          # So the redundancy verdicts are printed and not enforced here;
          # they are enforced by the full matrix, which runs against the
          # published image whose layout is known and recorded. What is
          # true whatever shape the pool came out is enforced: the tool
          # never produced a failure the harness cannot account for
          # (`defect`), and it never wrote to the evidence it was reading.
          python3 - <<'EOF'
          import json
          want = 10
          rs = json.load(open("/tmp/golden/report/report-mirror.json"))
          assert len(rs) == want, f"ran {len(rs)} of {want} manifests: {[r['id'] for r in rs]}"
          for r in rs:
              print(f"{r['verdict']:10} {r['id']:42} expected {r['expected']}, actual {r['actual']}")
              if r["verdict"] != "pass":
                  for n in r.get("notes", []):
                      print(f"    {n}")
                  for k, v in (r.get("outcomes") or {}).items():
                      if v != "ok":
                          print(f"    {k}: {v}")
          defects = [r["id"] for r in rs if r["actual"] == "defect"]
          assert not defects, f"the tool failed in a way the harness cannot account for: {defects}"
          # `is False`, not falsy: a case that never ran has no answer to
          # give, and absent is not the same as "it wrote".
          wrote = [r["id"] for r in rs if r.get("inputs_unchanged") is False]
          assert not wrote, f"a run modified its own evidence: {wrote}"
          print(f"{want} manifests: no defect, every damaged copy unchanged after the run")
          EOF
          # Belt as well as braces: the script's own exit is honoured
          # after the report has had its say, never instead of it.
          test "${rc:-0}" = 0 || { echo "::error::run-matrix.py exited ${rc}"; exit 1; }
      # The report is the only place the reasons are written down, and a
      # failing run is exactly when they are wanted.
      - name: The report, whatever the verdict was
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: damage-matrix-mirror
          path: /tmp/golden/report
          if-no-files-found: warn

  # 15.x is the first-class target (N-06): this one blocks.
  freebsd:
    name: FreeBSD 15 (ports rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/freebsd-vm@v1
        with:
          # The newest 15.x the action ships, so a point release does not
          # need this file edited — and a release that does not exist
          # fails the job rather than quietly falling back to another.
          release: "15"
          usesh: true
          prepare: pkg install -y rust
          run: |
            cargo test --all-targets
            # The release builds the FreeBSD binaries static (crt-static);
            # so does this job, so a crate that will not link that way
            # fails here, on the push, and not at release time — and
            # everything below runs the static binary on real devices.
            RUSTFLAGS="-C target-feature=+crt-static" cargo build --release
            ./target/release/zvolrescue --version
            file ./target/release/zvolrescue
            file ./target/release/zvolrescue | grep -Eq 'statically linked|static-pie linked'
            # SPEC F-71 against the real tools: gpart names a partition,
            # glabel names a provider, and the scan reads both names
            # back off the disk — with the GUID gpart itself reports.
            cargo run -q -p zfs-read --example mkfixture -- /tmp/fx mirror 12
            truncate -s 80m /tmp/fx/disk1.img
            md=$(mdconfig -a -t vnode -f /tmp/fx/disk1.img)
            gpart create -s gpt "$md"
            gpart add -t freebsd-zfs -l tank-d1 -b 2048 -s 131072 "$md"
            dd if=/tmp/fx/member1.img of=/dev/gpt/tank-d1 bs=1m status=none
            # Its own labels gone: L0, L1, and the rear pair of a 64 MiB vdev.
            for kb in 16 272 65040 65296; do dd if=/dev/zero of=/dev/gpt/tank-d1 bs=1k seek=$kb count=112 conv=notrunc status=none; done
            rawuuid=$(gpart list "$md" | awk '/rawuuid/ { print $2; exit }')
            mdconfig -d -u "${md#md}"
            ./target/release/zvolrescue scan /tmp/fx/member0.img /tmp/fx/disk1.img
            ./target/release/zvolrescue -q scan /tmp/fx/member0.img /tmp/fx/disk1.img | grep -q "\"tank-d1\"  gptid $rawuuid"
            ./target/release/zvolrescue -q scan /tmp/fx/member0.img /tmp/fx/disk1.img | grep -q "named: /dev/gpt/tank-d1  /dev/disk/by-partlabel/tank-d1  /dev/gptid/$rawuuid"
            ./target/release/zvolrescue -q scan /tmp/fx/member0.img /tmp/fx/disk1.img | grep -q "MISSING; /tmp/fx/disk1.img is named /dev/gpt/tank-d1 on its own disk (SPEC F-71)"
            # glabel on a provider one sector longer than the member, the
            # member written through the label device it offers.
            truncate -s 67109376 /tmp/fx/label0.img
            md=$(mdconfig -a -t vnode -f /tmp/fx/label0.img)
            glabel label -v tank-d0 "/dev/$md"
            dd if=/tmp/fx/member0.img of=/dev/label/tank-d0 bs=1m status=none
            glabel stop tank-d0
            mdconfig -d -u "${md#md}"
            # The sector as glabel wrote it, for the log: what the tool
            # parses is compared against this, not against a header.
            tail -c 512 /tmp/fx/label0.img | hexdump -C | head -4
            ./target/release/zvolrescue scan /tmp/fx/label0.img
            ./target/release/zvolrescue -q scan /tmp/fx/label0.img | grep -q "GEOM::LABEL v2 in the last sector: this was /dev/label/tank-d0, provider 67109376 bytes"
            ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/fx/member0.img --txg 4816229 -o /tmp/fx/plain.img
            ./target/release/zvolrescue -q dump tank/vm/disk0 /tmp/fx/label0.img --txg 4816229 -o /tmp/fx/labelled.img
            cmp /tmp/fx/plain.img /tmp/fx/labelled.img
            # SPEC F-33, N-10 on a real FreeBSD device: gnop makes every
            # read of the member fail with EIO, so the very first read —
            # a label — is the incident, and the run stops there with
            # exit 7 and the LBA, before anything else is asked of it.
            md=$(mdconfig -a -t vnode -f /tmp/fx/member0.img)
            gnop create -e 5 -r 100 "/dev/$md"
            set +e
            ./target/release/zvolrescue -q dump tank/vm/disk0 "/dev/$md.nop" /tmp/fx/member1.img --txg 4816229 -o /tmp/fx/nop.img 2>/tmp/fx/nop.err; code=$?
            set -e
            cat /tmp/fx/nop.err
            test "$code" = 7
            grep -q "MEDIUM INCIDENT: /dev/$md.nop refused" /tmp/fx/nop.err
            grep -q "LBA 0," /tmp/fx/nop.err
            grep -q "stopped here" /tmp/fx/nop.err
            gnop destroy "/dev/$md.nop"
            mdconfig -d -u "${md#md}"

  # 14.x on a best-effort footing (N-06): built and tested so a break is
  # visible, allowed to fail so it does not hold anything up. stable/14
  # is supported by the project until November 2028.
  freebsd14:
    name: FreeBSD 14 (best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "14"
          usesh: true
          prepare: pkg install -y rust
          run: |
            cargo test --all-targets
            cargo build --release
            ./target/release/zvolrescue --version
