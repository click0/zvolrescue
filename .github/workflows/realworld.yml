name: Real-world (kernel ZFS)

# The real-world matrix on a kernel ZFS (docs/REALWORLD-TESTS.md), on
# demand: pools the kernel itself makes on file-backed devices, every
# oracle from OpenZFS, the tool reading the devices as devices. The
# environments from the matrix's table:
#
#  * Ubuntu LTS, the current one and the one before (26.04 and 24.04):
#    the runner's own kernel and its in-tree OpenZFS module — the cheap
#    check that the script and the tool hold up on a real kernel at all;
#  * Debian with zfs-dkms, stable and oldstable (13 and 12): a real
#    Debian VM under QEMU/KVM on the runner, the module built by dkms
#    against Debian's kernel, the static musl binaries copied in — the
#    environment the script was written for, and in 12's OpenZFS 2.1
#    the oldest ZFS on the matrix, the one that found both of D2's
#    defects;
#  * FreeBSD 15 and 14: the project's first-class and best-effort
#    targets (SPEC N-06), each a VM with the OpenZFS of its own base
#    system, the pools on md devices, the tool built in the VM;
#  * mfsBSD: the rescue medium itself — FreeBSD booted from an ISO into
#    RAM under QEMU/KVM on the runner, a pool its kernel makes on two
#    raw disks, and the static binary built on FreeBSD 15 copied in
#    over ssh (REALWORLD-TESTS E3).
#
# Each job uploads the run's record (results, the row for the matrix,
# the evidence log, every log of a failed scenario) whether it passed
# or not; the job's own status is the script's exit code.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Which environments to run, any of: ubuntu debian freebsd mfsbsd (empty: all)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  ubuntu-kernel:
    name: Ubuntu LTS, in-tree OpenZFS (${{ matrix.runner }} runner kernel)
    if: ${{ !github.event.inputs.only || contains(github.event.inputs.only, 'ubuntu') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ["ubuntu-26.04", "ubuntu-24.04"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p zvolrescue -p zvolreport
      - name: Kernel ZFS on the runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zfsutils-linux dmsetup strace python3 openssl
          sudo modprobe zfs || { sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" && sudo modprobe zfs; }
          zfs version
          uname -r
      - name: The matrix on loop devices
        id: run
        run: |
          set +e
          sudo bash tests/realworld/kernel-matrix.sh /var/tmp/rw ./target/release/zvolrescue 2>&1 | tee /var/tmp/run.log
          code=${PIPESTATUS[0]}
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          echo "## Ubuntu LTS (${{ matrix.runner }} runner kernel)" >> "$GITHUB_STEP_SUMMARY"
          cat /var/tmp/rw/env.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          echo >> "$GITHUB_STEP_SUMMARY"
          cat /var/tmp/rw/row.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat /var/tmp/rw/results.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null; echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: The record, whatever the verdict was
        if: always()
        run: |
          sudo mkdir -p /var/tmp/record
          sudo cp /var/tmp/run.log /var/tmp/record/ 2>/dev/null || true
          for f in env.txt results.txt row.md evidence.jsonl report.md; do sudo cp "/var/tmp/rw/$f" /var/tmp/record/ 2>/dev/null || true; done
          sudo mkdir -p /var/tmp/record/out
          sudo find /var/tmp/rw/out -maxdepth 1 -type f \( -name '*.log' -o -name '*.err' -o -name '*.txt' -o -name '*.json' \) -exec cp {} /var/tmp/record/out/ \; 2>/dev/null || true
          sudo chown -R "$USER" /var/tmp/record
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realworld-${{ matrix.runner }}
          path: /var/tmp/record

  debian-vm:
    name: Debian ${{ matrix.release }}, zfs-dkms (QEMU/KVM)
    if: ${{ !github.event.inputs.only || contains(github.event.inputs.only, 'debian') }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "13"
            codename: trixie
          - release: "12"
            codename: bookworm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Static binaries for the guest
        run: |
          cargo build --release --target x86_64-unknown-linux-musl -p zvolrescue -p zvolreport
          mkdir -p guest
          cp target/x86_64-unknown-linux-musl/release/zvolrescue target/x86_64-unknown-linux-musl/release/zvolreport tests/realworld/kernel-matrix.sh guest/
      - name: QEMU with KVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils genisoimage openssh-client
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: A Debian ${{ matrix.release }} cloud image, and a seed that lets us in
        run: |
          mkdir -p vm && cd vm
          base=https://cloud.debian.org/images/cloud/${{ matrix.codename }}/latest
          curl -sSL -o disk.qcow2 "$base/debian-${{ matrix.release }}-genericcloud-amd64.qcow2"
          curl -sSL "$base/SHA512SUMS" | grep ' debian-${{ matrix.release }}-genericcloud-amd64.qcow2$' | sed 's/ .*//; s/$/  disk.qcow2/' | sha512sum -c -
          qemu-img resize disk.qcow2 24G
          ssh-keygen -q -N '' -t ed25519 -f key
          printf 'instance-id: rw-1\nlocal-hostname: rw\n' > meta-data
          {
            echo '#cloud-config'
            echo 'users:'
            echo '  - name: debian'
            echo '    sudo: ALL=(ALL) NOPASSWD:ALL'
            echo '    shell: /bin/bash'
            echo '    ssh_authorized_keys:'
            echo "      - $(cat key.pub)"
            echo 'growpart:'
            echo '  mode: auto'
            echo '  devices: ["/"]'
          } > user-data
          genisoimage -quiet -output seed.iso -volid cidata -joliet -rock user-data meta-data
          qemu-system-x86_64 -enable-kvm -cpu host -m 4096 -smp 2 \
            -drive file=disk.qcow2,if=virtio,format=qcow2 \
            -drive file=seed.iso,if=virtio,format=raw \
            -netdev user,id=n0,hostfwd=tcp:127.0.0.1:2222-:22 -device virtio-net-pci,netdev=n0 \
            -display none -serial file:serial.log -daemonize -pidfile qemu.pid
          for i in $(seq 1 120); do
            if ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=3 -i key -p 2222 debian@127.0.0.1 true 2>/dev/null; then echo "ssh up after $((i*5)) s"; break; fi
            sleep 5
          done
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 debian@127.0.0.1 'uname -r; cat /etc/os-release | head -2; df -h / | tail -1'
      - name: zfs-dkms in the guest
        run: |
          cd vm
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 debian@127.0.0.1 'bash -s' <<'EOF'
          set -e
          export DEBIAN_FRONTEND=noninteractive
          sudo sed -i 's/^Components:.*/Components: main contrib non-free-firmware/' /etc/apt/sources.list.d/debian.sources
          sudo apt-get update -qq
          sudo -E apt-get install -y -qq --no-install-recommends "linux-headers-$(uname -r)" dkms zfs-dkms zfsutils-linux dmsetup strace python3 openssl
          sudo modprobe zfs
          zfs version
          ls -l /dev/zfs
          EOF
      - name: The matrix in the guest
        id: run
        run: |
          cd vm
          SSH="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222"
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -P 2222 ../guest/zvolrescue ../guest/zvolreport ../guest/kernel-matrix.sh debian@127.0.0.1:/var/tmp/
          set +e
          $SSH debian@127.0.0.1 'chmod +x /var/tmp/zvolrescue /var/tmp/zvolreport && sudo bash /var/tmp/kernel-matrix.sh /var/tmp/rw /var/tmp/zvolrescue' 2>&1 | tee run.log
          code=${PIPESTATUS[0]}
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          # The record, without the images.
          $SSH debian@127.0.0.1 'cd /var/tmp/rw && sudo tar czf /var/tmp/record.tgz env.txt results.txt row.md evidence.jsonl report.md $(cd out && ls | grep -E "\.(log|err|txt|json)$" | sed "s|^|out/|") 2>/dev/null; sudo chmod 644 /var/tmp/record.tgz'
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -P 2222 debian@127.0.0.1:/var/tmp/record.tgz .
          mkdir -p record && tar xzf record.tgz -C record && cp run.log serial.log record/
          echo "## Debian ${{ matrix.release }} (zfs-dkms, QEMU/KVM)" >> "$GITHUB_STEP_SUMMARY"
          cat record/env.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          echo >> "$GITHUB_STEP_SUMMARY"
          cat record/row.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat record/results.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null; echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: The guest's console, when nothing else came back
        if: always()
        run: |
          mkdir -p vm/record && cp vm/serial.log vm/record/ 2>/dev/null || true
          test -f vm/run.log && cp vm/run.log vm/record/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realworld-debian-${{ matrix.release }}
          path: vm/record

  freebsd:
    name: FreeBSD ${{ matrix.release }}, OpenZFS from base (md devices)
    if: ${{ !github.event.inputs.only || contains(github.event.inputs.only, 'freebsd') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["15", "14"]
    steps:
      - uses: actions/checkout@v5
      # The VM runs the script and always succeeds; the script's own exit
      # status comes back in the record and decides the job below, after
      # the record is uploaded.
      - uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          mem: 8192
          usesh: true
          prepare: pkg install -y rust bash python3
          # `run` is executed under `sh -e`: without `set +e` a failing
          # scenario ends the step before the record is copied back.
          run: |
            set +e
            freebsd-version -ku
            cargo build --release -p zvolrescue -p zvolreport
            { bash tests/realworld/kernel-matrix.sh /var/tmp/rw ./target/release/zvolrescue; echo $? > exit.txt; } 2>&1 | tee run.log
            mkdir -p record/out
            cp run.log exit.txt record/
            for f in env.txt results.txt row.md evidence.jsonl report.md; do cp "/var/tmp/rw/$f" record/ 2>/dev/null || true; done
            find /var/tmp/rw/out -maxdepth 1 -type f \( -name '*.log' -o -name '*.err' -o -name '*.txt' -o -name '*.json' \) -exec cp {} record/out/ \; 2>/dev/null || true
            true
      - name: The row, and the verdict
        if: always()
        run: |
          echo "## FreeBSD ${{ matrix.release }} (OpenZFS from base, md devices)" >> "$GITHUB_STEP_SUMMARY"
          cat record/env.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          echo >> "$GITHUB_STEP_SUMMARY"
          cat record/row.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat record/results.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null; echo '```' >> "$GITHUB_STEP_SUMMARY"
          test "$(cat record/exit.txt 2>/dev/null)" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realworld-freebsd-${{ matrix.release }}
          path: record

  # E3 on the rescue medium itself: mfsBSD — FreeBSD booted from an ISO
  # into RAM, the way a machine with no system left to install anything
  # on gets one — under QEMU/KVM on the runner, two raw virtio disks for
  # the pool its kernel makes, and the static zvolrescue built on
  # FreeBSD 15 copied in over ssh as root with the image's published
  # password, which is how a rescue system is reached. 14.2 is the newest
  # image mfsBSD publishes; there is no 15 yet.
  mfsbsd:
    name: mfsBSD 14.2 (FreeBSD in RAM, QEMU/KVM), the FreeBSD 15 static binary
    if: ${{ !github.event.inputs.only || contains(github.event.inputs.only, 'mfsbsd') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: The static binaries, built on FreeBSD 15
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15"
          usesh: true
          prepare: pkg install -y rust
          run: |
            export RUSTFLAGS="-C target-feature=+crt-static"
            cargo build --release --target x86_64-unknown-freebsd -p zvolrescue -p zvolreport
            mkdir -p guest
            for b in zvolrescue zvolreport; do
              file "target/x86_64-unknown-freebsd/release/$b"
              file "target/x86_64-unknown-freebsd/release/$b" | grep -Eq 'statically linked|static-pie linked'
              cp "target/x86_64-unknown-freebsd/release/$b" guest/
            done
            freebsd-version -ku | tee guest/built-on.txt
      - name: QEMU with KVM, and a way to give ssh a password
        run: |
          # The build VM has done its work; the runner's memory is for
          # the rescue system now.
          pkill -f qemu-system-x86_64 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils openssh-client sshpass
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: mfsBSD, checked against its published sums, booted with two blank disks
        run: |
          mkdir -p vm && cd vm
          base=https://mfsbsd.vx.sk/files/iso/14/amd64
          iso=mfsbsd-14.2-RELEASE-amd64.iso
          curl -sSL -o mfsbsd.iso "$base/$iso"
          curl -sSL "$base/$iso.sums.txt" | sed -n 's/^SHA2-256(.*)= *\([0-9a-f]*\).*/\1  mfsbsd.iso/p' | sha256sum -c -
          qemu-img create -f raw disk0.img 512M
          qemu-img create -f raw disk1.img 512M
          qemu-system-x86_64 -enable-kvm -cpu host -m 3072 -smp 2 \
            -cdrom mfsbsd.iso -boot d \
            -drive file=disk0.img,if=virtio,format=raw \
            -drive file=disk1.img,if=virtio,format=raw \
            -netdev user,id=n0,hostfwd=tcp:127.0.0.1:2223-:22 -device virtio-net-pci,netdev=n0 \
            -display none -serial file:serial.log -daemonize -pidfile qemu.pid
          SSH="sshpass -p mfsroot ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o ConnectTimeout=3 -p 2223 root@127.0.0.1"
          for i in $(seq 1 60); do
            if $SSH -q true 2>/dev/null; then echo "ssh up after $((i*5)) s"; break; fi
            sleep 5
          done
          $SSH 'uname -a; df -h /; kenv -q mfsbsd.autodhcp; ls /dev/vtbd*; zfs version'
      - name: E3 in the guest
        id: run
        run: |
          cd vm
          SSH="sshpass -p mfsroot ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -p 2223 root@127.0.0.1"
          for f in zvolrescue zvolreport; do $SSH "cat > /tmp/$f && chmod +x /tmp/$f" < "../guest/$f"; done
          $SSH 'cat > /tmp/mfsbsd.sh' < ../tests/realworld/mfsbsd.sh
          set +e
          $SSH 'sh /tmp/mfsbsd.sh /mnt/rw /tmp/zvolrescue /dev/vtbd0 /dev/vtbd1' 2>&1 | tee run.log
          code=${PIPESTATUS[0]}
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          # The record, without the image.
          $SSH 'cd /mnt/rw && tar czf - env.txt results.txt row.md evidence.jsonl report.md out 2>/dev/null' > record.tgz
          mkdir -p record && tar xzf record.tgz -C record 2>/dev/null; cp run.log serial.log ../guest/built-on.txt record/
          echo "## mfsBSD 14.2 (FreeBSD in RAM, QEMU/KVM), the binary built on FreeBSD $(cat ../guest/built-on.txt | head -n 1)" >> "$GITHUB_STEP_SUMMARY"
          cat record/env.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          echo >> "$GITHUB_STEP_SUMMARY"
          cat record/row.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat record/results.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null; echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: The guest's console, when nothing else came back
        if: always()
        run: |
          mkdir -p vm/record && cp vm/serial.log vm/record/ 2>/dev/null || true
          test -f vm/run.log && cp vm/run.log vm/record/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realworld-mfsbsd-14.2
          path: vm/record
