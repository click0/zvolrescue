name: Real-world (kernel ZFS)

# The real-world matrix on a kernel ZFS (docs/REALWORLD-TESTS.md), on
# demand: pools the kernel itself makes on file-backed devices, every
# oracle from OpenZFS, the tool reading the devices as devices. The
# environments from the matrix's table:
#
#  * Ubuntu LTS, the current one and the one before (26.04 and 24.04):
#    the runner's own kernel and its in-tree OpenZFS module — the cheap
#    check that the script and the tool hold up on a real kernel at all;
#  * Debian with zfs-dkms, stable and oldstable (13 and 12): a real
#    Debian VM under QEMU/KVM on the runner, the module built by dkms
#    against Debian's kernel, the static musl binaries copied in — the
#    environment the script was written for, and in 12's OpenZFS 2.1
#    the oldest ZFS on the matrix, the one that found both of D2's
#    defects;
#  * FreeBSD 15 and 14: the project's first-class and best-effort
#    targets (SPEC N-06), each a VM with the OpenZFS of its own base
#    system, the pools on md devices, the tool built in the VM;
#  * mfsBSD: the rescue medium itself — FreeBSD booted from an ISO into
#    RAM under QEMU/KVM on the runner, a pool its kernel makes on two
#    raw disks, and the static binary built on FreeBSD 15 copied in
#    over ssh (REALWORLD-TESTS E3);
#  * the golden image (SPEC §9.1, REALWORLD-TESTS G1–G3): built by
#    tests/golden/build-image.sh on the runner's kernel ZFS, the whole
#    damage matrix run over it, image and oracle uploaded for
#    publication in zvolrescue-testdata (publish-golden.yml);
#  * the satellites (zvolrescue-testdata ROADMAP, stage 2): a small pool
#    for each pool-level feature the golden pool does not have, built by
#    tests/golden/build-satellite.sh the same way, the manifests that
#    name it run over it, uploaded for publication the same way;
#  * the published golden images: each release of zvolrescue-testdata
#    that a tests/golden/<tag>.SHA256SUMS pins (image-v1, golden-v2, and
#    the satellites sat-<name>-v1), the
#    matrix over it with its oracle from that repository — what SPEC
#    §9.1 calls the CI job that fetches the image; also weekly, since an
#    image that does not change makes a changed verdict the tool's.
#
# Each job uploads the run's record (results, the row for the matrix,
# the evidence log, every log of a failed scenario) whether it passed
# or not; the job's own status is the script's exit code. The published
# golden images' job keeps its report in zvolrescue-testdata as well,
# as the next reports/<tag>-rN there, with publish-golden.yml's secret,
# when the repository variable KEEP_REPORTS is `true`.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Which environments to run, any of: ubuntu debian freebsd mfsbsd golden satellites (or sat-<name> for one) published (empty: all); held-out in the value runs the held-out manifests too (golden-held-out, published-held-out)"
        required: false
        default: ""
  schedule:
    # The published image, every Monday: the image is pinned, so a
    # verdict that changes is the tool that changed.
    - cron: "17 4 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  ubuntu-kernel:
    name: Ubuntu LTS, in-tree OpenZFS (${{ matrix.runner }} runner kernel)
    if: ${{ github.event_name != 'schedule' && (!github.event.inputs.only || contains(github.event.inputs.only, 'ubuntu')) }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ["ubuntu-26.04", "ubuntu-24.04"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p zvolrescue -p zvolreport
      - name: Kernel ZFS on the runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zfsutils-linux dmsetup strace python3 openssl
          sudo modprobe zfs || { sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" && sudo modprobe zfs; }
          zfs version
          uname -r
      - name: The matrix on loop devices
        id: run
        run: |
          set +e
          sudo bash tests/realworld/kernel-matrix.sh /var/tmp/rw ./target/release/zvolrescue 2>&1 | tee /var/tmp/run.log
          code=${PIPESTATUS[0]}
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          echo "## Ubuntu LTS (${{ matrix.runner }} runner kernel)" >> "$GITHUB_STEP_SUMMARY"
          cat /var/tmp/rw/env.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          echo >> "$GITHUB_STEP_SUMMARY"
          cat /var/tmp/rw/row.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat /var/tmp/rw/results.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null; echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: The record, whatever the verdict was
        if: always()
        run: |
          sudo mkdir -p /var/tmp/record
          sudo cp /var/tmp/run.log /var/tmp/record/ 2>/dev/null || true
          for f in env.txt results.txt row.md evidence.jsonl report.md; do sudo cp "/var/tmp/rw/$f" /var/tmp/record/ 2>/dev/null || true; done
          sudo mkdir -p /var/tmp/record/out
          sudo find /var/tmp/rw/out -maxdepth 1 -type f \( -name '*.log' -o -name '*.err' -o -name '*.txt' -o -name '*.json' \) -exec cp {} /var/tmp/record/out/ \; 2>/dev/null || true
          sudo chown -R "$USER" /var/tmp/record
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realworld-${{ matrix.runner }}
          path: /var/tmp/record

  debian-vm:
    name: Debian ${{ matrix.release }}, zfs-dkms (QEMU/KVM)
    if: ${{ github.event_name != 'schedule' && (!github.event.inputs.only || contains(github.event.inputs.only, 'debian')) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "13"
            codename: trixie
          - release: "12"
            codename: bookworm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Static binaries for the guest
        run: |
          cargo build --release --target x86_64-unknown-linux-musl -p zvolrescue -p zvolreport
          mkdir -p guest
          cp target/x86_64-unknown-linux-musl/release/zvolrescue target/x86_64-unknown-linux-musl/release/zvolreport tests/realworld/kernel-matrix.sh guest/
      - name: QEMU with KVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils genisoimage openssh-client
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: A Debian ${{ matrix.release }} cloud image, and a seed that lets us in
        run: |
          mkdir -p vm && cd vm
          base=https://cloud.debian.org/images/cloud/${{ matrix.codename }}/latest
          curl -sSL -o disk.qcow2 "$base/debian-${{ matrix.release }}-genericcloud-amd64.qcow2"
          curl -sSL "$base/SHA512SUMS" | grep ' debian-${{ matrix.release }}-genericcloud-amd64.qcow2$' | sed 's/ .*//; s/$/  disk.qcow2/' | sha512sum -c -
          qemu-img resize disk.qcow2 24G
          ssh-keygen -q -N '' -t ed25519 -f key
          printf 'instance-id: rw-1\nlocal-hostname: rw\n' > meta-data
          {
            echo '#cloud-config'
            echo 'users:'
            echo '  - name: debian'
            echo '    sudo: ALL=(ALL) NOPASSWD:ALL'
            echo '    shell: /bin/bash'
            echo '    ssh_authorized_keys:'
            echo "      - $(cat key.pub)"
            echo 'growpart:'
            echo '  mode: auto'
            echo '  devices: ["/"]'
          } > user-data
          genisoimage -quiet -output seed.iso -volid cidata -joliet -rock user-data meta-data
          qemu-system-x86_64 -enable-kvm -cpu host -m 4096 -smp 2 \
            -drive file=disk.qcow2,if=virtio,format=qcow2 \
            -drive file=seed.iso,if=virtio,format=raw \
            -netdev user,id=n0,hostfwd=tcp:127.0.0.1:2222-:22 -device virtio-net-pci,netdev=n0 \
            -display none -serial file:serial.log -daemonize -pidfile qemu.pid
          for i in $(seq 1 120); do
            if ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=3 -i key -p 2222 debian@127.0.0.1 true 2>/dev/null; then echo "ssh up after $((i*5)) s"; break; fi
            sleep 5
          done
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 debian@127.0.0.1 'uname -r; cat /etc/os-release | head -2; df -h / | tail -1'
      - name: zfs-dkms in the guest
        run: |
          cd vm
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 debian@127.0.0.1 'bash -s' <<'EOF'
          set -e
          export DEBIAN_FRONTEND=noninteractive
          sudo sed -i 's/^Components:.*/Components: main contrib non-free-firmware/' /etc/apt/sources.list.d/debian.sources
          sudo apt-get update -qq
          sudo -E apt-get install -y -qq --no-install-recommends "linux-headers-$(uname -r)" dkms zfs-dkms zfsutils-linux dmsetup strace python3 openssl
          sudo modprobe zfs
          zfs version
          ls -l /dev/zfs
          EOF
      - name: The matrix in the guest
        id: run
        run: |
          cd vm
          SSH="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222"
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -P 2222 ../guest/zvolrescue ../guest/zvolreport ../guest/kernel-matrix.sh debian@127.0.0.1:/var/tmp/
          set +e
          $SSH debian@127.0.0.1 'chmod +x /var/tmp/zvolrescue /var/tmp/zvolreport && sudo bash /var/tmp/kernel-matrix.sh /var/tmp/rw /var/tmp/zvolrescue' 2>&1 | tee run.log
          code=${PIPESTATUS[0]}
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          # The record, without the images.
          $SSH debian@127.0.0.1 'cd /var/tmp/rw && sudo tar czf /var/tmp/record.tgz env.txt results.txt row.md evidence.jsonl report.md $(cd out && ls | grep -E "\.(log|err|txt|json)$" | sed "s|^|out/|") 2>/dev/null; sudo chmod 644 /var/tmp/record.tgz'
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -P 2222 debian@127.0.0.1:/var/tmp/record.tgz .
          mkdir -p record && tar xzf record.tgz -C record && cp run.log serial.log record/
          echo "## Debian ${{ matrix.release }} (zfs-dkms, QEMU/KVM)" >> "$GITHUB_STEP_SUMMARY"
          cat record/env.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          echo >> "$GITHUB_STEP_SUMMARY"
          cat record/row.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat record/results.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null; echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: The guest's console, when nothing else came back
        if: always()
        run: |
          mkdir -p vm/record && cp vm/serial.log vm/record/ 2>/dev/null || true
          test -f vm/run.log && cp vm/run.log vm/record/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realworld-debian-${{ matrix.release }}
          path: vm/record

  freebsd:
    name: FreeBSD ${{ matrix.release }}, OpenZFS from base (md devices)
    # A word of `only`, not a part of one: `sat-freebsd` is the satellite's.
    if: ${{ github.event_name != 'schedule' && (!github.event.inputs.only || contains(format(' {0} ', github.event.inputs.only), ' freebsd ')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["15", "14"]
    steps:
      - uses: actions/checkout@v5
      # The VM runs the script and always succeeds; the script's own exit
      # status comes back in the record and decides the job below, after
      # the record is uploaded.
      - uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          mem: 8192
          usesh: true
          prepare: pkg install -y rust bash python3
          # `run` is executed under `sh -e`: without `set +e` a failing
          # scenario ends the step before the record is copied back.
          run: |
            set +e
            freebsd-version -ku
            cargo build --release -p zvolrescue -p zvolreport
            { bash tests/realworld/kernel-matrix.sh /var/tmp/rw ./target/release/zvolrescue; echo $? > exit.txt; } 2>&1 | tee run.log
            mkdir -p record/out
            cp run.log exit.txt record/
            for f in env.txt results.txt row.md evidence.jsonl report.md; do cp "/var/tmp/rw/$f" record/ 2>/dev/null || true; done
            find /var/tmp/rw/out -maxdepth 1 -type f \( -name '*.log' -o -name '*.err' -o -name '*.txt' -o -name '*.json' \) -exec cp {} record/out/ \; 2>/dev/null || true
            true
      - name: The row, and the verdict
        if: always()
        run: |
          echo "## FreeBSD ${{ matrix.release }} (OpenZFS from base, md devices)" >> "$GITHUB_STEP_SUMMARY"
          cat record/env.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          echo >> "$GITHUB_STEP_SUMMARY"
          cat record/row.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat record/results.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null; echo '```' >> "$GITHUB_STEP_SUMMARY"
          test "$(cat record/exit.txt 2>/dev/null)" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realworld-freebsd-${{ matrix.release }}
          path: record

  # E3 on the rescue medium itself: mfsBSD — FreeBSD booted from an ISO
  # into RAM, the way a machine with no system left to install anything
  # on gets one — under QEMU/KVM on the runner, two raw virtio disks for
  # the pool its kernel makes, and the static zvolrescue built on
  # FreeBSD 15 copied in over ssh as root with the image's published
  # password, which is how a rescue system is reached. 14.2 is the newest
  # image mfsBSD publishes; there is no 15 yet.
  mfsbsd:
    name: mfsBSD 14.2 (FreeBSD in RAM, QEMU/KVM), the FreeBSD 15 static binary
    if: ${{ github.event_name != 'schedule' && (!github.event.inputs.only || contains(github.event.inputs.only, 'mfsbsd')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: The static binaries, built on FreeBSD 15
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15"
          usesh: true
          prepare: pkg install -y rust
          run: |
            export RUSTFLAGS="-C target-feature=+crt-static"
            cargo build --release --target x86_64-unknown-freebsd -p zvolrescue -p zvolreport
            mkdir -p guest
            for b in zvolrescue zvolreport; do
              file "target/x86_64-unknown-freebsd/release/$b"
              file "target/x86_64-unknown-freebsd/release/$b" | grep -Eq 'statically linked|static-pie linked'
              cp "target/x86_64-unknown-freebsd/release/$b" guest/
            done
            freebsd-version -ku | tee guest/built-on.txt
      - name: QEMU with KVM, and a way to give ssh a password
        run: |
          # The build VM has done its work; the runner's memory is for
          # the rescue system now.
          pkill -f qemu-system-x86_64 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils openssh-client sshpass
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: mfsBSD, checked against its published sums, booted with two blank disks
        run: |
          mkdir -p vm && cd vm
          base=https://mfsbsd.vx.sk/files/iso/14/amd64
          iso=mfsbsd-14.2-RELEASE-amd64.iso
          curl -sSL -o mfsbsd.iso "$base/$iso"
          curl -sSL "$base/$iso.sums.txt" | sed -n 's/^SHA2-256(.*)= *\([0-9a-f]*\).*/\1  mfsbsd.iso/p' | sha256sum -c -
          qemu-img create -f raw disk0.img 512M
          qemu-img create -f raw disk1.img 512M
          qemu-system-x86_64 -enable-kvm -cpu host -m 3072 -smp 2 \
            -cdrom mfsbsd.iso -boot d \
            -drive file=disk0.img,if=virtio,format=raw \
            -drive file=disk1.img,if=virtio,format=raw \
            -netdev user,id=n0,hostfwd=tcp:127.0.0.1:2223-:22 -device virtio-net-pci,netdev=n0 \
            -display none -serial file:serial.log -daemonize -pidfile qemu.pid
          SSH="sshpass -p mfsroot ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o ConnectTimeout=3 -p 2223 root@127.0.0.1"
          for i in $(seq 1 60); do
            if $SSH -q true 2>/dev/null; then echo "ssh up after $((i*5)) s"; break; fi
            sleep 5
          done
          $SSH 'uname -a; df -h /; kenv -q mfsbsd.autodhcp; ls /dev/vtbd*; zfs version'
      - name: E3 in the guest
        id: run
        run: |
          cd vm
          SSH="sshpass -p mfsroot ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -p 2223 root@127.0.0.1"
          for f in zvolrescue zvolreport; do $SSH "cat > /tmp/$f && chmod +x /tmp/$f" < "../guest/$f"; done
          $SSH 'cat > /tmp/mfsbsd.sh' < ../tests/realworld/mfsbsd.sh
          set +e
          $SSH 'sh /tmp/mfsbsd.sh /mnt/rw /tmp/zvolrescue /dev/vtbd0 /dev/vtbd1' 2>&1 | tee run.log
          code=${PIPESTATUS[0]}
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          # The record, without the image.
          $SSH 'cd /mnt/rw && tar czf - env.txt results.txt row.md evidence.jsonl report.md out 2>/dev/null' > record.tgz
          mkdir -p record && tar xzf record.tgz -C record 2>/dev/null; cp run.log serial.log ../guest/built-on.txt record/
          echo "## mfsBSD 14.2 (FreeBSD in RAM, QEMU/KVM), the binary built on FreeBSD $(cat ../guest/built-on.txt | head -n 1)" >> "$GITHUB_STEP_SUMMARY"
          cat record/env.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          echo >> "$GITHUB_STEP_SUMMARY"
          cat record/row.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat record/results.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null; echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: The guest's console, when nothing else came back
        if: always()
        run: |
          mkdir -p vm/record && cp vm/serial.log vm/record/ 2>/dev/null || true
          test -f vm/run.log && cp vm/run.log vm/record/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realworld-mfsbsd-14.2
          path: vm/record

  # The golden image (SPEC §9.1): one pool with mirror, raidz2 and dRAID
  # tops, every checksum and compression, encrypted datasets, snapshots,
  # clones, a promotion, rollbacks, renames, destroys, a tree of every
  # kind of file, cloned blocks, hundreds of TXGs, built by the runner's
  # own kernel ZFS and recorded against OpenZFS alone — then the whole
  # damage matrix over it, every expectation enforced, since this
  # layout is known. The image and its oracle are uploaded as an
  # artifact for publication in zvolrescue-testdata (a release there,
  # `golden-v2`, by publish-golden.yml), which this workflow cannot do
  # itself; the oracle, the description and the report alone, a few
  # MB, as a second artifact, to be moved there by hand.
  golden:
    name: Golden image (G1) on the runner kernel, and the damage matrix over it (G2, G3)
    if: ${{ github.event_name != 'schedule' && (!github.event.inputs.only || contains(github.event.inputs.only, 'golden')) }}
    runs-on: ubuntu-26.04
    env:
      TAG: golden-v2
    steps:
      - uses: actions/checkout@v5
      # The manifests are all this job reads of the test data: the image
      # and its oracle are the ones it builds.
      - uses: actions/checkout@v5
        with:
          repository: click0/zvolrescue-testdata
          path: testdata
          sparse-checkout: manifests
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p zvolrescue -p zvolcarve -p zvolfiles -p zvoltimeline -p zvolreport && cargo build --release -p zfs-read --examples
      - name: Kernel ZFS on the runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zfsutils-linux zstd attr python3 openssl
          sudo modprobe zfs || { sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" && sudo modprobe zfs; }
          zfs version
          uname -r
      - name: G1, the image, and its oracle from OpenZFS
        run: |
          # The manifests say which older copies the release carries.
          sudo sh tests/golden/build-image.sh /var/tmp/golden "$TAG" testdata/manifests 2>&1 | tee /var/tmp/golden-build.log
          test "${PIPESTATUS[0]}" = 0
          sudo chown -R "$USER" /var/tmp/golden
          du -sh /var/tmp/golden/members /var/tmp/golden/release /var/tmp/golden/oracle
          du -sh /var/tmp/golden/oracle/* | sort -h | tail -n 8
          cat /var/tmp/golden/release/SHA256SUMS
          python3 -c 'import json; l = json.load(open("/var/tmp/golden/oracle/layout.json")); print(l["pool"], l["volumes"], [(t["index"], t["kind"], len(t["members"])) for t in l["tops"]])'
          wc -l /var/tmp/golden/oracle/volumes.sha256
          grep -E '^(feature@block_cloning|capacity|allocated)' /var/tmp/golden/oracle/zpool-get-all.txt
          df -h /var/tmp
      - name: The undamaged image first, every volume, the tool's own words on stderr
        run: |
          # What the matrix cannot say: when every manifest comes back
          # "refused", whether the tool reads this pool at all. Every
          # volume of the intact image, with the key the oracle holds for
          # it, and the exit code and stderr of each.
          cd /var/tmp/golden
          members=$(ls members/*.img)
          rc=0
          while read -r sha name; do
            vol=${name%@export}
            case $(awk -F'\t' -v v="$vol" '$1 == v && $2 == "keyformat" { print $3 }' oracle/zfs-get-all.txt) in
              raw) key="--key raw:$PWD/oracle/keys/raw.key" ;;
              passphrase) key="--key passphrase:$PWD/oracle/keys/passphrase.txt" ;;
              *) key="" ;;
            esac
            set +e
            "$GITHUB_WORKSPACE/target/release/zvolrescue" -q dump "$vol" $members $key -o /var/tmp/baseline.img 2>/var/tmp/baseline.err; code=$?
            set -e
            got=$(sha256sum /var/tmp/baseline.img 2>/dev/null | cut -d' ' -f1)
            if [ "$code" = 0 ] && [ "$got" = "$sha" ]; then echo "ok        $vol"
            else echo "FAIL ($code) $vol: $(tail -n 3 /var/tmp/baseline.err | tr '\n' ' ')"; rc=1; fi
            rm -f /var/tmp/baseline.img
          done < <(grep '@export$' oracle/volumes.sha256)
          # The scan and list of the intact image, for the record.
          "$GITHUB_WORKSPACE/target/release/zvolrescue" scan $members | tail -n 20 || true
          "$GITHUB_WORKSPACE/target/release/zvolrescue" list -r $members 2>&1 | tail -n 30 || true
          test "$rc" = 0
      - name: G2, G3, the damage matrix over it
        id: matrix
        run: |
          set -o pipefail
          held=""
          case "${{ github.event.inputs.only }}" in *held-out*) held=--held-out ;; esac
          set +e
          python3 tests/golden/run-matrix.py \
            --image /var/tmp/golden/members --oracle /var/tmp/golden/oracle \
            --manifests testdata/manifests --out /var/tmp/golden/report --label "$TAG" \
            --tmp /var/tmp $held 2>&1 | tee /var/tmp/golden-matrix.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "run-matrix.py exit $rc"
          # Against this image every expectation holds: the layout is the
          # one the manifests were written for, so a run that lands
          # outside its expected category is a finding, not noise.
          python3 tests/golden/summarize-report.py "/var/tmp/golden/report/report-$TAG.json" \
            "Golden image $TAG: the damage matrix (G2, G3)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$rc" = 0 || { echo "::error::run-matrix.py exited $rc"; exit 1; }
      - name: The image and its oracle, for zvolrescue-testdata
        if: always()
        run: |
          # The text apart, and the release beside it by hard links: the
          # runner's disk holds the members, their older copies and the
          # release already. A build that failed left all of it root's.
          sudo chown -R "$USER" /var/tmp/golden 2>/dev/null || true
          mkdir -p /var/tmp/golden/text /var/tmp/golden/publish
          cp -r /var/tmp/golden/oracle /var/tmp/golden/IMAGE.md /var/tmp/golden/text/ 2>/dev/null || true
          cp /var/tmp/golden/release/SHA256SUMS /var/tmp/golden/text/ 2>/dev/null || true
          cp /var/tmp/golden-build.log /var/tmp/golden/text/ 2>/dev/null || true
          cp -r /var/tmp/golden/report /var/tmp/golden/text/ 2>/dev/null || true
          cp /var/tmp/golden-matrix.log /var/tmp/golden/text/report/ 2>/dev/null || true
          cp -r /var/tmp/golden/text/. /var/tmp/golden/publish/ 2>/dev/null || true
          rm -f /var/tmp/golden/publish/SHA256SUMS
          cp -al /var/tmp/golden/release /var/tmp/golden/publish/ 2>/dev/null || true
          du -sh /var/tmp/golden/text /var/tmp/golden/publish || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-${{ env.TAG }}-text
          path: /var/tmp/golden/text
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-${{ env.TAG }}
          path: /var/tmp/golden/publish
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn


  # The satellites of the golden image (zvolrescue-testdata ROADMAP,
  # stage 2): a small pool for each pool-level feature the golden pool
  # does not have, built by tests/golden/build-satellite.sh on the
  # runner's kernel ZFS, the manifests that name it run over it, image
  # and oracle uploaded for publication (publish-golden.yml, the tag
  # sat-<name>-v1). `only: satellites` builds every one; `only: sat-spare
  # sat-slog` those named.
  satellite-list:
    name: The satellites to build
    if: ${{ github.event_name != 'schedule' && (!github.event.inputs.only || contains(github.event.inputs.only, 'sat')) }}
    runs-on: ubuntu-24.04
    outputs:
      sats: ${{ steps.list.outputs.sats }}
    steps:
      - id: list
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          all="removal checkpoint spare expand special ashift slog mmp compat20 nofeatures v28 scale"
          picked=""
          for s in $all; do case " $ONLY " in *" sat-$s "*) picked="$picked $s" ;; esac; done
          # All of them for `satellites` or an empty `only`; none when
          # `only` names the FreeBSD one alone, which has a job of its own.
          case " $ONLY " in *" satellites "*|"  ") picked=$all ;; esac
          echo "sats=$(printf '%s\n' $picked | jq -R . | jq -sc 'map(select(length > 0))')" | tee -a "$GITHUB_OUTPUT"

  satellites:
    name: Satellite ${{ matrix.sat }} on the runner kernel, and its manifests
    needs: satellite-list
    if: ${{ needs.satellite-list.outputs.sats != '[]' }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        sat: ${{ fromJSON(needs.satellite-list.outputs.sats) }}
    env:
      SAT: ${{ matrix.sat }}
      TAG: sat-${{ matrix.sat }}-v1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: click0/zvolrescue-testdata
          path: testdata
          sparse-checkout: manifests
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p zvolrescue -p zvolcarve -p zvolfiles -p zvoltimeline -p zvolreport && cargo build --release -p zfs-read --examples
      - name: Kernel ZFS on the runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zfsutils-linux zstd attr python3 openssl
          sudo modprobe zfs || { sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" && sudo modprobe zfs; }
          zfs version
          uname -r
      - name: The satellite, and its oracle from OpenZFS
        run: |
          sudo sh tests/golden/build-satellite.sh /var/tmp/sat "$SAT" "$TAG" 2>&1 | tee /var/tmp/sat-build.log
          test "${PIPESTATUS[0]}" = 0
          sudo chown -R "$USER" /var/tmp/sat
          du -sh /var/tmp/sat/members /var/tmp/sat/release /var/tmp/sat/oracle
          cat /var/tmp/sat/release/SHA256SUMS
          python3 -c 'import json; l = json.load(open("/var/tmp/sat/oracle/layout.json")); print(l["pool"], [(t["index"], t["kind"], t["members"], t.get("slot_devices"), t.get("log"), t.get("alloc_bias")) for t in l["tops"]])'
          sed -n '/^config:/,/^errors:/p' /var/tmp/sat/oracle/zpool-status.txt
          cat /var/tmp/sat/oracle/volumes.sha256
          grep -E '^(feature@|capacity|allocated)' /var/tmp/sat/oracle/zpool-get-all.txt | grep -v disabled
      - name: Every volume of the undamaged satellite, for the record
        run: |
          # The control manifest judges this; here are the tool's own
          # words on stderr, which the matrix keeps only for a refusal.
          cd /var/tmp/sat
          members=$(ls members/*.img)
          while read -r sha name; do
            vol=${name%@export}
            set +e
            "$GITHUB_WORKSPACE/target/release/zvolrescue" -q dump "$vol" $members -o /var/tmp/baseline.img 2>/var/tmp/baseline.err; code=$?
            set -e
            got=$(sha256sum /var/tmp/baseline.img 2>/dev/null | cut -d' ' -f1)
            if [ "$code" = 0 ] && [ "$got" = "$sha" ]; then echo "ok        $vol"
            else echo "FAIL ($code) $vol: $(tail -n 3 /var/tmp/baseline.err | tr '\n' ' ')"; fi
            rm -f /var/tmp/baseline.img
          done < <(grep '@export$' oracle/volumes.sha256)
          "$GITHUB_WORKSPACE/target/release/zvolrescue" scan $members | tail -n 25 || true
          "$GITHUB_WORKSPACE/target/release/zvolrescue" list -r $members 2>&1 | tail -n 30 || true
      - name: The manifests that name it
        run: |
          set -o pipefail
          set +e
          python3 tests/golden/run-matrix.py \
            --image /var/tmp/sat/members --oracle /var/tmp/sat/oracle \
            --manifests testdata/manifests --out /var/tmp/sat/report --label "$TAG" \
            --tmp /var/tmp --held-out 2>&1 | tee /var/tmp/sat-matrix.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "run-matrix.py exit $rc"
          python3 tests/golden/summarize-report.py "/var/tmp/sat/report/report-$TAG.json" \
            "Satellite $TAG: its manifests" | tee -a "$GITHUB_STEP_SUMMARY"
          test -s /var/tmp/sat/report/report-$TAG.json && python3 -c 'import json, sys; sys.exit(0 if json.load(open(sys.argv[1])) else 1)' "/var/tmp/sat/report/report-$TAG.json" ||
            { echo "::error::no manifest names $TAG's pool"; exit 1; }
          test "$rc" = 0 || { echo "::error::run-matrix.py exited $rc"; exit 1; }
      - name: The satellite and its oracle, for zvolrescue-testdata
        if: always()
        run: |
          sudo chown -R "$USER" /var/tmp/sat 2>/dev/null || true
          mkdir -p /var/tmp/sat/text /var/tmp/sat/publish
          cp -r /var/tmp/sat/oracle /var/tmp/sat/IMAGE.md /var/tmp/sat/text/ 2>/dev/null || true
          cp /var/tmp/sat/release/SHA256SUMS /var/tmp/sat/text/ 2>/dev/null || true
          cp /var/tmp/sat-build.log /var/tmp/sat/text/golden-build.log 2>/dev/null || true
          cp -r /var/tmp/sat/report /var/tmp/sat/text/ 2>/dev/null || true
          cp /var/tmp/sat-matrix.log /var/tmp/sat/text/report/golden-matrix.log 2>/dev/null || true
          cp -r /var/tmp/sat/text/. /var/tmp/sat/publish/ 2>/dev/null || true
          rm -f /var/tmp/sat/publish/SHA256SUMS
          cp -al /var/tmp/sat/release /var/tmp/sat/publish/ 2>/dev/null || true
          du -sh /var/tmp/sat/text /var/tmp/sat/publish || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-${{ env.TAG }}-text
          path: /var/tmp/sat/text
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-${{ env.TAG }}
          path: /var/tmp/sat/publish
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn

  # The satellite made on another system (stage 3): FreeBSD 15 in a VM
  # makes the pool with the OpenZFS of its base system, on GPT partitions
  # as its installer lays them out, and captures the oracle; the members
  # and the oracle come back to the runner, where the manifests that name
  # it are run as for any satellite. `only: sat-freebsd`, or satellites.
  satellite-freebsd:
    name: Satellite freebsd, made on FreeBSD 15 with its base OpenZFS, and its manifests
    if: ${{ github.event_name != 'schedule' && (!github.event.inputs.only || contains(github.event.inputs.only, 'sat-freebsd') || contains(github.event.inputs.only, 'satellites')) }}
    runs-on: ubuntu-latest
    env:
      TAG: sat-freebsd-v1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: click0/zvolrescue-testdata
          path: testdata
          sparse-checkout: manifests
      # The VM always succeeds; the builder's exit status comes back with
      # its log and decides the next step.
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "15"
          mem: 8192
          usesh: true
          prepare: pkg install -y python3 zstd
          run: |
            set +e
            freebsd-version -ku
            zfs version
            sh tests/golden/build-satellite.sh /var/tmp/sat freebsd sat-freebsd-v1 > sat-build.log 2>&1
            echo $? > sat-exit.txt
            rm -rf satout && mkdir -p satout
            cp -r /var/tmp/sat/oracle /var/tmp/sat/release /var/tmp/sat/IMAGE.md satout/ 2>/dev/null
            cp sat-build.log sat-exit.txt satout/
            true
      - name: The satellite, and its oracle from FreeBSD's OpenZFS
        run: |
          tail -n 40 satout/sat-build.log
          test "$(cat satout/sat-exit.txt)" = 0
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends zstd
          sudo mkdir -p /var/tmp/sat && sudo chown -R "$USER" /var/tmp/sat
          cp -r satout/oracle satout/release satout/IMAGE.md /var/tmp/sat/
          cp satout/sat-build.log /var/tmp/sat-build.log
          mkdir -p /var/tmp/sat/members
          for f in /var/tmp/sat/release/*.zst; do zstd -d -q -f --sparse "$f" -o "/var/tmp/sat/members/$(basename "$f" .zst)"; done
          (cd /var/tmp/sat/members && sha256sum -c ../oracle/members.sha256)
          cat /var/tmp/sat/release/SHA256SUMS
          python3 -c 'import json; l = json.load(open("/var/tmp/sat/oracle/layout.json")); print(l["pool"], l["members"])'
          sed -n '/^config:/,/^errors:/p' /var/tmp/sat/oracle/zpool-status.txt
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p zvolrescue -p zvolcarve -p zvolfiles -p zvoltimeline -p zvolreport && cargo build --release -p zfs-read --examples
      - name: Every volume of the undamaged satellite, for the record
        run: |
          cd /var/tmp/sat
          members=$(ls members/*.img)
          while read -r sha name; do
            vol=${name%@export}
            set +e
            "$GITHUB_WORKSPACE/target/release/zvolrescue" -q dump "$vol" $members -o /var/tmp/baseline.img 2>/var/tmp/baseline.err; code=$?
            set -e
            got=$(sha256sum /var/tmp/baseline.img 2>/dev/null | cut -d' ' -f1)
            if [ "$code" = 0 ] && [ "$got" = "$sha" ]; then echo "ok        $vol"
            else echo "FAIL ($code) $vol: $(tail -n 3 /var/tmp/baseline.err | tr '\n' ' ')"; fi
            rm -f /var/tmp/baseline.img
          done < <(grep '@export$' oracle/volumes.sha256)
          "$GITHUB_WORKSPACE/target/release/zvolrescue" scan $members | tail -n 25 || true
      - name: The manifests that name it
        run: |
          set -o pipefail
          set +e
          python3 tests/golden/run-matrix.py \
            --image /var/tmp/sat/members --oracle /var/tmp/sat/oracle \
            --manifests testdata/manifests --out /var/tmp/sat/report --label "$TAG" \
            --tmp /var/tmp --held-out 2>&1 | tee /var/tmp/sat-matrix.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "run-matrix.py exit $rc"
          python3 tests/golden/summarize-report.py "/var/tmp/sat/report/report-$TAG.json" \
            "Satellite $TAG: its manifests" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$rc" = 0 || { echo "::error::run-matrix.py exited $rc"; exit 1; }
      - name: The satellite and its oracle, for zvolrescue-testdata
        if: always()
        run: |
          mkdir -p /var/tmp/sat/text /var/tmp/sat/publish
          cp -r /var/tmp/sat/oracle /var/tmp/sat/IMAGE.md /var/tmp/sat/text/ 2>/dev/null || true
          cp /var/tmp/sat/release/SHA256SUMS /var/tmp/sat/text/ 2>/dev/null || true
          cp /var/tmp/sat-build.log /var/tmp/sat/text/golden-build.log 2>/dev/null || cp satout/sat-build.log /var/tmp/sat/text/golden-build.log 2>/dev/null || true
          cp -r /var/tmp/sat/report /var/tmp/sat/text/ 2>/dev/null || true
          cp /var/tmp/sat-matrix.log /var/tmp/sat/text/report/golden-matrix.log 2>/dev/null || true
          cp -r /var/tmp/sat/text/. /var/tmp/sat/publish/ 2>/dev/null || true
          rm -f /var/tmp/sat/publish/SHA256SUMS
          cp -al /var/tmp/sat/release /var/tmp/sat/publish/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-${{ env.TAG }}-text
          path: /var/tmp/sat/text
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-${{ env.TAG }}
          path: /var/tmp/sat/publish
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn

  # The golden images as published (SPEC §9.1): each release of
  # zvolrescue-testdata that a tests/golden/<tag>.SHA256SUMS pins,
  # fetched and checked against those sums, the oracle and the manifests
  # from that repository's checkout, the whole damage matrix over it with
  # every expectation enforced — the held-out manifests too when asked.
  # Runs weekly as well: the image never changes, so a verdict that
  # changes is the tool's doing.
  golden-published:
    name: The published golden image (${{ matrix.tag }}), the damage matrix over it (G2–G4)
    if: ${{ github.event_name == 'schedule' || !github.event.inputs.only || contains(github.event.inputs.only, 'published') }}
    runs-on: ubuntu-24.04
    # Every published image this repository pins, each with its oracle's
    # directory in zvolrescue-testdata: image-v1's is oracle/golden, a
    # satellite's its pool's name.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: image-v1, oracle: golden }
          - { tag: golden-v2, oracle: golden-v2 }
          - { tag: sat-removal-v1, oracle: sat-removal }
          - { tag: sat-checkpoint-v1, oracle: sat-checkpoint }
          - { tag: sat-spare-v1, oracle: sat-spare }
          - { tag: sat-expand-v1, oracle: sat-expand }
          - { tag: sat-special-v1, oracle: sat-special }
          - { tag: sat-ashift-v1, oracle: sat-ashift }
          - { tag: sat-slog-v1, oracle: sat-slog }
          - { tag: sat-mmp-v1, oracle: sat-mmp }
          - { tag: sat-compat20-v1, oracle: sat-compat20 }
          - { tag: sat-nofeatures-v1, oracle: sat-nofeatures }
          - { tag: sat-v28-v1, oracle: sat-v28 }
          - { tag: sat-freebsd-v1, oracle: sat-freebsd }
    env:
      TAG: ${{ matrix.tag }}
      ORACLE: testdata/oracle/${{ matrix.oracle }}
      TESTDATA: click0/zvolrescue-testdata
      # An image of the held-out runs alone (`held: true`, a pool at
      # scale): every step after the checkout is skipped in the others.
      SKIP: ${{ matrix.held && !contains(github.event.inputs.only, 'held-out') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: click0/zvolrescue-testdata
          path: testdata
      - uses: dtolnay/rust-toolchain@stable
        if: env.SKIP != '1'
      - if: env.SKIP != '1'
        run: cargo build --release -p zvolrescue -p zvolcarve -p zvolfiles -p zvoltimeline -p zvolreport && cargo build --release -p zfs-read --examples
      - name: The release files, kept between runs
        if: env.SKIP != '1'
        uses: actions/cache@v4
        with:
          path: /var/tmp/image/dl
          key: golden-${{ env.TAG }}-${{ hashFiles(format('tests/golden/{0}.SHA256SUMS', matrix.tag)) }}
      - name: The release files, checked against the pinned sums, and the members out of them
        if: env.SKIP != '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends zstd
          # The pin and the oracle's own record of the release agree.
          cmp "tests/golden/$TAG.SHA256SUMS" "$ORACLE/SHA256SUMS-release.txt"
          sudo mkdir -p /var/tmp/image && sudo chown -R "$USER" /var/tmp/image
          # What the manifests this run selects need, and no more: every
          # member, and the older copy of each member an older-self damage
          # names (6 of image-v1's 10; golden-v2's release holds those alone).
          held=""
          case "${{ github.event.inputs.only }}" in *held-out*) held=--held-out ;; esac
          python3 tests/golden/run-matrix.py --print-needs --oracle "$ORACLE" \
            --manifests testdata/manifests $held > /var/tmp/image/needs.txt
          NEEDS=/var/tmp/image/needs.txt sh tests/golden/fetch-image.sh "$TAG" "tests/golden/$TAG.SHA256SUMS" /var/tmp/image "$ORACLE/members.sha256"
          df -h /var/tmp | tail -n 1
      - name: The undamaged image first, every volume
        if: env.SKIP != '1'
        run: |
          # A satellite's control manifest says what its volumes come to:
          # an expanded raidz's are refused, and rightly.
          if python3 -c 'import json, sys; sys.exit(0 if json.load(open(sys.argv[1])).get("satellite") else 1)' "$ORACLE/layout.json"; then
            echo "a satellite: its control-sat-* manifest judges the undamaged image"; exit 0
          fi
          cd /var/tmp/image
          members=$(ls members/*.img)
          rc=0
          while read -r sha name; do
            vol=${name%@export}
            case $(awk -F'\t' -v v="$vol" '$1 == v && $2 == "keyformat" { print $3 }' "$GITHUB_WORKSPACE/$ORACLE/zfs-get-all.txt") in
              raw) key="--key raw:$GITHUB_WORKSPACE/$ORACLE/keys/raw.key" ;;
              passphrase) key="--key passphrase:$GITHUB_WORKSPACE/$ORACLE/keys/passphrase.txt" ;;
              *) key="" ;;
            esac
            set +e
            "$GITHUB_WORKSPACE/target/release/zvolrescue" -q dump "$vol" $members $key -o /var/tmp/baseline.img 2>/var/tmp/baseline.err; code=$?
            set -e
            got=$(sha256sum /var/tmp/baseline.img 2>/dev/null | cut -d' ' -f1)
            if [ "$code" = 0 ] && [ "$got" = "$sha" ]; then echo "ok        $vol"
            else echo "FAIL ($code) $vol: $(tail -n 3 /var/tmp/baseline.err | tr '\n' ' ')"; rc=1; fi
            rm -f /var/tmp/baseline.img
          done < <(grep '@export$' "$GITHUB_WORKSPACE/$ORACLE/volumes.sha256")
          test "$rc" = 0
      - name: The damage matrix over it (G2, G3; G4 with held-out)
        if: env.SKIP != '1'
        run: |
          set -o pipefail
          held=""
          case "${{ github.event.inputs.only }}" in *held-out*) held=--held-out ;; esac
          set +e
          start=$(date +%s)
          python3 tests/golden/run-matrix.py \
            --image /var/tmp/image/members --oracle "$ORACLE" \
            --manifests testdata/manifests --out /var/tmp/image/report --label "$TAG" \
            --tmp /var/tmp $held 2>&1 | tee /var/tmp/image/matrix.log
          rc=${PIPESTATUS[0]}
          echo $(( $(date +%s) - start )) > /var/tmp/image/seconds
          set -e
          echo "run-matrix.py exit $rc"
          python3 tests/golden/summarize-report.py "/var/tmp/image/report/report-$TAG.json" \
            "The published golden image $TAG: the damage matrix (G2, G3${held:+, G4})" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$rc" = 0 || { echo "::error::run-matrix.py exited $rc"; exit 1; }
      - name: The report
        if: always() && env.SKIP != '1'
        run: |
          mkdir -p /var/tmp/image/report
          cp /var/tmp/image/matrix.log /var/tmp/image/report/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always() && env.SKIP != '1'
        with:
          name: golden-published-${{ env.TAG }}-report
          path: /var/tmp/image/report
      # Every run's report kept where the image is, not only as this
      # run's artifact: the next reports/<tag>-rN of zvolrescue-testdata,
      # laid out by that repository's own tools/add-report.py, pushed
      # with the secret publish-golden.yml uses (its header says how to
      # make it). A pass and a failure alike: a failing run's report is
      # the one most worth keeping. Nothing is kept from a branch other
      # than main, from a run that wrote no report, without the secret,
      # or unless the repository variable KEEP_REPORTS is `true` (Settings
      # → Secrets and variables → Actions → Variables): the secret is
      # there for publish-golden.yml, and a commit to the test data every
      # week is a choice of its own. The step says which.
      - name: The report, kept in zvolrescue-testdata
        if: always() && env.SKIP != '1'
        env:
          TESTDATA_TOKEN: ${{ secrets.TESTDATA_TOKEN }}
          KEEP_REPORTS: ${{ vars.KEEP_REPORTS }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          report=/var/tmp/image/report
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "a run of $GITHUB_REF: its report stays an artifact of the run"; exit 0
          fi
          if [ "$KEEP_REPORTS" != true ]; then
            echo "::notice::the repository variable KEEP_REPORTS is not true: the report stays an artifact of this run, to be kept in zvolrescue-testdata by hand (tools/add-report.py there)"; exit 0
          fi
          if [ ! -f "$report/report-$TAG.json" ]; then
            echo "::notice::no report-$TAG.json: the matrix wrote no report, so none is kept"; exit 0
          fi
          if [ -z "$TESTDATA_TOKEN" ]; then
            echo "::notice::no TESTDATA_TOKEN in this repository's Actions secrets: the report stays an artifact of this run (publish-golden.yml says how to make the token)"; exit 0
          fi
          case "$GITHUB_EVENT_NAME" in
            schedule) by='`realworld.yml` in zvolrescue, the weekly run' ;;
            *) by="\`realworld.yml\` in zvolrescue, run by hand${ONLY:+ with only: $ONLY}" ;;
          esac
          held=""
          case "$ONLY" in *held-out*) held=--held-out ;; esac
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          manifests=$(git -C testdata rev-parse HEAD)
          counts=$(python3 -c 'import collections, json, sys; c = collections.Counter(r["verdict"] for r in json.load(open(sys.argv[1]))); print(", ".join(f"{k} {v}" for k, v in sorted(c.items())))' "$report/report-$TAG.json")
          # Another run may push between this clone and its push: the
          # directory is then taken again from a fresh clone.
          for attempt in 1 2 3; do
            rm -rf /var/tmp/td
            git clone -q --depth 1 "https://x-access-token:${TESTDATA_TOKEN}@github.com/$TESTDATA" /var/tmp/td
            dir=$(python3 -I /var/tmp/td/tools/add-report.py "$report" --tag "$TAG" --root /var/tmp/td \
              --by "$by" --run-url "$url" --tool-commit "$GITHUB_SHA" --manifests-commit "$manifests" \
              --seconds "$(cat /var/tmp/image/seconds 2>/dev/null || echo 0)" $held)
            git -C /var/tmp/td add "$dir"
            git -C /var/tmp/td -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q \
              -m "$dir: the damage matrix against $TAG, run $GITHUB_RUN_ID of realworld.yml" \
              -m "From $url ($GITHUB_EVENT_NAME), zvolrescue ${GITHUB_SHA:0:7}, the manifests at ${manifests:0:7}: $counts."
            if git -C /var/tmp/td push -q origin HEAD:main; then
              echo "report kept: https://github.com/$TESTDATA/tree/main/$dir" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "::error::the report could not be pushed to $TESTDATA"; exit 1
