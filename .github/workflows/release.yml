name: Release

# Pushing a tag v* builds static binaries and publishes a GitHub release
# (a pre-release when the tag has a suffix such as -alpha.1).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux static (musl)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            name: x86_64-linux-musl
          - target: aarch64-unknown-linux-musl
            name: aarch64-linux-musl
            # No cross toolchain needed: pure Rust plus the self-contained
            # linker and CRT objects that rustup ships for musl.
            rustflags: "-C linker=rust-lld -C link-self-contained=yes"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p zvolrescue
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - name: Package
        run: |
          v=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^[vV]\.*//')
          out=zvolrescue-$v-${{ matrix.name }}
          cp target/${{ matrix.target }}/release/zvolrescue "$out"
          echo "$out" > artifact-name
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: zvolrescue-*-${{ matrix.name }}
          if-no-files-found: error

  freebsd:
    name: FreeBSD amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          prepare: pkg install -y rust
          run: |
            cargo build --release -p zvolrescue
            ./target/release/zvolrescue --version
      - name: Package
        run: |
          v=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^[vV]\.*//')
          cp target/release/zvolrescue "zvolrescue-$v-amd64-freebsd"
      - uses: actions/upload-artifact@v4
        with:
          name: amd64-freebsd
          path: zvolrescue-*-amd64-freebsd
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [linux, freebsd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and smoke test
        run: |
          cd dist
          chmod +x zvolrescue-*
          ./zvolrescue-*-x86_64-linux-musl --version
          sha256sum zvolrescue-* > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          # A tag is `vX.Y.Z`; accept `v.X.Y.Z` and `VX.Y.Z` too rather
          # than publishing files called `zvolrescue-.0.2.0-…`. The
          # version is what the binaries are named after, and the
          # CHANGELOG heading is looked up by it, not by the tag.
          v=$(printf '%s' "$tag" | sed 's/^[vV]\.*//')
          if [ "$tag" != "v$v" ]; then
            echo "::warning::tag $tag is not vX.Y.Z; releasing version $v"
          fi
          {
            echo "**zvolrescue $tag** — read-only extraction of zvols from ZFS pools that no longer import: labels, uberblocks, mirror/RAIDZ/dRAID reconstruction, every checksum and compression, encrypted datasets with a key."
            echo
            # Every 0.x release carries the validation caveat; 1.0 drops it.
            case "$v" in
              0.*) echo "> **0.x release.** Validated in CI against OpenZFS 2.2 *userland* pools (\`ztest\` + \`zdb\`) and on the environments listed in [docs/REALWORLD-TESTS.md](https://github.com/${GITHUB_REPOSITORY}/blob/$tag/docs/REALWORLD-TESTS.md); treat the output as evidence to verify, not as a finished recovery." ; echo ;;
            esac
            echo "## Downloads"
            echo
            echo "| File | Platform | Notes |"
            echo "|---|---|---|"
            echo "| \`zvolrescue-$v-x86_64-linux-musl\` | Linux x86_64 | static, runs on any distro or rescue medium |"
            echo "| \`zvolrescue-$v-aarch64-linux-musl\` | Linux aarch64 | static |"
            echo "| \`zvolrescue-$v-amd64-freebsd\` | FreeBSD 14.x amd64 | built on 14.2; works on mfsBSD |"
            echo "| \`SHA256SUMS\` | — | \`sha256sum -c SHA256SUMS\` |"
            echo
            echo "No installation: \`chmod +x\` and run. Nothing is ever written to the pool members."
            echo
            echo "## What is in $tag"
            echo
            # The version's section of CHANGELOG.md: from its heading to
            # the next "## ".
            awk -v want="v$v" '
              $0 ~ "^## " want { p=1; next }
              /^## / && p { exit }
              p { print }' CHANGELOG.md
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/$tag/CHANGELOG.md)."
          } > notes.md
          cat notes.md
          # An empty section means the CHANGELOG has no heading for this
          # version: publishing notes that say nothing is worse than
          # failing here, where it can still be fixed.
          if ! grep -q "^### " notes.md; then
            echo "::error::CHANGELOG.md has no '## v$v' section; nothing to say about this release"
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          name: zvolrescue ${{ github.ref_name }}
          files: dist/*
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
