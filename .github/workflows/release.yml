name: Release

# Pushing a tag v* builds static binaries and publishes a GitHub release
# (a pre-release when the tag has a suffix such as -alpha.1).
#
# It can also be run by hand for a tag that is already pushed. That is
# how a release is re-cut: a tag carries the workflow as it was when the
# tag was made, so a fix to this file only reaches a tag pushed after
# it — but a manual run uses the file from the branch it is started on.
# Delete the release (the tag can stay), then run this workflow from
# `main` with the tag as its input.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, e.g. v0.2.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The tag being released: the one pushed, or the one asked for by hand.
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  linux:
    name: Linux static (musl)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            name: x86_64-linux-musl
          - target: aarch64-unknown-linux-musl
            name: aarch64-linux-musl
            # No cross toolchain needed: pure Rust plus the self-contained
            # linker and CRT objects that rustup ships for musl.
            rustflags: "-C linker=rust-lld -C link-self-contained=yes"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p zvolrescue -p zvoltimeline -p zvolreport -p zvolcarve -p zvolfiles
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - name: Package
        run: |
          v=$(printf '%s' "$TAG" | sed 's/^[vV]\.*//')
          for b in zvolrescue zvoltimeline zvolreport zvolcarve zvolfiles; do
            cp "target/${{ matrix.target }}/release/$b" "$b-$v-${{ matrix.name }}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: zvol*-${{ matrix.name }}
          if-no-files-found: error

  freebsd:
    name: FreeBSD amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          prepare: pkg install -y rust
          run: |
            cargo build --release -p zvolrescue -p zvoltimeline -p zvolreport -p zvolcarve -p zvolfiles
            ./target/release/zvolrescue --version
            ./target/release/zvoltimeline --version
            ./target/release/zvolreport --version
            ./target/release/zvolcarve --version
            ./target/release/zvolfiles --version
      - name: Package
        run: |
          v=$(printf '%s' "$TAG" | sed 's/^[vV]\.*//')
          for b in zvolrescue zvoltimeline zvolreport zvolcarve zvolfiles; do
            cp "target/release/$b" "$b-$v-amd64-freebsd"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: amd64-freebsd
          path: zvol*-amd64-freebsd
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [linux, freebsd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and smoke test
        run: |
          cd dist
          chmod +x zvol*
          ./zvolrescue-*-x86_64-linux-musl --version
          ./zvoltimeline-*-x86_64-linux-musl --version
          ./zvolreport-*-x86_64-linux-musl --version
          ./zvolcarve-*-x86_64-linux-musl --version
          ./zvolfiles-*-x86_64-linux-musl --version
          sha256sum zvol* > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$TAG"
          # A tag is `vX.Y.Z`; accept `v.X.Y.Z` and `VX.Y.Z` too rather
          # than publishing files called `zvolrescue-.0.2.0-…`. The
          # version is what the binaries are named after, and the
          # CHANGELOG heading is looked up by it, not by the tag.
          v=$(printf '%s' "$tag" | sed 's/^[vV]\.*//')
          if [ "$tag" != "v$v" ]; then
            echo "::warning::tag $tag is not vX.Y.Z; releasing version $v"
          fi
          # What these binaries actually are: this version's section of
          # the CHANGELOG, plus every older one that never became a
          # release of its own, plus whatever `## Unreleased` still held
          # when the tag was made. A tag lands on the head of `main`, so
          # a version overtaken before anyone tagged it ships inside the
          # next one that is — and notes that print one section describe
          # a fraction of what is in the files.
          #
          # Which versions already had a release is asked of GitHub
          # rather than assumed, so this stays right when one is deleted.
          python3 .github/changelog-notes.py --self-test
          gh release list --limit 200 --json tagName --jq '.[].tagName' > released.txt
          echo "releases that already exist: $(tr '\n' ' ' < released.txt)"
          # The script refuses a version with no section, and one whose
          # section says nothing: publishing empty notes is worse than
          # failing here, where it can still be fixed.
          python3 .github/changelog-notes.py "$v" CHANGELOG.md released.txt > section.md
          # The programs, in the order they are meant to be read, and
          # what each is for. Checked against what the build actually
          # produced: a release that ships a binary its own notes never
          # mention is the same failure as notes describing files that
          # are not there.
          tools='zvolrescue|the pool, and a volume out of it: what the members hold, and the image of a zvol
          zvoltimeline|the pool history the transaction groups still carry: when a dataset was made, destroyed, and whether its space is still held
          zvolcarve|volumes no uberblock points at any more, found by scanning raw vdev space
          zvolfiles|files out of filesystem datasets: the tree with its metadata, or a raw object dump when the metadata is gone
          zvolreport|the evidence logs of the others as one document, hashed, signed and checkable by a third party'
          listed=$(printf '%s\n' "$tools" | cut -d'|' -f1 | sort)
          built=$(ls dist | sed -n "s/^\(zvol[a-z]*\)-$v-.*/\1/p" | sort -u)
          if [ "$listed" != "$built" ]; then
            echo "::error::the notes name [$(echo $listed)] but the build produced [$(echo $built)]"
            exit 1
          fi
          ntools=$(printf '%s\n' "$listed" | wc -l | tr -d ' ')
          nbins=$(ls dist | grep -c '^zvol')
          {
            echo "**zvolrescue $tag** — read-only extraction of zvols from ZFS pools that no longer import: labels, uberblocks, mirror/RAIDZ/dRAID reconstruction, every checksum and compression, encrypted datasets with a key."
            echo
            # Every 0.x release carries the validation caveat; 1.0 drops it.
            case "$v" in
              0.*) echo "> **0.x release.** Validated in CI against OpenZFS 2.2 *userland* pools (\`ztest\` + \`zdb\`) and on the environments listed in [docs/REALWORLD-TESTS.md](https://github.com/${GITHUB_REPOSITORY}/blob/$tag/docs/REALWORLD-TESTS.md); treat the output as evidence to verify, not as a finished recovery." ; echo ;;
            esac
            echo "## Downloads"
            echo
            echo "$nbins binaries: $ntools programs, each built for the same three platforms. The name is always **\`<program>-$v-<platform>\`**."
            echo
            echo "| Program | What it is for |"
            echo "|---|---|"
            printf '%s\n' "$tools" | while IFS='|' read -r name what; do
              echo "| \`$name\` | $what |"
            done
            echo
            echo "| Platform | \`<platform>\` | Notes |"
            echo "|---|---|---|"
            echo "| Linux x86_64 | \`x86_64-linux-musl\` | static; runs on any distribution, and on a rescue medium |"
            echo "| Linux aarch64 | \`aarch64-linux-musl\` | static |"
            echo "| FreeBSD 14.x amd64 | \`amd64-freebsd\` | built on 14.2; runs on mfsBSD |"
            echo
            echo "So the carver for Linux x86_64 is \`zvolcarve-$v-x86_64-linux-musl\`, and the FreeBSD main binary is \`zvolrescue-$v-amd64-freebsd\`."
            echo
            echo "\`SHA256SUMS\` covers all $nbins of them:"
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS   # or, on FreeBSD: sha256 -c SHA256SUMS"
            echo '```'
            echo
            echo "No installation: \`chmod +x\` and run. Every program opens the members read-only and never writes to the pool."
            echo
            echo "## What is in $tag"
            echo
            cat section.md
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/$tag/CHANGELOG.md)."
          } > notes.md
          cat notes.md
          # The release title carries the CHANGELOG section's own lead
          # line, so a release is named by what it did and not by its
          # number alone. Decided here, where the section is still in
          # hand, and handed to the next step in a file; a section with
          # no lead line falls back to the number.
          headline=$(sed -n 's/^\*\*\([^*]*\)\*\*.*/\1/p' section.md | head -1 | sed 's/[.:]$//')
          if [ -n "$headline" ]; then
            printf '%s' "zvolrescue $tag — $headline" > title.txt
          else
            printf '%s' "zvolrescue $tag" > title.txt
          fi
          cat title.txt; echo
      # The release is assembled as a draft and published only once it
      # carries every file. That order is right either way, and it is
      # the only one that works when release immutability is on
      # (Settings → General → Releases): with that setting a published
      # release is frozen, and every later call — attaching a file
      # included — comes back as a bare 403. Adding to a release that
      # already exists is therefore attempted, not assumed, and a
      # refusal is reported as what it is.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$TAG"
          title=$(cat title.txt)
          case "$tag" in *-*) pre="--prerelease" ;; *) pre="" ;; esac
          want=$(ls dist | wc -l)

          if gh release view "$tag" >/dev/null 2>&1; then
            draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
            echo "a release for $tag exists (draft=$draft): completing it"
            if ! gh release upload "$tag" dist/* --clobber ||
               ! gh release edit "$tag" --title "$title" --notes-file notes.md $pre; then
              echo "::error::the existing release for $tag could not be added to."
              echo "::error::A published release is frozen when release immutability is on"
              echo "::error::(Settings → General → Releases): nothing can be attached to it."
              echo "::error::Delete the release — the tag can stay — and cut it again:"
              echo "::error::Actions → Release → Run workflow from main, with $tag as the input."
              exit 1
            fi
          else
            echo "creating $tag as a draft, with every file"
            gh release create "$tag" dist/* --title "$title" --notes-file notes.md $pre --draft
          fi

          # Nothing is published half-built: the draft must carry every
          # file the build produced before it is frozen.
          have=$(gh release view "$tag" --json assets --jq '.assets | length')
          if [ "$have" != "$want" ]; then
            echo "::error::the draft has $have of $want files; not publishing an incomplete release"
            gh release view "$tag" --json assets --jq '.assets[].name'
            exit 1
          fi
          gh release edit "$tag" --draft=false
          gh release view "$tag" --json name,isDraft,isPrerelease,assets \
            --jq '"published \(.name) (draft=\(.isDraft) prerelease=\(.isPrerelease)) with \(.assets | length) file(s): " + (.assets | map(.name) | join(", "))'
