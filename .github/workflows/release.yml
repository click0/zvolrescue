name: Release

# Pushing a tag v* builds static binaries and publishes a GitHub release
# (a pre-release when the tag has a suffix such as -alpha.1).
#
# It can also be run by hand for a tag that is already pushed. That is
# how a release is re-cut: a tag carries the workflow as it was when the
# tag was made, so a fix to this file only reaches a tag pushed after
# it — but a manual run uses the file from the branch it is started on.
# Delete the release (the tag can stay), then run this workflow from
# `main` with the tag as its input.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, e.g. v0.2.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The tag being released: the one pushed, or the one asked for by hand.
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  linux:
    name: Linux static (musl)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            name: x86_64-linux-musl
          - target: aarch64-unknown-linux-musl
            name: aarch64-linux-musl
            # No cross toolchain needed: pure Rust plus the self-contained
            # linker and CRT objects that rustup ships for musl.
            rustflags: "-C linker=rust-lld -C link-self-contained=yes"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p zvolrescue
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - name: Package
        run: |
          v=$(printf '%s' "$TAG" | sed 's/^[vV]\.*//')
          out=zvolrescue-$v-${{ matrix.name }}
          cp target/${{ matrix.target }}/release/zvolrescue "$out"
          echo "$out" > artifact-name
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: zvolrescue-*-${{ matrix.name }}
          if-no-files-found: error

  freebsd:
    name: FreeBSD amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          prepare: pkg install -y rust
          run: |
            cargo build --release -p zvolrescue
            ./target/release/zvolrescue --version
      - name: Package
        run: |
          v=$(printf '%s' "$TAG" | sed 's/^[vV]\.*//')
          cp target/release/zvolrescue "zvolrescue-$v-amd64-freebsd"
      - uses: actions/upload-artifact@v4
        with:
          name: amd64-freebsd
          path: zvolrescue-*-amd64-freebsd
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [linux, freebsd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and smoke test
        run: |
          cd dist
          chmod +x zvolrescue-*
          ./zvolrescue-*-x86_64-linux-musl --version
          sha256sum zvolrescue-* > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        run: |
          tag="$TAG"
          # A tag is `vX.Y.Z`; accept `v.X.Y.Z` and `VX.Y.Z` too rather
          # than publishing files called `zvolrescue-.0.2.0-…`. The
          # version is what the binaries are named after, and the
          # CHANGELOG heading is looked up by it, not by the tag.
          v=$(printf '%s' "$tag" | sed 's/^[vV]\.*//')
          if [ "$tag" != "v$v" ]; then
            echo "::warning::tag $tag is not vX.Y.Z; releasing version $v"
          fi
          {
            echo "**zvolrescue $tag** — read-only extraction of zvols from ZFS pools that no longer import: labels, uberblocks, mirror/RAIDZ/dRAID reconstruction, every checksum and compression, encrypted datasets with a key."
            echo
            # Every 0.x release carries the validation caveat; 1.0 drops it.
            case "$v" in
              0.*) echo "> **0.x release.** Validated in CI against OpenZFS 2.2 *userland* pools (\`ztest\` + \`zdb\`) and on the environments listed in [docs/REALWORLD-TESTS.md](https://github.com/${GITHUB_REPOSITORY}/blob/$tag/docs/REALWORLD-TESTS.md); treat the output as evidence to verify, not as a finished recovery." ; echo ;;
            esac
            echo "## Downloads"
            echo
            echo "| File | Platform | Notes |"
            echo "|---|---|---|"
            echo "| \`zvolrescue-$v-x86_64-linux-musl\` | Linux x86_64 | static, runs on any distro or rescue medium |"
            echo "| \`zvolrescue-$v-aarch64-linux-musl\` | Linux aarch64 | static |"
            echo "| \`zvolrescue-$v-amd64-freebsd\` | FreeBSD 14.x amd64 | built on 14.2; works on mfsBSD |"
            echo "| \`SHA256SUMS\` | — | \`sha256sum -c SHA256SUMS\` |"
            echo
            echo "No installation: \`chmod +x\` and run. Nothing is ever written to the pool members."
            echo
            echo "## What is in $tag"
            echo
            # The version's section of CHANGELOG.md: from its heading to
            # the next "## ".
            awk -v want="v$v" '
              $0 ~ "^## " want { p=1; next }
              /^## / && p { exit }
              p { print }' CHANGELOG.md
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/$tag/CHANGELOG.md)."
          } > notes.md
          cat notes.md
          # An empty section means the CHANGELOG has no heading for this
          # version: publishing notes that say nothing is worse than
          # failing here, where it can still be fixed.
          if ! grep -q "^### " notes.md; then
            echo "::error::CHANGELOG.md has no '## v$v' section; nothing to say about this release"
            exit 1
          fi
      # This repository has release immutability enabled: once a release
      # is published, its assets and its tag are frozen, and every later
      # edit — including attaching a file — is refused. So the release is
      # assembled as a draft, checked while it can still be changed, and
      # published only when it is complete. A release that is already
      # published cannot be added to by anyone, so the job says that
      # plainly instead of failing on a bare 403.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$TAG"
          title="zvolrescue $tag"
          case "$tag" in *-*) pre="--prerelease" ;; *) pre="" ;; esac
          want=$(ls dist | wc -l)

          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::a published release already exists for $tag."
              echo "::error::With release immutability on, it cannot be added to or edited."
              echo "::error::Delete the release (the tag can stay) and re-run this job to cut it again."
              exit 1
            fi
            echo "a draft release for $tag exists: completing it"
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "$title" --notes-file notes.md $pre
          else
            echo "creating $tag as a draft, with every file"
            gh release create "$tag" dist/* --title "$title" --notes-file notes.md $pre --draft
          fi

          # Nothing is published half-built: the draft must carry every
          # file the build produced before it is frozen.
          have=$(gh release view "$tag" --json assets --jq '.assets | length')
          if [ "$have" != "$want" ]; then
            echo "::error::the draft has $have of $want files; not publishing an incomplete release"
            gh release view "$tag" --json assets --jq '.assets[].name'
            exit 1
          fi
          gh release edit "$tag" --draft=false
          gh release view "$tag" --json name,isDraft,isPrerelease,assets \
            --jq '"published \(.name) (draft=\(.isDraft) prerelease=\(.isPrerelease)) with \(.assets | length) file(s): " + (.assets | map(.name) | join(", "))'
