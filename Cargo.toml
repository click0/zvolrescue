[workspace]
resolver = "2"
members = [
    "crates/edonr",
    "crates/zfs-ondisk",
    "crates/zfs-read",
    "crates/zvolrescue-io",
    "crates/zvol-common",
    "crates/zvolrescue",
    "crates/zvoltimeline",
    "crates/zvolreport",
    "crates/zvolcarve",
    "crates/zvolfiles",
]

[workspace.package]
version = "0.7.1"
edition = "2021"
rust-version = "1.85"
license = "BSD-3-Clause"
repository = "https://github.com/click0/zvolrescue"
authors = ["Vladyslav V. Prodan"]

[workspace.dependencies]
zfs-ondisk = { path = "crates/zfs-ondisk" }
zfs-read = { path = "crates/zfs-read" }
zvolrescue-io = { path = "crates/zvolrescue-io" }
zvol-common = { path = "crates/zvol-common" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode", "safe-encode", "std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ruzstd = "0.9"
blake3 = { version = "1", default-features = false, features = ["pure", "std"] }
# Phase 3 (encrypted datasets): all pure Rust (RustCrypto).
aes = "0.8"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
ccm = "0.5"
hkdf = "0.12"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false }
sha1 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
