[workspace]
resolver = "2"
members = [
    "crates/zfs-ondisk",
    "crates/zfs-read",
    "crates/zvolrescue-io",
    "crates/zvolrescue",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "BSD-3-Clause"
repository = "https://github.com/click0/zvolrescue"
authors = ["Vladyslav V. Prodan"]

[workspace.dependencies]
zfs-ondisk = { path = "crates/zfs-ondisk" }
zfs-read = { path = "crates/zfs-read" }
zvolrescue-io = { path = "crates/zvolrescue-io" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
